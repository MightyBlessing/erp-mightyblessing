<title>마블 ERP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
  /* Layout: fixed left rail + content column; rail becomes a scrolling top bar on phones */
  :root{
    --paper:#F4F6F8; --card:#FFFFFF; --ink:#14171C; --muted:#5B6370; --faint:#8A929E;
    --line:#E1E5EB; --accent:#1F6F4A; --accent-soft:#E8F2EC;
    --warn:#A8600C; --warn-soft:#FBF0DF; --bad:#A33B33; --bad-soft:#FBECEA;
    --info:#2B5E93; --info-soft:#E7EFF7; --seal:#C0392B;
    --zero:#9AA2AE; --rail:#101418; --rail-ink:#C7CED8; --rail-on:#FFFFFF;
    --font-body:'Noto Sans KR', system-ui, sans-serif;
    --font-num:'Space Grotesk','Noto Sans KR', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0F1216; --card:#171B21; --ink:#E8EBF0; --muted:#98A1AD; --faint:#79828F;
      --line:#262C35; --accent:#4BA377; --accent-soft:#17291F;
      --warn:#D79A42; --warn-soft:#2A2113; --bad:#E0796E; --bad-soft:#2B1816;
      --info:#7FB0DE; --info-soft:#13202C; --seal:#E0796E;
      --zero:#6B7480; --rail:#080A0D; --rail-ink:#8F98A5; --rail-on:#FFFFFF;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F1216; --card:#171B21; --ink:#E8EBF0; --muted:#98A1AD; --faint:#79828F;
    --line:#262C35; --accent:#4BA377; --accent-soft:#17291F;
    --warn:#D79A42; --warn-soft:#2A2113; --bad:#E0796E; --bad-soft:#2B1816;
    --info:#7FB0DE; --info-soft:#13202C; --seal:#E0796E;
    --zero:#6B7480; --rail:#080A0D; --rail-ink:#8F98A5; --rail-on:#FFFFFF;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-body);
    font-size:14px; line-height:1.6; margin:0; padding:0}
  body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--rail)}

  .shell{display:grid; grid-template-columns:224px minmax(0,1fr); min-height:100%}
  @media (max-width:900px){ .shell{grid-template-columns:minmax(0,1fr)} }

  /* ---- rail ---- */
  .rail{background:var(--rail); color:var(--rail-ink); position:sticky; top:0; align-self:start;
    height:100vh; display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top,0px); padding-left:env(safe-area-inset-left,0px)}
  .rail .logo{padding:18px 18px 14px; color:#fff; font-weight:700; font-size:15px; letter-spacing:-.01em}
  .rail .logo small{display:block; font-weight:400; font-size:11px; color:var(--rail-ink); letter-spacing:.06em; margin-top:2px}
  .rail nav{display:flex; flex-direction:column; gap:2px; padding:4px 10px; overflow-y:auto}
  .rail button{display:flex; align-items:center; gap:9px; border:0; background:transparent; color:var(--rail-ink);
    font-family:inherit; font-size:13.5px; text-align:left; padding:9px 11px; border-radius:7px; cursor:pointer; width:100%}
  .rail button:hover{background:#1B222B; color:#fff}
  .rail button[aria-current=true]{background:#232C37; color:var(--rail-on); font-weight:700}
  .rail .ic{width:16px; text-align:center; flex:0 0 auto; opacity:.9}
  .rail .badge{margin-left:auto; background:var(--bad); color:#fff; font-size:10.5px; font-weight:700;
    border-radius:999px; padding:1px 6px; font-family:var(--font-num)}
  .rail .foot{margin-top:auto; padding:14px 18px; border-top:1px solid #1E252E; font-size:11.5px; color:#6E7784}
  @media (max-width:900px){
    .rail{height:auto; position:sticky; top:0; z-index:20}
    .rail .logo{padding:12px 16px 8px}
    .rail nav{flex-direction:row; overflow-x:auto; padding:0 10px 10px; gap:4px}
    .rail nav button{width:auto; white-space:nowrap}
    .rail .foot{display:none}
  }

  /* ---- content ---- */
  .main{min-width:0; display:flex; flex-direction:column}
  .bar{position:sticky; top:0; z-index:15; background:var(--paper); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:12px max(16px, env(safe-area-inset-right,0px)) 12px 20px}
  @media (max-width:900px){ .bar{top:0; position:static} }
  .bar h1{font-size:17px; font-weight:700; margin:0; letter-spacing:-.01em}
  .bar .who{margin-left:auto; display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted)}
  .bar .who img{width:24px; height:24px; border-radius:50%; display:block}
  .page{padding:20px; padding-left:max(20px, env(safe-area-inset-left,0px));
    padding-right:max(20px, env(safe-area-inset-right,0px)); padding-bottom:64px}

  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px}
  .card h2{font-size:12px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:0 0 12px}
  .stack{display:flex; flex-direction:column; gap:16px}
  .cols{display:grid; grid-template-columns:minmax(0,330px) minmax(0,1fr); gap:16px; align-items:start}
  @media (max-width:980px){ .cols{grid-template-columns:minmax(0,1fr)} }
  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px}
  .tile{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px}
  .tile .k{font-size:11.5px; color:var(--muted); font-weight:500}
  .tile .v{font-family:var(--font-num); font-variant-numeric:tabular-nums; font-size:23px; font-weight:700; margin-top:3px}
  .tile .s{font-size:11.5px; color:var(--faint); margin-top:1px}
  .tile.hot .v{color:var(--bad)}

  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:11px}
  .field label{font-size:12px; color:var(--muted); font-weight:500}
  input,select,textarea{font-family:inherit; font-size:14px; color:var(--ink); background:var(--paper);
    border:1px solid var(--line); border-radius:6px; padding:7px 9px; width:100%}
  textarea{resize:vertical}
  input[type=number]{font-family:var(--font-num); font-variant-numeric:tabular-nums}
  input:disabled,select:disabled,textarea:disabled{opacity:.6; cursor:not-allowed}
  :focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .hint{font-size:11.5px; color:var(--muted); margin:-5px 0 11px}

  .seg{display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden}
  .seg button{flex:1; border:0; background:var(--paper); color:var(--muted); font-family:inherit;
    font-size:12.5px; padding:7px 4px; cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--accent-soft); color:var(--accent); font-weight:700}

  .tabs{display:flex; gap:3px; flex-wrap:wrap; margin-bottom:14px}
  .tabs button{border:1px solid transparent; background:transparent; color:var(--muted); font-family:inherit;
    font-size:13px; padding:6px 11px; border-radius:7px; cursor:pointer}
  .tabs button[aria-pressed=true]{background:var(--card); border-color:var(--line); color:var(--ink); font-weight:700}
  .tabs .n{font-family:var(--font-num); font-size:11.5px; opacity:.75; margin-left:4px}

  .btn{border:1px solid var(--line); background:var(--card); color:var(--ink); font-family:inherit;
    font-size:13px; font-weight:500; padding:8px 14px; border-radius:6px; cursor:pointer}
  .btn:hover:not(:disabled){border-color:var(--accent)}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.danger{color:var(--bad); border-color:var(--bad)}
  .btn.sm{padding:5px 10px; font-size:12.5px}
  .actions{display:flex; flex-wrap:wrap; gap:8px}

  .pill{display:inline-flex; align-items:center; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap}
  .p-draft{background:var(--paper); color:var(--muted); border:1px solid var(--line)}
  .p-submitted,.p-pending{background:var(--warn-soft); color:var(--warn)}
  .p-progress{background:var(--info-soft); color:var(--info)}
  .p-approved{background:var(--accent-soft); color:var(--accent)}
  .p-paid{background:var(--accent); color:#fff}
  .p-rejected{background:var(--bad-soft); color:var(--bad)}
  .p-canceled{background:var(--paper); color:var(--zero); border:1px solid var(--line)}

  table{width:100%; border-collapse:collapse; font-size:13px}
  th{font-size:11px; letter-spacing:.04em; color:var(--muted); font-weight:700; text-align:left;
    padding:8px; border-bottom:1px solid var(--line); white-space:nowrap}
  td{padding:8px; border-bottom:1px solid var(--line); vertical-align:top}
  td.num,th.num{text-align:right; font-family:var(--font-num); font-variant-numeric:tabular-nums; white-space:nowrap}
  tr.off td{color:var(--zero)}
  .pay{font-weight:700}
  .capped{color:var(--warn)}
  .scroll{overflow-x:auto}
  tfoot td{border-top:2px solid var(--ink); border-bottom:0; padding-top:9px; font-weight:700}
  .rowlink{cursor:pointer}
  .rowlink:hover td{background:var(--accent-soft)}
  .desc{min-width:180px; font-size:12.5px; color:var(--muted); line-height:1.45}
  .ptsel{width:60px; padding:4px 6px; font-size:12px}
  .chk{width:16px; height:16px; accent-color:var(--accent)}
  .del{border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:15px; padding:0 4px}

  .chain,.base{border-radius:8px; padding:12px 14px; font-family:var(--font-num);
    font-variant-numeric:tabular-nums; font-size:13px}
  .chain{background:var(--paper); border:1px solid var(--line)}
  .base{background:var(--accent-soft); margin-top:14px}
  .chain div,.base div{display:flex; justify-content:space-between; gap:12px; padding:3px 0}
  .lab{font-family:var(--font-body); color:var(--muted)}
  .tot{border-top:1px solid var(--line); margin-top:6px; padding-top:7px; font-weight:700}
  .fin{border-top:1px solid var(--accent); margin-top:6px; padding-top:7px; font-weight:700; color:var(--accent)}

  .note{display:block; border-radius:8px; padding:10px 12px; font-size:12.5px; line-height:1.5; margin-top:12px}
  .n-warn{background:var(--warn-soft); color:var(--warn)}
  .n-bad{background:var(--bad-soft); color:var(--bad)}
  .n-info{background:var(--card); color:var(--muted); border:1px solid var(--line)}

  .steps{display:flex; flex-direction:column; gap:9px}
  .step{display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line); border-radius:8px}
  .step.done{background:var(--accent-soft); border-color:var(--accent-soft)}
  .step.now{border-color:var(--warn); background:var(--warn-soft)}
  .step.bad{border-color:var(--bad); background:var(--bad-soft)}
  .dot{width:20px; height:20px; border-radius:50%; flex:0 0 auto; display:grid; place-items:center;
    font-size:11px; font-weight:700; background:var(--paper); color:var(--muted); border:1px solid var(--line)}
  .step.done .dot{background:var(--accent); color:#fff; border-color:var(--accent)}
  .step.now .dot{background:var(--warn); color:#fff; border-color:var(--warn)}
  .step.bad .dot{background:var(--bad); color:#fff; border-color:var(--bad)}
  .step .t{font-weight:700; font-size:13px}
  .step .m{font-size:12px; color:var(--muted); line-height:1.5}

  .people{display:flex; flex-direction:column; gap:8px}
  .person{display:flex; align-items:center; gap:9px; padding:8px 10px; border:1px solid var(--line); border-radius:8px}
  .person img{width:26px; height:26px; border-radius:50%; display:block; flex:0 0 auto}
  .person .nm{flex:1; min-width:0; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .person select{width:auto; min-width:116px; font-size:12.5px; padding:5px 8px}

  .empty{text-align:center; padding:40px 16px; color:var(--muted)}
  .empty strong{display:block; color:var(--ink); font-size:15px; margin-bottom:6px}

  /* ---- 공문 미리보기 ---- */
  .doc{background:#fff; color:#15171a; border:1px solid var(--line); border-radius:8px; padding:30px 28px;
    font-size:13px; line-height:1.85}
  :root[data-theme="dark"] .doc, :root:not([data-theme="light"]) .doc{background:#F7F7F5}
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .doc{background:#fff} }
  .doc .dhead{position:relative; text-align:center; min-height:40px; display:flex;
    align-items:center; justify-content:center; margin:2px 0 12px}
  .doc .dhead .lg{position:absolute; left:0; top:50%; transform:translateY(-50%);
    height:34px; width:auto; object-fit:contain}
  .doc .org{font-size:25px; font-weight:700; letter-spacing:.06em}
  .doc .mark{font-size:12px; color:#8a6a2a; letter-spacing:.14em; font-weight:700}
  .doc hr{border:0; border-top:1px solid #E08A2E; margin:9px 0}
  .doc hr.thin{border-top:1px solid #E08A2E}
  .doc .to{margin:3px 0; display:flex; gap:8px; align-items:baseline}
  .doc .to i{font-style:normal; color:#4a4f57}
  .doc .to b{font-weight:400; color:#4a4f57; min-width:58px; letter-spacing:.34em; margin-right:-.34em}
  .doc ol.body{padding-left:19px; margin:12px 0}
  .doc ol.body li{margin-bottom:9px; text-align:justify}
  .doc table.ov{width:100%; border-collapse:collapse; margin:12px 0; font-size:12.5px}
  .doc table.ov th,.doc table.ov td{border:1px solid #c9cdd3; padding:6px 9px; vertical-align:top; color:#15171a}
  .doc table.ov th{width:96px; background:#F2F3F5; font-weight:500; text-align:left; white-space:nowrap}
  .doc .end{text-align:right; margin-top:10px}
  .doc .sign{text-align:center; margin:34px 0 10px; position:relative}
  .doc .sign .nm{font-size:19px; font-weight:700; letter-spacing:.02em; position:relative; display:inline-block}
  /* 직인은 발신명의 끝 글자에 걸쳐 찍는다. 실제 공문이 그렇게 생겼다. */
  .doc .sign .seal{position:absolute; right:-64px; top:50%; transform:translateY(-50%);
    width:54px; height:54px; border:2px solid var(--seal); color:var(--seal);
    border-radius:5px; font-size:9px; line-height:1.15; display:grid; place-items:center;
    opacity:.9; font-weight:700}
  .doc .issue{font-size:12px; color:#3f444b; display:grid; grid-template-columns:48px 1fr; gap:2px 10px}
  .doc .issue b{font-weight:400; color:#6b7078}
  .doc .sealimg{position:absolute; right:-40px; top:50%; transform:translateY(-50%);
    width:78px; height:78px; object-fit:contain; mix-blend-mode:multiply; pointer-events:none}
  .sealbox{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .sealbox img{width:74px; height:74px; object-fit:contain; border:1px solid var(--line); border-radius:6px; background:#fff; padding:4px}
  .sealbox img.wide{width:190px; height:56px}
  .rail .logo img{display:block; width:134px; height:auto; background:#fff;
    padding:7px 9px; border-radius:8px; margin-bottom:6px}

  /* ---- 인쇄 / PDF 저장 ---- */
  #printroot{display:none}
  @media print{
    @page{size:A4; margin:18mm 16mm}
    html,body{background:#fff !important}
    body.printing .shell{display:none !important}
    body.printing #printroot{display:block !important}
    #printroot .doc{border:0; border-radius:0; padding:0; background:#fff !important; font-size:13.5px}
    #printroot .doc *{color:#15171a}
    #printroot .doc .mark{color:#8a6a2a}
    #printroot .doc .sealimg{mix-blend-mode:normal}
    #printroot .doc hr{border-top-color:#E08A2E}
    #printroot .doc hr.thin{border-top-color:#E08A2E}
    #printroot .doc table.ov th{background:#F2F3F5}
    #printroot .doc table.ov th,#printroot .doc table.ov td{border-color:#c9cdd3}
    #printroot *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
    #errbar,#flashbar{display:none !important}
  }

  .kv{display:grid; grid-template-columns:96px minmax(0,1fr); gap:6px 10px; align-items:start}
  .kv .k{font-size:12px; color:var(--muted); padding-top:8px}
  .para{display:flex; gap:7px; align-items:flex-start; margin-bottom:7px}
  .para .n{font-family:var(--font-num); color:var(--muted); padding-top:8px; width:14px; flex:0 0 auto}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="printroot" aria-hidden="true"></div>

<div class="shell">
  <aside class="rail">
    <div class="logo">마블 ERP<small>MIGHTY BLESSING</small></div>
    <nav id="nav"></nav>
    <div class="foot">정산 · 전자결재 · 회계<br>마이티블레싱</div>
  </aside>
  <div class="main">
    <div class="bar"><h1 id="ptitle">마블 ERP</h1><span class="who" id="who"></span></div>
    <div class="page" id="app"><div class="card"><div class="empty"><strong>불러오는 중</strong>잠시만 기다려 주세요.</div></div></div>
  </div>
</div>

<script>
(function(){
  /* ============ 공통 ============ */
  var ROLE_LABEL={accounting:'회계',ceo:'대표',member:'팀원'};
  var SET_STATUS={draft:'작성중',submitted:'결재중',approved:'승인완료',paid:'지급완료'};
  var DOC_STATUS={draft:'작성중',submitted:'결재대기',progress:'승인진행중',approved:'승인완료',rejected:'반려',canceled:'취소'};
  var NAV=[{k:'dash',t:'대시보드',i:'▦'},{k:'docs',t:'전자결재',i:'✎'},{k:'acct',t:'회계',i:'▤'},{k:'settle',t:'정산',i:'₩'},{k:'roles',t:'역할',i:'⚙'}];
  var DOC_KIND={official:'공문',expense:'지출결의서'};
  /* 계정과목 — 장부 분류. 세무·결산에서 이 단위로 묶인다. */
  var ACCOUNTS=['사례비','인건비','임차료','장비·대여','재료비','인쇄·홍보','교통비','식비','수수료','기타'];
  var METHODS={bank:'계좌이체',card:'법인카드',cash:'현금'};
  var PAY_LABEL={pending:'지급대기',paid:'지급완료'};
  var OV_KEYS=['행사명','행사목적','일시','주관','주최/협력','세부장소','참석인원','기타(요청)사항'];
  var OV_LETTER=['가','나','다','라','마','바','사','자'];

  var S={db:null,user:null,me:{id:null,name:'',avatarUrl:'',canEdit:false,isOwner:false},
    canWrite:null,events:{},approvals:{},docs:{},roles:{},profiles:{},
    view:'dash',sel:null,docSel:null,docTab:'mine',acctTab:'pending',acctBy:'event',confirmPay:null,payMemo:'',logo:null,avatars:{},loading:true,stale:false,fatal:null,confirmDel:null,confirmDocDel:null,demo:false,sb:null,seal:null};

  var $=function(s,r){return (r||document).querySelector(s);};
  var app=$('#app');
  var won=function(n){return Math.round(n||0).toLocaleString('ko-KR')+'원';};
  var esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};
  var clone=function(o){ try{ return JSON.parse(JSON.stringify(o||{})); }catch(e){ return {}; } };
  var num=function(v,d){var n=parseFloat(v);return isNaN(n)?(d||0):n;};
  var today=function(){return new Date().toISOString().slice(0,10);};
  var nowISO=function(){return new Date().toISOString();};
  var shortTime=function(s){return String(s||'').slice(5,16).replace('T',' ');};

  function errbar(msg){
    try{
      var d=document.getElementById('errbar');
      if(!d){d=document.createElement('div');d.id='errbar';
        d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99;background:#A33B33;color:#fff;padding:8px 14px;font:12px/1.5 system-ui;white-space:pre-wrap';
        document.body.appendChild(d);}
      d.textContent='오류 — '+msg;
    }catch(e){}
  }
  window.addEventListener('error',function(e){errbar((e.message||'')+' @'+(e.lineno||'?'));});
  window.addEventListener('unhandledrejection',function(e){var r=e.reason||{};errbar('처리되지 않음: '+(r.code||r.message||String(r)));});

  function flash(msg){
    var n=document.createElement('div');n.textContent=msg;
    n.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--rail);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:50';
    document.body.appendChild(n);setTimeout(function(){n.remove();},2600);

  function writable(){return S.canWrite!==false;}

  /* ============ 정산 계산 ============ */
  function compute(ev){
    var net=ev.mode==='calc'?(num(ev.rev)-num(ev.opex)-num(ev.tax)):num(ev.net);
    var rate=num(ev.rate,150000),ratio=num(ev.ratio,50)/100,cap=num(ev.cap,300000),unit=num(ev.unit,10000)||1;
    var ms=ev.members||[];
    var workedCount=ms.filter(function(m){return m.w;}).length;
    var dayTotal=rate*workedCount, fundBase=Math.round(net*ratio);
    /* 기본: 사례비 예산 안에 당일 일급이 포함된다. 'opex'로 둔 행사만 운영비에서 따로 나간다. */
    var pool=ev.wageSrc==='opex'?fundBase:fundBase-dayTotal; if(pool<0)pool=0;
    var alloc=ms.map(function(){return 0;}),capped=ms.map(function(){return false;}),guard=0;
    while(guard++<12){
      var fixed=0,activePts=0;
      ms.forEach(function(m,i){if(capped[i])fixed+=alloc[i];else if(m.pt>0)activePts+=m.pt;});
      var left=pool-fixed; if(activePts<=0||left<=0)break;
      var per=left/activePts,newCap=false;
      ms.forEach(function(m,i){
        if(capped[i])return; if(!(m.pt>0)){alloc[i]=0;return;}
        var v=Math.floor((m.pt*per)/unit)*unit;
        if(v>=cap){v=cap;capped[i]=true;newCap=true;}
        alloc[i]=v;
      });
      if(!newCap||ev.capMode!=='redistribute')break;
    }
    var prepTotal=alloc.reduce(function(a,b){return a+b;},0);
    return {net:net,rate:rate,ratio:ratio,cap:cap,workedCount:workedCount,dayTotal:dayTotal,fundBase:fundBase,
      pool:pool,alloc:alloc,capped:capped,anyCap:capped.some(Boolean),prepTotal:prepTotal,
      leftover:pool-prepTotal,payTotal:dayTotal+prepTotal};
  }
  function accountingUids(){return Object.keys(S.roles).filter(function(u){return S.roles[u]==='accounting';});}
  function ceoUids(){return Object.keys(S.roles).filter(function(u){return S.roles[u]==='ceo';});}
  function apprOf(id){
    var out=[];Object.keys(S.approvals).forEach(function(k){var a=S.approvals[k];if(a&&a.eventId===id)out.push(a);});
    out.sort(function(a,b){return (a.at||'')<(b.at||'')?-1:1;});return out;
  }
  function progress(ev){
    var list=apprOf(ev.id),acc=accountingUids(),ceo=ceoUids();
    var okAcc=acc.filter(function(u){return list.some(function(a){return a.kind==='accounting'&&a.uid===u;});});
    var okCeo=list.filter(function(a){return a.kind==='ceo';});
    var confirms=list.filter(function(a){return a.kind==='confirm';});
    var accDone=acc.length>0&&okAcc.length===acc.length, ceoDone=okCeo.length>0;
    var derived=ev.status==='paid'?'paid':(ev.status==='submitted'&&accDone&&ceoDone)?'approved':(ev.status||'draft');
    return {list:list,acc:acc,ceo:ceo,okAcc:okAcc,confirms:confirms,accDone:accDone,ceoDone:ceoDone,status:derived};
  }

  /* ============ 전자결재 ============ */
  function docStatus(d){
    if(d.status==='draft'||d.status==='canceled'||d.status==='rejected')return d.status;
    var st=d.steps||[];
    if(st.some(function(s){return s.state==='rejected';}))return 'rejected';
    if(st.length&&st.every(function(s){return s.state==='approved';}))return 'approved';
    if(st.some(function(s){return s.state==='approved';}))return 'progress';
    return 'submitted';
  }
  function currentStep(d){
    var st=d.steps||[];
    for(var i=0;i<st.length;i++){ if(st[i].state==='pending') return i; }
    return -1;
  }
  function isMyTurn(d){
    var i=currentStep(d);
    return i>=0 && (d.steps[i].uid===S.me.id) && ['submitted','progress'].indexOf(docStatus(d))>=0;
  }
  function docList(tab){
    var all=Object.keys(S.docs).map(function(k){return S.docs[k];});
    all.sort(function(a,b){return (b.updatedAt||'')<(a.updatedAt||'')?-1:1;});
    if(tab==='mine')return all.filter(function(d){return d.drafter===S.me.id;});
    if(tab==='todo')return all.filter(isMyTurn);
    if(tab==='progress')return all.filter(function(d){return ['submitted','progress'].indexOf(docStatus(d))>=0;});
    if(tab==='approved')return all.filter(function(d){return docStatus(d)==='approved';});
    if(tab==='rejected')return all.filter(function(d){return docStatus(d)==='rejected';});
    return all;

  /* 문서번호.
     2026년까지는 제2024/2026 접두어로 14호까지 나갔다. 2027년부터는
     두 해를 한 회기로 묶어 제2027/2028, 제2029/2030 … 으로 간다.
     번호는 이미 있는 문서 중 가장 큰 것 다음으로 매긴다. */
  function docNoPrefix(y){
    if(y<=2026) return '마블 제2024/2026';
    var base=2027+Math.floor((y-2027)/2)*2;
    return '마블 제'+base+'/'+(base+1);
  }
  function pad3(n){ n=String(n); while(n.length<3) n='0'+n; return n; }
  function nextNo(kind){
    var y=new Date().getFullYear();
    var pre=(kind==='expense')?('마블 지출 '+docNoPrefix(y).replace('마블 제','')):docNoPrefix(y);
    var re=new RegExp('^'+pre.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'-(\\d+)호$');
    var mx=0;
    Object.keys(S.docs).forEach(function(k){
      var d=S.docs[k]; if(!d)return;
      if((d.type==='expense')!==(kind==='expense'))return;
      var m=re.exec(String(d.no||''));
      if(m){ var n=parseInt(m[1],10); if(n>mx) mx=n; }
    });
    /* 종이로 나간 공문이 이미 14호까지 있다. 앱에 기록이 없어도 15호부터. */
    if(!mx && kind!=='expense' && y<=2026) mx=14;
    return pre+'-'+pad3(mx+1)+'호';
  }

  /* 직인은 최종 승인된 문서에만 찍힌다. 그 전에는 자리만 표시한다. */
  function sealMark(d){
    if(docStatus(d)!=='approved') return '<span class="seal">직인<br>위치</span>';
    if(S.seal) return '<img class="sealimg" src="'+esc(S.seal)+'" alt="직인">';
    return '<span class="seal">직인<br>미등록</span>';
  }

  /* 브라우저 인쇄창을 열어 PDF로 저장하게 한다. 화면의 다른 요소는 숨기고
     공문 한 장만 A4에 올린다. 제목을 바꿔 두면 저장될 파일 이름이 된다. */
  function printDoc(d){
    var root=document.getElementById('printroot'); if(!root)return;
    root.innerHTML=docPreview(d);
    var oldTitle=document.title;
    var nm=[(d.no||'').replace(/[\\/:*?"<>|]/g,'-'),(d.subject||d.title||'공문')].filter(Boolean).join(' ');
    document.title=nm;
    document.body.classList.add('printing');
    var done=function(){
      document.body.classList.remove('printing');
      root.innerHTML=''; document.title=oldTitle;
      window.removeEventListener('afterprint',done);
    };
    window.addEventListener('afterprint',done);
    setTimeout(function(){ try{window.print();}catch(e){errbar('인쇄창을 열지 못했습니다');done();} setTimeout(done,1500); },80);
  }

  /* 원본 공문의 머리: 왼쪽에 로고, 가운데에 큰 기관명. */
  function docHead(title){
    return '<div class="dhead">'+
      (S.logo?'<img class="lg" src="'+esc(S.logo)+'" alt="마이티블레싱">':'')+
      '<span class="org">'+esc(title)+'</span></div>';
  }

  function docSteps(d){
    var st=docStatus(d), cur=currentStep(d);
    if(!(d.steps||[]).length) return '<div class="empty" style="padding:20px 8px">결재선이 지정되지 않았습니다.</div>';
    return '<div class="steps">'+d.steps.map(function(s,i){
      var cls=s.state==='approved'?' done':s.state==='rejected'?' bad':(i===cur&&st!=='draft'?' now':'');
      var msg=s.state==='approved'?('승인 · '+shortTime(s.at)):s.state==='rejected'?('반려 · '+shortTime(s.at)):(i===cur&&st!=='draft'?'결재 대기 중':'대기');
      return '<div class="step'+cls+'"><span class="dot">'+(s.state==='approved'?'✓':s.state==='rejected'?'✕':(i+1))+'</span>'+
        '<span><span class="t">'+esc(nameOf(s.uid))+'</span><br><span class="m">'+msg+(s.comment?' — '+esc(s.comment):'')+'</span></span></div>';
    }).join('')+'</div>';
  }
  function lineSearch(q){
    if(!S.user||!S.user.search)return;
    S.user.search(q).then(function(hits){

  function sg(id,label,on,ro){return '<button type="button" id="'+id+'" aria-pressed="'+(on?'true':'false')+'"'+(ro?' disabled':'')+'>'+label+'</button>';}
  function settleNote(c,ev){
    if(c.anyCap)return '<div class="note n-warn">1인 상한 '+won(c.cap)+'에 걸린 인원이 있습니다. 남는 '+won(c.leftover)+'은 현재 '+(ev.capMode==='redistribute'?'재배분':'이월')+' 처리입니다.</div>';
    if(c.net<=0)return '<div class="note n-warn">잔여액이 0 이하라 사례비 예산이 잡히지 않습니다. 지급 여부를 따로 정해야 합니다.</div>';
    if(c.pool===0&&c.net>0)return '<div class="note n-warn">준비 사례비 재원이 0원입니다. 당일 일급이 사례비 예산을 다 썼습니다.</div>';
    return '';
  }
  function settleApproval(ev,p){
    var role=myRole(),id=S.me.id,iAcc=role==='accounting',iCeo=role==='ceo';
    var did=function(k){return p.list.some(function(a){return a.kind===k&&a.uid===id;});};
    var roleless=p.acc.length===0||p.ceo.length===0;
    var steps=[
      stp(p.status!=='draft','1','상신',p.status==='draft'?'작성이 끝나면 상신하세요.':'결재 진행 중'),
      stp(p.accDone,'2','회계 승인',p.acc.length?(p.okAcc.length+' / '+p.acc.length+'명 승인'):'회계 역할이 지정되지 않았습니다'),
      stp(p.confirms.length>0,'3','팀원 확인',p.confirms.length+'명 확인함'),
      stp(p.ceoDone,'4','대표 승인',p.ceoDone?'승인됨':'대표 승인 대기'),
      stp(p.status==='paid','5','지급 완료',p.status==='paid'?'송금 완료':'지급 대기')
    ].join('');
    var btns=[];
    if(writable()){
      if(p.status==='draft')btns.push('<button class="btn primary" data-act="submit">상신</button>');
      if(p.status==='submitted'){
        if(iAcc&&!did('accounting'))btns.push('<button class="btn primary" data-act="accounting">회계 승인</button>');
        if(iCeo&&!did('ceo'))btns.push('<button class="btn primary" data-act="ceo">대표 승인</button>');
        if(!did('confirm'))btns.push('<button class="btn" data-act="confirm">확인했습니다</button>');
        if(iAcc||iCeo)btns.push('<button class="btn danger" data-act="reject">반려</button>');
      }
      if(p.status==='approved'&&iAcc)btns.push('<button class="btn primary" data-act="paid">지급 완료</button>');
      if(p.status==='approved'&&!did('confirm'))btns.push('<button class="btn" data-act="confirm">확인했습니다</button>');
    }
    var log=p.list.slice().reverse().map(function(a){
      var what={confirm:'확인',accounting:'회계 승인',ceo:'대표 승인',paid:'지급 완료',reject:'반려',submit:'상신'}[a.kind]||a.kind;
      return '<div style="display:flex;gap:8px;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px">'+
        '<span><b>'+esc(nameOf(a.uid))+'</b> · '+what+'</span><span style="color:var(--muted);white-space:nowrap">'+esc(shortTime(a.at))+'</span></div>';
    }).join('');
    return '<section class="card"><h2>결재</h2>'+
      (roleless?'<div class="note n-warn" style="margin:0 0 12px">회계·대표 역할이 아직 지정되지 않아 승인이 완료될 수 없습니다. 좌측 <b>역할</b>에서 지정하세요.</div>':'')+
      '<div class="steps">'+steps+'</div>'+
      (btns.length?'<div class="actions" style="margin-top:14px">'+btns.join('')+'</div>':'')+
      (log?'<h2 style="margin-top:18px">기록</h2>'+log:'')+'</section>';
  }
  function stp(done,n,t,m){
    return '<div class="step'+(done?' done':'')+'"><span class="dot">'+(done?'✓':n)+'</span>'+
      '<span><span class="t">'+t+'</span><br><span class="m">'+esc(m)+'</span></span></div>';
  }

  /* ---- 역할 ---- */
  /* ---- 회계 ---- */
  function expenses(){
    return Object.keys(S.docs).map(function(k){return S.docs[k];}).filter(function(d){return d&&d.type==='expense';});
  }
  function acctList(tab){
    var all=expenses().filter(function(d){return docStatus(d)==='approved';});
    if(tab==='pending') all=all.filter(function(d){return payState(d)==='pending';});
    if(tab==='paid')    all=all.filter(function(d){return payState(d)==='paid';});
    all.sort(function(a,b){
      var ka=(payState(a)==='paid'?((a.pay||{}).at||''):(a.dueDate||a.date||''));
      var kb=(payState(b)==='paid'?((b.pay||{}).at||''):(b.dueDate||b.date||''));
      return kb<ka?-1:1;
    });
    return all;
  }
  function groupKey(d,by){
    if(by==='account') return d.account||'기타';
    if(by==='method')  return METHODS[d.method]||'기타';
    var ev=d.eventId&&S.events[d.eventId];
    return ev?(ev.name||'(이름 없음)'):'행사 미지정';
  }

  function renderAcct(){
    var approved=expenses().filter(function(d){return docStatus(d)==='approved';});
    var pending=approved.filter(function(d){return payState(d)==='pending';});
    var paid=approved.filter(function(d){return payState(d)==='paid';});
    var inflight=expenses().filter(function(d){return ['submitted','progress'].indexOf(docStatus(d))>=0;});
    var sum=function(a){return a.reduce(function(x,d){return x+expTotal(d);},0);};
    var thisMonth=today().slice(0,7);
    var mPaid=paid.filter(function(d){return String((d.pay||{}).at||'').slice(0,7)===thisMonth;});

    var tabs=[['pending','지급 대기'],['paid','지급 완료'],['all','전체']];
    var list=acctList(S.acctTab);

    var g={}, order=[];
    paid.forEach(function(d){
      var k=groupKey(d,S.acctBy);
      if(!g[k]){ g[k]={n:0,v:0}; order.push(k); }
      g[k].n++; g[k].v+=expTotal(d);
    });
    order.sort(function(a,b){return g[b].v-g[a].v;});
    var gmax=order.reduce(function(a,k){return Math.max(a,g[k].v);},0)||1;
    var gtotal=order.reduce(function(a,k){return a+g[k].v;},0);

    var byLabel={event:'행사 / 사업',account:'계정과목',method:'지급 수단'};

    app.innerHTML=
      '<div class="stack">'+
      '<div class="tiles">'+
        tile('지급 대기', won(sum(pending)), pending.length+'건 · 승인됨', pending.length>0)+
        tile('이번 달 지급', won(sum(mPaid)), mPaid.length+'건')+
        tile('지급 완료 누계', won(sum(paid)), paid.length+'건')+
        tile('결재 중 지출', won(sum(inflight)), inflight.length+'건')+
      '</div>'+

      '<section class="card"><h2>'+byLabel[S.acctBy]+'별 지출</h2>'+
        '<div class="tabs" style="margin:0 0 12px">'+
          [['event','행사 / 사업'],['account','계정과목'],['method','지급 수단']].map(function(x){
            return '<button type="button" data-aby="'+x[0]+'" aria-pressed="'+(S.acctBy===x[0]?'true':'false')+'">'+x[1]+'</button>';
          }).join('')+'</div>'+
        (order.length
          ? '<div class="scroll"><table><thead><tr><th>'+byLabel[S.acctBy]+'</th><th class="num">건수</th><th class="num">금액</th><th style="width:34%">비중</th></tr></thead><tbody>'+
            order.map(function(k){
              var w=Math.max(2,Math.round(g[k].v/gmax*100));
              return '<tr><td><b>'+esc(k)+'</b></td><td class="num">'+g[k].n+'</td>'+
                '<td class="num" style="font-family:var(--font-num)">'+won(g[k].v)+'</td>'+
                '<td><div style="height:9px;border-radius:5px;background:var(--line)">'+
                  '<div style="height:9px;width:'+w+'%;border-radius:5px;background:var(--accent)"></div></div>'+
                  '<span style="font-size:11px;color:var(--muted)">'+Math.round(g[k].v/(gtotal||1)*100)+'%</span></td></tr>';
            }).join('')+
            '<tr><th>합계</th><th class="num">'+paid.length+'</th><th class="num" style="font-family:var(--font-num)">'+won(gtotal)+'</th><th></th></tr>'+
            '</tbody></table></div>'
          : '<div class="empty" style="padding:24px 8px">지급 완료된 지출이 아직 없습니다.</div>')+
        '<p class="hint" style="margin-top:10px">지급 완료된 건만 집계합니다. 승인만 되고 아직 안 나간 돈은 위 &lsquo;지급 대기&rsquo;에 있습니다.</p>'+
      '</section>'+

      '<section class="card"><h2>지출 목록</h2>'+
        '<div class="tabs" style="margin:0 0 12px">'+tabs.map(function(t){
          return '<button type="button" data-atab="'+t[0]+'" aria-pressed="'+(S.acctTab===t[0]?'true':'false')+'">'+t[1]+
            '<span class="n">'+acctList(t[0]).length+'</span></button>';
        }).join('')+'</div>'+
        (list.length
          ? '<div class="scroll"><table><thead><tr><th>제목</th><th>행사</th><th>계정과목</th><th>받는 사람</th><th class="num">금액</th><th>지급</th><th class="num">일자</th></tr></thead><tbody>'+
            list.map(function(d){
              var ps=payState(d), ev=d.eventId&&S.events[d.eventId];
              return '<tr class="rowlink" data-go="doc:'+esc(d.id)+'">'+
                '<td><b>'+esc(d.title||'(제목 없음)')+'</b><div style="font-size:12px;color:var(--muted)">'+esc(d.no||'')+'</div></td>'+
                '<td>'+esc(ev?(ev.name||''):'—')+'</td>'+
                '<td style="color:var(--muted)">'+esc(d.account||'—')+'</td>'+
                '<td>'+esc(d.payee||'—')+'</td>'+
                '<td class="num" style="font-family:var(--font-num)">'+won(expTotal(d))+'</td>'+
                '<td><span class="pill p-'+(ps==='paid'?'approved':'pending')+'">'+PAY_LABEL[ps]+'</span></td>'+
                '<td class="num" style="color:var(--muted)">'+esc(ps==='paid'?shortTime((d.pay||{}).at):(d.dueDate||d.date||''))+'</td></tr>';
            }).join('')+'</tbody></table></div>'
          : '<div class="empty"><strong>해당하는 지출이 없습니다</strong>전자결재에서 지출결의서를 올리면 여기에 모입니다.</div>')+
      '</section></div>';
  }

  function payExpense(d){
    if(!S.db||!d)return;
    if(docStatus(d)!=='approved') return errbar('승인이 끝난 문서만 지급 처리할 수 있습니다');
    if(payState(d)==='paid')      return errbar('이미 지급 처리된 건입니다');
    if(!(myRole()==='accounting'||S.me.canEdit)) return errbar('회계 역할을 가진 사람만 지급 처리할 수 있습니다');
    var body=clone(d); delete body.id;
    body.pay={state:'paid', at:nowISO(), by:S.me.id, memo:S.payMemo||'', amount:expTotal(d)};
    body.updatedAt=nowISO();
    S.db.doc('docs/'+d.id).set(body).then(function(){

  /* 올린 그림을 220px 정사각 PNG로 줄여서 config/seal 에 넣는다.
     원본을 그대로 담으면 문서 한 건이 수 MB가 되어 동기화가 느려진다. */
  function onSealFile(file){
    if(!file)return;
    if(file.size>8*1024*1024) return errbar('그림이 너무 큽니다 (8MB 이하)');
    var fr=new FileReader();
    fr.onerror=function(){errbar('파일을 읽지 못했습니다');};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){errbar('그림 형식을 읽지 못했습니다. PNG 또는 JPG로 올려주세요.');};
      img.onload=function(){
        var out;
        try{ out=trimImage(img,220); }catch(e){ return errbar('그림을 변환하지 못했습니다'); }
        if(!out) return errbar('직인을 찾지 못했습니다. 배경이 밝은 그림인지 확인해 주세요.');
        saveSeal(out);
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  }
  /* 올린 그림에서 흰 배경을 빼고, 인장 부분만 잘라 220px 정사각 PNG로 만든다.
     스캔한 직인은 대개 흰 종이 위에 찍혀 있어서, 그대로 쓰면 공문 글자를 가린다. */
  function trimImage(img,N){
    var W=img.width, H=img.height;
    var c0=document.createElement('canvas'); c0.width=W; c0.height=H;
    var x0=c0.getContext('2d'); x0.drawImage(img,0,0);
    var im=x0.getImageData(0,0,W,H), px=im.data;
    var minX=W, minY=H, maxX=-1, maxY=-1;
    for(var y=0;y<H;y++){
      for(var x=0;x<W;x++){
        var i=(y*W+x)*4, r=px[i], g=px[i+1], b=px[i+2], a=px[i+3];
        if(a<8){ continue; }
        var mx=Math.max(r,g,b), mn=Math.min(r,g,b);
        /* 밝고 색이 없는 화소 = 종이. 투명하게 만든다. */
        if(mn>205 && mx-mn<26){ px[i+3]=0; continue; }
        /* 옅은 회색 테두리는 부드럽게 깎아 계단을 줄인다 */
        if(mn>170 && mx-mn<26){ px[i+3]=Math.round(a*(205-mn)/35); if(px[i+3]<8) continue; }
        if(x<minX)minX=x; if(x>maxX)maxX=x;
        if(y<minY)minY=y; if(y>maxY)maxY=y;
      }
    }
    if(maxX<0) return null;
    x0.putImageData(im,0,0);
    var pad=Math.round(Math.max(maxX-minX,maxY-minY)*0.04);
    minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad);
    maxX=Math.min(W-1,maxX+pad); maxY=Math.min(H-1,maxY+pad);
    var cw=maxX-minX+1, ch=maxY-minY+1;
    var cv=document.createElement('canvas'); cv.width=N; cv.height=N;
    var ctx=cv.getContext('2d');
    ctx.imageSmoothingQuality='high';
    var r2=Math.min(N/cw,N/ch), dw=cw*r2, dh=ch*r2;
    ctx.drawImage(c0,minX,minY,cw,ch,(N-dw)/2,(N-dh)/2,dw,dh);
    return cv.toDataURL('image/png');
  }

  /* 로고는 가로로 긴 그림이라 정사각으로 자르면 안 된다. 흰 배경만 빼고
     긴 변을 560px에 맞춘다. */
  function trimWide(img,MW,MH){
    var sq=trimImage(img,Math.max(MW,MH)); if(!sq)return null;
    return sq;
  }
  /* 얼굴 사진은 배경을 빼면 안 된다(살구색·흰옷이 뚫린다). 가운데를 정사각으로
     자르고 줄이기만 한다. */
  function fitSquare(img,N){
    var cv=document.createElement('canvas'); cv.width=cv.height=N;
    var ctx=cv.getContext('2d'); ctx.imageSmoothingQuality='high';
    var side=Math.min(img.width,img.height);
    ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,N,N);
    return cv.toDataURL('image/jpeg',0.86);
  }
  function readImage(file,limitMB,done){
    if(!file)return;
    if(file.size>limitMB*1024*1024) return errbar('그림이 너무 큽니다 ('+limitMB+'MB 이하)');
    var fr=new FileReader();
    fr.onerror=function(){errbar('파일을 읽지 못했습니다');};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){errbar('그림 형식을 읽지 못했습니다. PNG 또는 JPG로 올려주세요.');};
      img.onload=function(){ try{ done(img); }catch(e){ errbar('그림을 변환하지 못했습니다'); } };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  }
  function onLogoFile(file){

      if(!S.db)return;
      S.db.doc('config/logo').set({dataUrl:out,updatedAt:nowISO()})
        .then(function(){ flash('로고를 등록했습니다'); })

    });
  }

    if(t.id==='newDoc') return newDoc('official');
    if(t.id==='newExp') return newDoc('expense');
    if(t.id==='dback'){ S.docSel=null; S.confirmDocDel=null; remember(); render(); return; }
    if(t.id==='docDel'){ S.confirmDocDel=S.docSel; render(); return; }
    if(t.id==='docDelNo'){ S.confirmDocDel=null; render(); return; }
    if(t.id==='docDelYes') return removeDoc();
    var dc=S.docSel&&S.docs[S.docSel];
    if(dc){
      if(t.id==='dpAdd'){ dc.paras=(dc.paras||[]).concat(['']); touch('doc',dc.id); render(); return; }
      if((el=t.closest('[data-dpdel]'))){ dc.paras.splice(+el.dataset.dpdel,1); touch('doc',dc.id); render(); return; }
      if(t.id==='ovAdd'){ dc.ov=(dc.ov||[]).concat([{k:'',v:''}]); touch('doc',dc.id); render(); return; }
      if((el=t.closest('[data-lndel]'))){ dc.steps.splice(+el.dataset.lndel,1); touch('doc',dc.id); render(); return; }
      if((el=t.closest('[data-lnadd]'))){
        dc.steps=(dc.steps||[]).concat([{uid:el.dataset.lnadd,state:'pending',comment:'',at:''}]);
        touch('doc',dc.id); render(); return;
      }
      if(t.id==='docCopy') return copyDoc(dc);
      if(t.id==='eiAdd'){ dc.items=(dc.items||[]).concat([{name:'',qty:1,price:0,note:''}]); touch('doc',dc.id); render(); return; }
      if((el=t.closest('[data-eidel]'))){ dc.items.splice(+el.dataset.eidel,1); touch('doc',dc.id); render(); return; }
      if(t.id==='payGo'){ var pm=$('#payMemo'); S.payMemo=pm?pm.value:''; S.confirmPay=dc.id; render(); return; }
      if(t.id==='payNo'){ S.confirmPay=null; render(); return; }
      if(t.id==='payYes') return payExpense(dc);
      if((el=t.closest('[data-dact]'))){
        if(el.dataset.dact==='pdf') return printDoc(dc);
        return docAct(dc, el.dataset.dact);
      }
    }

    /* 정산 */
    if(t.id==='back'){ S.sel=null; S.confirmDel=null; remember(); render(); return; }
    if(t.id==='newEv') return newEvent();
    if(t.id==='delEvent'){ S.confirmDel=S.sel; render(); return; }
    if(t.id==='delNo'){ S.confirmDel=null; render(); return; }

    if((el=t.closest('[data-del]'))&&ev){ ev.members.splice(+el.dataset.del,1); touch('ev',ev.id); render(); return; }
    if(t.id==='addRow'&&ev){ ev.members=(ev.members||[]).concat([{n:'이름',p:'',r:'',w:false,pt:0}]); touch('ev',ev.id); render(); return; }
    if(t.id==='copy'&&ev) return copyTable(ev);
    if(ev&&!saving){
      var map={mDirect:['mode','direct'],mCalc:['mode','calc'],sOpex:['wageSrc','opex'],sFund:['wageSrc','fund'],
               cCarry:['capMode','carry'],cRedist:['capMode','redistribute']};
      if(map[t.id]){ ev[map[t.id][0]]=map[t.id][1]; touch('ev',ev.id); render(); return; }
    }
    if((el=t.closest('[data-act]'))&&ev) return settleAct(ev,el.dataset.act);
    if((el=t.closest('[data-add]'))) return setRole(el.dataset.add,'member');
   }catch(err){ errbar('클릭 처리 중 '+(err&&err.message||err)); }
  });

      if(t.dataset&&t.dataset.ovk!==undefined){ dc.ov[+t.dataset.ovk].k=t.value; touch('doc',dc.id); return; }
      if(t.dataset&&t.dataset.ovv!==undefined){ dc.ov[+t.dataset.ovv].v=t.value; touch('doc',dc.id); return; }
    }
    var ev=S.sel&&S.events[S.sel]; if(!ev)return;
    if(t.dataset&&t.dataset.f!==undefined){
      var i=+t.dataset.i,fl=t.dataset.f;

    if(fmap[t.id]){ ev[fmap[t.id]]=t.value; touch('ev',ev.id); softNumbers(ev); }
   }catch(err){ errbar('입력 처리 중 '+(err&&err.message||err)); }

  document.addEventListener('change',function(e){

  /* 수량·단가를 칠 때마다 전체를 다시 그리면 글자가 튄다. 숫자만 갈아끼운다. */
  function softExpense(d){
    var tb=document.querySelector('tbody'); if(!tb)return;
    Array.prototype.forEach.call(tb.rows,function(tr,i){
      var it=d.items&&d.items[i]; if(!it)return;
      if(tr.cells[3]) tr.cells[3].textContent=won(num(it.qty,0)*num(it.price,0));
    });
    var tot=$('#xTotal'); if(tot) tot.textContent=won(expTotal(d));
  }

  function softNumbers(ev){
    var c=compute(ev),tb=document.querySelector('tbody'); if(!tb)return;
    Array.prototype.forEach.call(tb.rows,function(tr,i){
      var m=ev.members&&ev.members[i]; if(!m)return;
      var day=m.w?c.rate:0,prep=c.alloc[i]||0;
      if(tr.cells[5])tr.cells[5].textContent=day?day.toLocaleString('ko-KR'):'—';
      if(tr.cells[6])tr.cells[6].textContent=prep?prep.toLocaleString('ko-KR'):'—';
      if(tr.cells[7])tr.cells[7].textContent=(day+prep).toLocaleString('ko-KR');
    });
  }

  function loadScript(src){
    return new Promise(function(res,rej){

  function sbStore(sb){
    var cache={}, subs=[];
    function fire(col){ subs.forEach(function(s){ if(s.col===col){ try{s.fn();}catch(e){} } }); }
    function snapOf(col,id){
      var v=cache[col]&&cache[col][id];
      return {id:id,exists:!!v,data:function(){return v?clone(v):undefined;},metadata:{fromCache:false,hasPendingWrites:false}};
    }
    var loading={};
    function loadCol(col){
      if(loading[col])return; loading[col]=true;
      sb.from('docs').select('id,data').eq('collection',col).then(function(r){
        loading[col]=false;
        if(r.error){ errbar('불러오기 실패 ('+col+'): '+r.error.message); return; }
        cache[col]={};
        (r.data||[]).forEach(function(row){ cache[col][row.id]=row.data; });
        fire(col);
      });
    }
    sb.channel('mb-docs')
      .on('postgres_changes',{event:'*',schema:'public',table:'docs'},function(p){
        var row=(p.new&&p.new.collection)?p.new:p.old;
        if(!row||!row.collection)return;
        var col=row.collection; cache[col]=cache[col]||{};
        if(p.eventType==='DELETE') delete cache[col][row.id];
        else cache[col][row.id]=p.new.data;
        fire(col);
      }).subscribe();

    function chk(r){ if(r&&r.error) throw r.error; return r; }
    function docRef(col,id){
      var ref={
        id:id, path:col+'/'+id,
        get:function(){ return Promise.resolve(snapOf(col,id)); },
        set:function(b){
          cache[col]=cache[col]||{}; cache[col][id]=clone(b); fire(col);
          return sb.from('docs').upsert({collection:col,id:id,data:b,updated_at:new Date().toISOString()}).then(chk);
        },
        update:function(b){
          var cur=(cache[col]&&cache[col][id])||{}, next=clone(cur);
          Object.keys(b).forEach(function(k){ next[k]=b[k]; });
          return ref.set(next);
        },
        delete:function(){
          if(cache[col]) delete cache[col][id]; fire(col);
          return sb.from('docs').delete().eq('collection',col).eq('id',id).then(chk);
        },
        onSnapshot:function(next){
          subs.push({col:col,fn:function(){ next(snapOf(col,id)); }});
          loadCol(col); return function(){};
        }
      };
      return ref;
    }
    return {
      doc:function(p){ var a=p.split('/'); return docRef(a[0],a[1]); },
      collection:function(col){
        return {
          doc:function(id){ return docRef(col, id||('d'+Date.now()+Math.floor(Math.random()*1000))); },
          onSnapshot:function(next){
            subs.push({col:col,fn:function(){
              var m=cache[col]||{};
              next({docs:Object.keys(m).map(function(k){return snapOf(col,k);}),metadata:{fromCache:false}});
            }});
            loadCol(col); return function(){};
          }
        };
      }
    };
  }

              '<p class="hint" style="margin:0 0 14px">한 번 들어오면 이 브라우저에서는 로그인 상태가 유지됩니다. 매번 인증하지 않아도 됩니다.</p>'+
              '<div class="field"><label for="loginEmail">이메일</label>'+
              '<input id="loginEmail" type="email" placeholder="name@mightyblessing.com" autocomplete="email"></div>'+
              (msg?'<div class="note n-bad" style="margin:0 0 12px">'+esc(msg)+'</div>':'')+
              '<div class="actions"><button class="btn primary" id="loginGo">로그인 링크 받기</button></div>')+
        '</div></div>';
    if(!sent){
      var go=$('#loginGo'), box=$('#loginEmail');
      box.addEventListener('keydown',function(e){ if(e.key==='Enter') go.click(); });
      go.addEventListener('click',function(){
        var v=(box.value||'').trim();
        if(!v||v.indexOf('@')<0) return renderLogin(sb,'이메일 주소를 확인해 주세요.',false);
        go.disabled=true; go.textContent='보내는 중…';
        sb.auth.signInWithOtp({email:v,options:{emailRedirectTo:location.origin+location.pathname}})
          .then(function(r){
            if(r.error) return renderLogin(sb,loginError(r.error.message),false);
            renderLogin(sb,'',true);
          });
      });
    } else {
      $('#loginAgain').addEventListener('click',function(){ renderLogin(sb,'',false); });
    }
  }

  /* 슈파베이스가 돌려주는 영문 오류를 쓸 만한 안내로 바꾼다.
     허용되지 않은 도메인은 DB 트리거가 막기 때문에 "Database error" 로 올라온다. */
  function loginError(m){
    m=String(m||'');
    if(/Database error|Signups not allowed|not allowed|허용/i.test(m))
      return '이 주소로는 들어올 수 없습니다. 회사 메일(@mightyblessing.com)을 쓰시거나, 외부 주소라면 관리자에게 등록을 요청해 주세요.';
    if(/rate limit|too many/i.test(m))
      return '메일 발송 한도에 걸렸습니다. 잠시 뒤에 다시 시도해 주세요.';
    if(/invalid/i.test(m)) return '이메일 주소를 확인해 주세요.';
    return m;
  }

  function startSupabase(){
    S.loading=true; render();
    loadScript(SB_LIB).then(function(){
      var sb=window.supabase.createClient(window.MB_SUPABASE.url, window.MB_SUPABASE.anonKey, {
        auth:{
          persistSession:true,      /* 로그인 상태를 이 브라우저에 보관한다 */
          autoRefreshToken:true,    /* 만료 전에 조용히 갱신한다 */
          detectSessionInUrl:true   /* 메일 링크로 들어왔을 때 주소에서 토큰을 읽는다 */
          /* storageKey 는 건드리지 않는다. 이름을 바꾸면 이미 로그인한 사람의
             세션을 못 찾아 전원 다시 로그인하게 된다. */
        }
      });
      S.sb=sb;
      sb.auth.onAuthStateChange(function(ev){
        if(ev==='SIGNED_OUT') location.reload();
      });
      sb.auth.getSession().then(function(r){
        var session=r.data&&r.data.session;
        if(!session){ S.loading=false; return renderLogin(sb,'',false); }
        sb.from('members').select('uid,email,name,role').then(function(m){
          var map={};
          if(m.error) errbar('구성원을 불러오지 못했습니다: '+m.error.message);
          (m.data||[]).forEach(function(row){ map[row.uid]={email:row.email,name:row.name,role:row.role}; });
          wire(sbStore(sb), sbUser(session,map));
        });
      });
    }).catch(function(e){
      S.loading=false; S.fatal='슈파베이스 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'; render();
    });
  }

  /* ============ 부팅 ============ */
  function boot(){
    try{var s=JSON.parse(localStorage.getItem('mb-erp-nav')||'{}');
      if(s.v)S.view=s.v; if(s.s)S.sel=s.s; if(s.d)S.docSel=s.d;}catch(e){}
    renderNav();
    if(sbConfigured()) return startSupabase();
    var tries=0;
    (function wait(){
      if(window.claude&&typeof window.claude.use==='function')return start(window.claude);
      if(tries++>24){ return startDemo(); }
      setTimeout(wait,250);
    })();
  }
  function start(claude){
    Promise.all([claude.use('db'),claude.use('user')]).then(function(r){
      if(!r[0]) return startDemo();
      wire(r[0],r[1]);
    }).catch(function(){ startDemo(); });
  }
  function startDemo(){
    if(S.demo) return;
    S.demo=true; demoBanner();
    wire(demoStore(), demoUser());
  }
  function wire(db,user){
      S.db=db; S.user=user;
      if(S.user){
        S.user.me().then(function(me){
          S.me.id=me.id;S.me.name=me.name;S.me.avatarUrl=me.avatarUrl;S.me.canEdit=me.canEdit;S.me.isOwner=me.isOwner;
          var w=$('#who');
          if(w){
            w.innerHTML='<img alt=""><span></span>'+(S.sb?'<button class="btn sm" id="signOut" style="margin-left:6px">로그아웃</button>':'');
            w.querySelector('img').src=avatarOf(me.id);
            w.querySelector('span').textContent=(me.name||'익명')+' · '+ROLE_LABEL[myRole()];
          }
          render();
        });
        S.user.can('data.write').then(function(v){S.canWrite=v;render();});
      }
      var t=setTimeout(function(){if(S.loading){S.loading=false;S.stale=true;render();}},10000);
      var seen=false;
      S.db.collection('events').onSnapshot(function(snap){
        var next={};
        snap.docs.forEach(function(d){
          var o=clone(d.data()); o.id=d.id;
          next[d.id]=(dirty===d.id&&S.events[d.id])?S.events[d.id]:o;
        });
        S.events=next;
        if(!snap.metadata.fromCache&&!seen){seen=true;clearTimeout(t);S.stale=false;}
        S.loading=false; render();
      },function(e){clearTimeout(t);S.loading=false;S.fatal='데이터를 불러오지 못했습니다 ('+e.code+')';render();});

      S.db.collection('docs').onSnapshot(function(snap){
        var next={};
        snap.docs.forEach(function(d){
          var o=clone(d.data()); o.id=d.id;
          next[d.id]=(dirty===d.id&&S.docs[d.id])?S.docs[d.id]:o;
        });
        S.docs=next; resolveNames(); render();
      },function(){});

      S.db.collection('approvals').onSnapshot(function(snap){
        var next={}; snap.docs.forEach(function(d){next[d.id]=clone(d.data());});
        S.approvals=next; resolveNames(); render();
      },function(){});

      S.db.collection('profiles').onSnapshot(function(snap){
        var next={};
        snap.docs.forEach(function(d){ var o=d.data()||{}; if(o.avatar) next[d.id]=o.avatar; });
        S.avatars=next; render();
      },function(){});

      S.db.doc('config/logo').onSnapshot(function(d){
        S.logo=(d.exists&&d.data().dataUrl)||null; render();
      },function(){});

      S.db.doc('config/seal').onSnapshot(function(d){
        S.seal=(d.exists&&d.data().dataUrl)||null; render();
      },function(){});

      S.db.doc('config/roles').onSnapshot(function(d){
        var m=(d.exists&&d.data().map)?d.data().map:{};
        S.roles={}; Object.keys(m).forEach(function(k){S.roles[k]=m[k];});
        resolveNames(); render();
      },function(){});
  }
  boot();
})();
</script>
