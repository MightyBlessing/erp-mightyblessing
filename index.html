<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
</head>
<body>
<title>마블 ERP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  /* Layout: fixed left rail + content column; rail becomes a scrolling top bar on phones */
  /* 색과 글꼴은 크쇼·포도나무·라이브텍스트와 같은 언어를 쓴다.
     Pretendard, 먹색 잉크, 아주 밝은 종이, 둥근 모서리, 옅은 그림자.
     강조색은 로고의 보라다. */
  :root{
    --paper:#F7F7FA; --card:#FFFFFF; --ink:#12121A; --muted:#676573; --faint:#9A97A6;
    --line:#E9E8EF; --accent:#7A00FF; --accent-soft:#F3EAFF; --accent-ink:#5E00C4;
    --warn:#9A5B00; --warn-soft:#FFF3E0; --bad:#D1403A; --bad-soft:#FFECEA;
    --info:#2A5BD7; --info-soft:#EDF2FF; --seal:#C0392B;
    --zero:#A8A5B4; --rail:#12121A; --rail-ink:#A6A3B4; --rail-on:#FFFFFF;
    --rail-hover:#1E1D2A; --rail-active:#2A2838;
    --shadow:0 1px 2px rgba(18,18,26,.05), 0 10px 28px rgba(18,18,26,.055);
    --shadow-sm:0 1px 2px rgba(18,18,26,.05), 0 4px 12px rgba(18,18,26,.045);
    --r-card:14px; --r-ctl:10px;
    --font-body:'Pretendard Variable', Pretendard, -apple-system, system-ui, 'Apple SD Gothic Neo', sans-serif;
    --font-num:var(--font-body);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0D0D12; --card:#17171F; --ink:#ECEBF2; --muted:#9C99AB; --faint:#7D7A8B;
      --line:#262533; --accent:#A866FF; --accent-soft:#1F1630; --accent-ink:#C79BFF;
      --warn:#E0A355; --warn-soft:#2B2113; --bad:#F0837B; --bad-soft:#2E1818;
      --info:#89ADFF; --info-soft:#141A2B; --seal:#E0796E;
      --zero:#6E6B7C; --rail:#08080C; --rail-ink:#93909F; --rail-on:#FFFFFF;
      --rail-hover:#17161F; --rail-active:#242232;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
      --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0D0D12; --card:#17171F; --ink:#ECEBF2; --muted:#9C99AB; --faint:#7D7A8B;
    --line:#262533; --accent:#A866FF; --accent-soft:#1F1630; --accent-ink:#C79BFF;
    --warn:#E0A355; --warn-soft:#2B2113; --bad:#F0837B; --bad-soft:#2E1818;
    --info:#89ADFF; --info-soft:#141A2B; --seal:#E0796E;
    --zero:#6E6B7C; --rail:#08080C; --rail-ink:#93909F; --rail-on:#FFFFFF;
    --rail-hover:#17161F; --rail-active:#242232;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-body);
    font-size:14.5px; line-height:1.62; margin:0; padding:0;
    -webkit-font-smoothing:antialiased; letter-spacing:-.011em}
  body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--rail)}

  .shell{display:grid; grid-template-columns:224px minmax(0,1fr); min-height:100%}
  @media (max-width:900px){ .shell{grid-template-columns:minmax(0,1fr)} }

  /* ---- rail ---- */
  .rail{background:var(--rail); color:var(--rail-ink); position:sticky; top:0; align-self:start;
    height:100vh; display:flex; flex-direction:column; border-right:1px solid var(--line);
    padding-top:env(safe-area-inset-top,0px); padding-left:env(safe-area-inset-left,0px)}
  .rail .logo{padding:18px 18px 14px; color:#fff; font-weight:700; font-size:15px; letter-spacing:-.01em}
  .rail .logo small{display:block; font-weight:400; font-size:11px; color:var(--rail-ink); letter-spacing:.06em; margin-top:2px}
  .rail nav{display:flex; flex-direction:column; gap:2px; padding:4px 10px; overflow-y:auto}
  .rail button{display:flex; align-items:center; gap:9px; border:0; background:transparent; color:var(--rail-ink);
    font-family:inherit; font-size:13.5px; font-weight:500; letter-spacing:-.01em;
    text-align:left; padding:9px 11px; border-radius:9px; cursor:pointer; width:100%;
    transition:background .12s ease, color .12s ease}
  .rail button:hover{background:var(--rail-hover); color:#fff}
  .rail button[aria-current=true]{background:var(--rail-active); color:var(--rail-on); font-weight:700}
  .rail .ic{width:17px; height:17px; flex:0 0 auto; opacity:.8; display:grid; place-items:center}
  .rail .ic svg{width:17px; height:17px; display:block}
  .rail button:hover .ic,.rail button[aria-current=true] .ic{opacity:1}
  .rail .badge{margin-left:auto; background:var(--bad); color:#fff; font-size:10.5px; font-weight:700;
    border-radius:999px; padding:1px 6px; font-family:var(--font-num)}
  .rail .foot{margin-top:auto; padding:14px 18px; border-top:1px solid var(--rail-hover); font-size:11.5px; color:#6B6878}
  @media (max-width:900px){
    .rail{height:auto; position:sticky; top:0; z-index:20}
    .rail .logo{padding:12px 16px 8px}
    .rail nav{flex-direction:row; overflow-x:auto; padding:0 10px 10px; gap:4px}
    .rail nav button{width:auto; white-space:nowrap}
    .rail .foot{display:none}
  }

  /* ---- content ---- */
  .main{min-width:0; display:flex; flex-direction:column}
  .bar{position:sticky; top:0; z-index:15; background:color-mix(in srgb, var(--paper) 82%, transparent);
    -webkit-backdrop-filter:saturate(1.6) blur(12px); backdrop-filter:saturate(1.6) blur(12px);
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:13px max(16px, env(safe-area-inset-right,0px)) 13px 22px}
  @media (max-width:900px){ .bar{top:0; position:static} }
  .bar h1{font-size:19px; font-weight:700; margin:0; letter-spacing:-.03em}
  .bar .who{margin-left:auto; display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted)}
  .bar .who img{width:24px; height:24px; border-radius:50%; display:block}
  /* ---- 증빙 ---- */
  .evgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(124px,1fr)); gap:10px}
  .ev{position:relative; border:1px solid var(--line); border-radius:var(--r-ctl); overflow:hidden;
    background:var(--paper); display:flex; flex-direction:column}
  .ev .shot{display:block; width:100%; height:92px; border:0; padding:0; cursor:pointer;
    background:var(--paper) center/cover no-repeat; color:var(--faint)}
  .ev .shot.file{display:grid; place-items:center; font-size:11px; font-weight:700; letter-spacing:.04em}
  .ev .shot.file svg{width:22px; height:22px; margin-bottom:3px}
  .ev .cap{padding:7px 8px; font-size:11px; line-height:1.4; color:var(--muted); border-top:1px solid var(--line)}
  .ev .cap b{display:block; color:var(--ink); font-weight:600; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap}
  .ev .x{position:absolute; top:5px; right:5px; width:22px; height:22px; border-radius:7px;
    border:0; background:rgba(18,18,26,.62); color:#fff; font-size:14px; line-height:22px;
    cursor:pointer; padding:0}
  .ev .x:hover{background:var(--bad)}
  .ev.sure{outline:2px solid var(--bad); outline-offset:-2px}
  .drop{border:1.5px dashed var(--line); border-radius:var(--r-ctl); padding:18px 12px; text-align:center;
    color:var(--muted); font-size:12.5px; cursor:pointer; transition:border-color .12s, background .12s}
  .drop:hover,.drop.over{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink)}

  /* ---- 알림 ---- */
  .bar .bellwrap{margin-left:auto; display:flex}
  .bar .who{margin-left:0}
  .bell{border:1px solid var(--line); background:var(--card); color:var(--muted);
    width:34px; height:34px; border-radius:var(--r-ctl); display:grid; place-items:center;
    cursor:pointer; position:relative; padding:0; box-shadow:var(--shadow-sm)}
  .bell:hover{color:var(--ink); border-color:var(--faint)}
  .bell[aria-expanded=true]{color:var(--accent-ink); border-color:var(--accent); background:var(--accent-soft)}
  .bell svg{width:17px; height:17px; display:block}
  .bell .dot{position:absolute; top:-5px; right:-5px; min-width:17px; height:17px; padding:0 4px;
    background:var(--bad); color:#fff; border-radius:999px; font-size:10.5px; font-weight:700;
    line-height:17px; font-family:var(--font-num); border:2px solid var(--paper)}
  .bellpanel{position:fixed; top:58px; right:max(16px, env(safe-area-inset-right,0px));
    width:min(330px, calc(100vw - 32px));
    max-height:min(62vh, 460px); overflow:auto; z-index:60;
    background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); box-shadow:var(--shadow)}
  /* 좁은 화면에서는 종 아래에 매달지 않는다. 상단 바가 같이 흘러가 버려서
     패널이 화면 밖으로 나간다. 가운데 띄워서 항상 보이게 한다. */
  @media (max-width:700px){
    .bellpanel{left:14px; right:14px; top:50%; width:auto;
      transform:translateY(-50%); max-height:72vh}
  }
  .bellpanel h3{margin:0; padding:13px 15px 10px; font-size:12.5px; font-weight:700;
    border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px}
  .bellpanel h3 button{margin-left:auto; border:0; background:transparent; color:var(--accent-ink);
    font-family:inherit; font-size:11.5px; font-weight:600; cursor:pointer; padding:0}
  .nrow{display:flex; gap:9px; padding:11px 15px; border-bottom:1px solid var(--line);
    width:100%; border-left:0; border-right:0; border-top:0; background:transparent;
    font-family:inherit; text-align:left; color:var(--ink); cursor:pointer; align-items:flex-start}
  .nrow:last-child{border-bottom:0}
  .nrow:hover{background:var(--paper)}
  .nrow .mark{width:7px; height:7px; border-radius:50%; flex:0 0 auto; margin-top:7px; background:transparent}
  .nrow.unread .mark{background:var(--accent)}
  .nrow .tx{flex:1; min-width:0; font-size:12.8px; line-height:1.5}
  .nrow .tm{display:block; color:var(--faint); font-size:11px; margin-top:2px; font-family:var(--font-num)}
  .bellpanel .empty{padding:26px 15px}

  .page{padding:20px; padding-left:max(20px, env(safe-area-inset-left,0px));
    padding-right:max(20px, env(safe-area-inset-right,0px)); padding-bottom:64px}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-card);
    padding:18px; box-shadow:var(--shadow-sm)}
  /* 한글에 대문자 변환은 아무 일도 하지 않는다. 자간만 벌어져 읽기 나빠진다. */
  .card h2{font-size:13px; font-weight:700; letter-spacing:-.015em; color:var(--ink); margin:0 0 13px}
  .stack{display:flex; flex-direction:column; gap:16px}
  .cols{display:grid; grid-template-columns:minmax(0,330px) minmax(0,1fr); gap:16px; align-items:start}
  @media (max-width:980px){ .cols{grid-template-columns:minmax(0,1fr)} }
  /* 타일이 다섯 장으로 늘면서 금액이 두 줄로 꺾였다. 좁으면 줄을 바꿔 내려가게 둔다. */
  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px}
  .tile{background:var(--card); border:1px solid var(--line); border-radius:var(--r-card);
    padding:16px 18px; box-shadow:var(--shadow-sm)}
  .tile .k{font-size:12px; color:var(--muted); font-weight:500}
  .tile .v{font-family:var(--font-num); font-variant-numeric:tabular-nums; font-size:26px;
    font-weight:700; letter-spacing:-.035em; margin-top:4px}
  .tile .s{font-size:11.5px; color:var(--faint); margin-top:2px}
  .tile.hot .v{color:var(--bad)}

  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:11px}
  .field label{font-size:12px; color:var(--muted); font-weight:500}
  input,select,textarea{font-family:inherit; font-size:14px; color:var(--ink); background:var(--paper);
    border:1px solid var(--line); border-radius:var(--r-ctl); padding:9px 11px; width:100%;
    transition:border-color .12s ease, box-shadow .12s ease}
  input:hover:not(:disabled),select:hover:not(:disabled),textarea:hover:not(:disabled){border-color:var(--faint)}
  input:focus,select:focus,textarea:focus{outline:0; border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent)}
  textarea{resize:vertical}
  input[type=number]{font-family:var(--font-num); font-variant-numeric:tabular-nums}
  input:disabled,select:disabled,textarea:disabled{opacity:.6; cursor:not-allowed}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .hint{font-size:11.5px; color:var(--muted); margin:-5px 0 11px}

  .seg{display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden}
  .seg button{flex:1; border:0; background:var(--paper); color:var(--muted); font-family:inherit;
    font-size:12.5px; padding:7px 4px; cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--accent-soft); color:var(--accent-ink); font-weight:700}

  .tabs{display:flex; gap:3px; flex-wrap:wrap; margin-bottom:14px}
  .tabs button{border:1px solid transparent; background:transparent; color:var(--muted); font-family:inherit;
    font-size:13.5px; font-weight:500; padding:7px 13px; border-radius:999px; cursor:pointer;
    transition:background .12s ease, color .12s ease}
  .tabs button:hover{background:var(--card); color:var(--ink)}
  .tabs button[aria-pressed=true]{background:var(--accent-soft); border-color:transparent;
    color:var(--accent-ink); font-weight:700}
  .tabs .n{font-family:var(--font-num); font-size:11.5px; opacity:.75; margin-left:4px}

  .btn{border:1px solid var(--line); background:var(--card); color:var(--ink); font-family:inherit;
    font-size:13.5px; font-weight:600; letter-spacing:-.015em; padding:9px 16px;
    border-radius:var(--r-ctl); cursor:pointer; box-shadow:var(--shadow-sm);
    transition:border-color .12s ease, transform .12s ease, box-shadow .12s ease, background .12s ease}
  .btn:hover:not(:disabled){border-color:var(--faint); transform:translateY(-1px); box-shadow:var(--shadow)}
  .btn:active:not(:disabled){transform:translateY(0)}
  .btn:disabled{opacity:.45; cursor:not-allowed; box-shadow:none}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;
    box-shadow:0 1px 2px rgba(18,18,26,.1), 0 8px 20px color-mix(in srgb, var(--accent) 26%, transparent)}
  .btn.primary:hover:not(:disabled){border-color:var(--accent); filter:brightness(1.07)}
  .btn.danger{color:var(--bad); border-color:color-mix(in srgb, var(--bad) 40%, var(--line))}
  .btn.danger:hover:not(:disabled){border-color:var(--bad); background:var(--bad-soft)}
  .btn.sm{padding:6px 12px; font-size:12.5px}
  .actions{display:flex; flex-wrap:wrap; gap:8px}

  .pill{display:inline-flex; align-items:center; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap}
  .p-draft{background:var(--paper); color:var(--muted); border:1px solid var(--line)}
  .p-submitted,.p-pending{background:var(--warn-soft); color:var(--warn)}
  .p-progress{background:var(--info-soft); color:var(--info)}
  .p-approved{background:var(--accent-soft); color:var(--accent-ink)}
  .p-paid{background:var(--accent); color:#fff}
  .p-rejected{background:var(--bad-soft); color:var(--bad)}
  .p-canceled{background:var(--paper); color:var(--zero); border:1px solid var(--line)}

  table{width:100%; border-collapse:collapse; font-size:13px}
  th{font-size:12px; letter-spacing:-.01em; color:var(--muted); font-weight:600; text-align:left;
    padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
  td{padding:10px; border-bottom:1px solid var(--line); vertical-align:top}
  td.num,th.num{text-align:right; font-family:var(--font-num); font-variant-numeric:tabular-nums; white-space:nowrap}
  tr.off td{color:var(--zero)}
  .pay{font-weight:700}
  .capped{color:var(--warn)}
  .scroll{overflow-x:auto}
  tfoot td{border-top:2px solid var(--ink); border-bottom:0; padding-top:9px; font-weight:700}
  .rowlink{cursor:pointer}
  .rowlink:hover td{background:var(--accent-soft)}
  .rowlink:hover td:first-child{border-top-left-radius:8px; border-bottom-left-radius:8px}
  .rowlink:hover td:last-child{border-top-right-radius:8px; border-bottom-right-radius:8px}
  .desc{min-width:180px; font-size:12.5px; color:var(--muted); line-height:1.45}
  .ptsel{width:60px; padding:4px 6px; font-size:12px}
  .chk{width:16px; height:16px; accent-color:var(--accent)}
  .del{border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:15px; padding:0 4px}

  .chain,.base{border-radius:12px; padding:13px 15px; font-family:var(--font-num);
    font-variant-numeric:tabular-nums; font-size:13px}
  .chain{background:var(--paper); border:1px solid var(--line)}
  .base{background:var(--accent-soft); margin-top:14px}
  .chain div,.base div{display:flex; justify-content:space-between; gap:12px; padding:3px 0}
  .lab{font-family:var(--font-body); color:var(--muted)}
  .tot{border-top:1px solid var(--line); margin-top:6px; padding-top:7px; font-weight:700}
  .fin{border-top:1px solid var(--accent); margin-top:6px; padding-top:7px; font-weight:700; color:var(--accent)}

  .note{display:block; border-radius:12px; padding:11px 14px; font-size:13px; line-height:1.55; margin-top:12px}
  .n-warn{background:var(--warn-soft); color:var(--warn)}
  .n-bad{background:var(--bad-soft); color:var(--bad)}
  .n-info{background:var(--card); color:var(--muted); border:1px solid var(--line)}

  .steps{display:flex; flex-direction:column; gap:9px}
  .step{display:flex; gap:10px; align-items:flex-start; padding:11px 13px; border:1px solid var(--line); border-radius:12px}
  .step.done{background:var(--accent-soft); border-color:var(--accent-soft)}
  .step.now{border-color:var(--warn); background:var(--warn-soft)}
  .step.bad{border-color:var(--bad); background:var(--bad-soft)}
  .dot{width:20px; height:20px; border-radius:50%; flex:0 0 auto; display:grid; place-items:center;
    font-size:11px; font-weight:700; background:var(--paper); color:var(--muted); border:1px solid var(--line)}
  .step.done .dot{background:var(--accent); color:#fff; border-color:var(--accent)}
  .step.now .dot{background:var(--warn); color:#fff; border-color:var(--warn)}
  .step.bad .dot{background:var(--bad); color:#fff; border-color:var(--bad)}
  .step .t{font-weight:700; font-size:13px}
  .step .m{font-size:12px; color:var(--muted); line-height:1.5}

  .people{display:flex; flex-direction:column; gap:8px}
  .person{display:flex; align-items:center; gap:10px; padding:9px 11px; border:1px solid var(--line); border-radius:12px}
  .person img{width:26px; height:26px; border-radius:50%; display:block; flex:0 0 auto}
  .person .nm{flex:1; min-width:0; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .person select{width:auto; min-width:116px; font-size:12.5px; padding:5px 8px}

  .empty{text-align:center; padding:40px 16px; color:var(--muted)}
  .empty strong{display:block; color:var(--ink); font-size:15.5px; font-weight:700; letter-spacing:-.02em; margin-bottom:6px}

  /* ---- 공문 미리보기 ---- */
  .doc{background:#fff; color:#15171a; border:1px solid var(--line); border-radius:8px; padding:30px 28px;
    font-size:13px; line-height:1.85}
  :root[data-theme="dark"] .doc, :root:not([data-theme="light"]) .doc{background:#F7F7F5}
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .doc{background:#fff} }
  .doc .dhead{position:relative; text-align:center; min-height:40px; display:flex;
    align-items:center; justify-content:center; margin:2px 0 12px}
  .doc .dhead .lg{position:absolute; left:0; top:50%; transform:translateY(-50%);
    height:34px; width:auto; object-fit:contain}
  .doc .org{font-size:25px; font-weight:700; letter-spacing:.06em}

              return B.put(d.id,f.name,'image/jpeg',b).then(function(m){ m.th=th; added.push(m); });
            });
          });
        }
        return B.put(d.id,f.name,f.type||'application/octet-stream',f).then(function(m){ added.push(m); });
      }).catch(function(e){
        var msg=(e&&(e.message||e.error||e.code))||'';
        if(/bucket/i.test(String(msg))) msg='증빙 보관함(evidence)이 아직 없습니다. supabase/storage.sql 을 한 번 실행해 주세요.';
        errbar((f.name||'파일')+' — '+msg);
      });
    });
    seq.then(function(){
      S.upBusy=false;
      if(!added.length) return render();
      var cur=S.docs[d.id]; if(!cur) return render();
      cur.files=evFiles(cur).concat(added);
      var body=clone(cur); delete body.id; body.updatedAt=nowISO();
      S.db.doc('docs/'+cur.id).set(body)
        .then(function(){ flash('증빙 '+added.length+'개를 첨부했습니다'); render(); })
        .catch(function(e){ errbar('증빙 기록 실패 '+(e&&e.code||'')); render(); });
    });
  }
  function openEvidence(i){
    var d=S.docSel&&S.docs[S.docSel]; if(!d)return;

    /* 주소를 받아온 뒤에 창을 열면 팝업 차단에 걸린다. 먼저 빈 창을 띄워 둔다. */

  function removeEvidence(i){
    var d=S.docSel&&S.docs[S.docSel]; if(!d||!S.db)return;

  function kb(n){

    else if(!fs.length&&st==='draft') warn='<p class="hint" style="margin:0 0 10px">영수증·견적서를 미리 붙여두면 결재자가 바로 확인할 수 있습니다.</p>';

  /* ============ 알림 ============ */
  /* 알림은 docs 저장소의 notifs 컬렉션에 한 줄씩 쌓인다.
     to 는 받을 사람 uid 배열, 또는 전원을 뜻하는 '*'.
     읽은 시각은 사람마다 profiles/<uid>.notifReadAt 한 칸에만 적는다.
     알림마다 사람 수만큼 읽음 표시를 만들면 금방 불어난다. */
  function allUids(){
    var m={};
    if(S.user&&S.user.ids) S.user.ids().forEach(function(u){m[u]=1;});
    Object.keys(S.roles).forEach(function(u){m[u]=1;});
    Object.keys(S.profileRows).forEach(function(u){m[u]=1;});
    return Object.keys(m);
  }
  function notify(to,text,docId){
    if(!S.db||!S.me.id)return;
    var list;
    if(to==='*'){ list='*'; }
    else {
      list=(Array.isArray(to)?to:[to]).filter(function(u){return u&&u!==S.me.id;});
      /* 중복 제거 — 같은 사람이 결재선에 두 번 들어갈 수 있다 */
      list=list.filter(function(u,i){return list.indexOf(u)===i;});
      if(!list.length)return;
    }
    var id='n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    S.db.doc('notifs/'+id).set({to:list,text:text,doc:docId||'',by:S.me.id,at:nowISO()})
      .catch(function(){});
    pruneNotifs();
  }
  /* 90일이 지난 알림은 지운다. 아무도 안 치우면 영원히 쌓인다. */
  function pruneNotifs(){
    if(!S.db)return;
    var cut=new Date(Date.now()-90*86400000).toISOString();
    Object.keys(S.notifs).forEach(function(k){
      if((S.notifs[k].at||'')<cut) S.db.doc('notifs/'+k).delete().catch(function(){});
    });
  }
  function notifsFor(){
    var me=S.me.id; if(!me)return [];
    return Object.keys(S.notifs).map(function(k){ var o=clone(S.notifs[k]); o.id=k; return o; })
      .filter(function(n){
        if(n.by===me) return false;                       /* 내가 만든 알림은 나한테 안 온다 */
        return n.to==='*' || (Array.isArray(n.to)&&n.to.indexOf(me)>=0);
      })
      .sort(function(a,b){ return (a.at||'')<(b.at||'')?1:-1; })
      .slice(0,60);
  }
  function unreadCount(){
    var r=S.notifReadAt||'';
    return notifsFor().filter(function(n){return (n.at||'')>r;}).length;
  }
  function saveProfile(patch){
    if(!S.db||!S.me.id)return Promise.resolve();
    /* 아직 내 행을 못 받았으면 쓰지 않는다. set 은 통째로 덮어쓰므로
       지금 쓰면 남아 있던 프로필 사진이 사라진다. */
    if(!S.profilesLoaded)return Promise.resolve();
    var body=clone(S.myProfile||{});
    Object.keys(patch).forEach(function(k){ body[k]=patch[k]; });
    body.updatedAt=nowISO();
    S.myProfile=body;
    return S.db.doc('profiles/'+S.me.id).set(body);
  }
  function markNotifsRead(){
    S.notifReadAt=nowISO();
    saveProfile({notifReadAt:S.notifReadAt}).catch(function(){});
  }
  function syncMyProfile(){
    if(!S.me.id||!S.profilesLoaded)return;
    var row=S.profileRows[S.me.id];
    S.myProfile=row||S.myProfile;
    S.notifReadAt=(row&&row.notifReadAt)||S.notifReadAt||'';
    announceJoin(S.profileRows);
  }
  var joinAnnounced=false;
  /* 처음 들어온 사람은 자기 손으로 "합류했습니다"를 띄운다.
     members 행이 만들어진 지 14일이 넘었으면 기존 사람이므로 조용히 넘어간다.
     (이 기능을 붙이기 전부터 쓰던 사람들이 한꺼번에 '신규'로 뜨는 걸 막는다) */
  function announceJoin(rows){
    if(joinAnnounced||!S.me.id||!S.db)return;
    joinAnnounced=true;
    if(rows[S.me.id])return;
    var fresh=!S.me.joinedAt || (Date.now()-Date.parse(S.me.joinedAt))<14*86400000;
    saveProfile({avatar:'',joinedAt:nowISO(),notifReadAt:nowISO()}).then(function(){
      if(fresh) notify('*', (S.me.name||'새 사용자')+' 님이 마블 ERP에 합류했습니다', '');
    }).catch(function(){});
  }
  function docLabel(d){ return (d.subject||d.title||'문서'); }
  /* 결재가 움직일 때마다 관련된 사람에게만 보낸다. */
  function notifyDoc(d,kind){
    var me=S.me.name||'누군가', ttl='「'+docLabel(d)+'」';
    var pend=(d.steps||[]).filter(function(x){return x.state!=='approved'&&x.state!=='rejected';})
                          .map(function(x){return x.uid;});
    var next=pend[0];
    if(kind==='submit'){
      if(next) notify(next, '결재 차례입니다 — '+ttl, d.id);
      var others=allUids().filter(function(u){return pend.indexOf(u)<0;});
      notify(others, me+' 님이 '+ttl+'을(를) 기안했습니다', d.id);
    }
    else if(kind==='approve'){
      if(next){
        notify(next, '결재 차례입니다 — '+ttl, d.id);
        notify(d.drafter, me+' 님이 '+ttl+'을(를) 승인했습니다', d.id);
      }else{
        notify(d.drafter, ttl+'이(가) 최종 승인되었습니다', d.id);
        if(d.type==='expense') notify(accountingUids(), ttl+' 지급 처리를 기다립니다', d.id);
      }
    }
    else if(kind==='reject') notify(d.drafter, me+' 님이 '+ttl+'을(를) 반려했습니다', d.id);
    else if(kind==='cancel') notify(pend, me+' 님이 '+ttl+' 결재를 취소했습니다', d.id);
  }

  /* ============ 정산 계산 ============ */
  function compute(ev){
    var net=ev.mode==='calc'?(num(ev.rev)-num(ev.opex)-num(ev.tax)):num(ev.net);
    var rate=num(ev.rate,150000),ratio=num(ev.ratio,50)/100,cap=num(ev.cap,300000),unit=num(ev.unit,10000)||1;
    var ms=ev.members||[];
    var workedCount=ms.filter(function(m){return m.w;}).length;
    var dayTotal=rate*workedCount, fundBase=Math.round(net*ratio);
    /* 기본: 사례비 예산 안에 당일 일급이 포함된다. 'opex'로 둔 행사만 운영비에서 따로 나간다. */
    var pool=ev.wageSrc==='opex'?fundBase:fundBase-dayTotal; if(pool<0)pool=0;
    var alloc=ms.map(function(){return 0;}),capped=ms.map(function(){return false;}),guard=0;
    while(guard++<12){
      var fixed=0,activePts=0;
      ms.forEach(function(m,i){if(capped[i])fixed+=alloc[i];else if(m.pt>0)activePts+=m.pt;});
      var left=pool-fixed; if(activePts<=0||left<=0)break;
      var per=left/activePts,newCap=false;
      ms.forEach(function(m,i){
        if(capped[i])return; if(!(m.pt>0)){alloc[i]=0;return;}
        var v=Math.floor((m.pt*per)/unit)*unit;
        if(v>=cap){v=cap;capped[i]=true;newCap=true;}
        alloc[i]=v;
      });
      if(!newCap||ev.capMode!=='redistribute')break;
    }
    var prepTotal=alloc.reduce(function(a,b){return a+b;},0);
    return {net:net,rate:rate,ratio:ratio,cap:cap,workedCount:workedCount,dayTotal:dayTotal,fundBase:fundBase,
      pool:pool,alloc:alloc,capped:capped,anyCap:capped.some(Boolean),prepTotal:prepTotal,
      leftover:pool-prepTotal,payTotal:dayTotal+prepTotal};
  }
  function accountingUids(){return Object.keys(S.roles).filter(function(u){return S.roles[u]==='accounting';});}
  function ceoUids(){return Object.keys(S.roles).filter(function(u){return S.roles[u]==='ceo';});}
  function apprOf(id){
    var out=[];Object.keys(S.approvals).forEach(function(k){var a=S.approvals[k];if(a&&a.eventId===id)out.push(a);});
    out.sort(function(a,b){return (a.at||'')<(b.at||'')?-1:1;});return out;
  }
  function progress(ev){
    var list=apprOf(ev.id),acc=accountingUids(),ceo=ceoUids();
    var okAcc=acc.filter(function(u){return list.some(function(a){return a.kind==='accounting'&&a.uid===u;});});
    var okCeo=list.filter(function(a){return a.kind==='ceo';});
    var confirms=list.filter(function(a){return a.kind==='confirm';});
    var accDone=acc.length>0&&okAcc.length===acc.length, ceoDone=okCeo.length>0;
    var derived=ev.status==='paid'?'paid':(ev.status==='submitted'&&accDone&&ceoDone)?'approved':(ev.status||'draft');
    return {list:list,acc:acc,ceo:ceo,okAcc:okAcc,confirms:confirms,accDone:accDone,ceoDone:ceoDone,status:derived};
  }

  /* ============ 전자결재 ============ */
  function docStatus(d){
    if(d.status==='draft'||d.status==='canceled'||d.status==='rejected')return d.status;
    var st=d.steps||[];
    if(st.some(function(s){return s.state==='rejected';}))return 'rejected';
    if(st.length&&st.every(function(s){return s.state==='approved';}))return 'approved';
    if(st.some(function(s){return s.state==='approved';}))return 'progress';
    return 'submitted';
  }
  function currentStep(d){
    var st=d.steps||[];
    for(var i=0;i<st.length;i++){ if(st[i].state==='pending') return i; }
    return -1;
  }
  function isMyTurn(d){
    var i=currentStep(d);
    return i>=0 && (d.steps[i].uid===S.me.id) && ['submitted','progress'].indexOf(docStatus(d))>=0;
  }
  function docList(tab){
    var all=Object.keys(S.docs).map(function(k){return S.docs[k];});
    all.sort(function(a,b){return (b.updatedAt||'')<(a.updatedAt||'')?-1:1;});
    if(tab==='mine')return all.filter(function(d){return d.drafter===S.me.id;});
    if(tab==='todo')return all.filter(isMyTurn);
    if(tab==='progress')return all.filter(function(d){return ['submitted','progress'].indexOf(docStatus(d))>=0;});
    if(tab==='approved')return all.filter(function(d){return docStatus(d)==='approved';});
    if(tab==='rejected')return all.filter(function(d){return docStatus(d)==='rejected';});
    return all;
  }
  /* 문서번호.
     2026년까지는 제2024/2026 접두어로 14호까지 나갔다. 2027년부터는
     두 해를 한 회기로 묶어 제2027/2028, 제2029/2030 … 으로 간다.
     번호는 이미 있는 문서 중 가장 큰 것 다음으로 매긴다. */
  function docNoPrefix(y){
    if(y<=2026) return '마블 제2024/2026';
    var base=2027+Math.floor((y-2027)/2)*2;
    return '마블 제'+base+'/'+(base+1);
  }
  function pad3(n){ n=String(n); while(n.length<3) n='0'+n; return n; }
  function nextNo(kind){
    var y=new Date().getFullYear();
    var pre=(kind==='expense')?('마블 지출 '+docNoPrefix(y).replace('마블 제','')):docNoPrefix(y);
    var re=new RegExp('^'+pre.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'-(\\d+)호$');
    var mx=0;
    Object.keys(S.docs).forEach(function(k){
      var d=S.docs[k]; if(!d)return;
      if((d.type==='expense')!==(kind==='expense'))return;
      var m=re.exec(String(d.no||''));
      if(m){ var n=parseInt(m[1],10); if(n>mx) mx=n; }
    });
    /* 종이로 나간 공문이 이미 14호까지 있다. 앱에 적힌 번호가 그보다
       작더라도 15호부터 이어가야 한다. */
    if(kind!=='expense' && y<=2026 && mx<14) mx=14;
    return pre+'-'+pad3(mx+1)+'호';
  }

  function expTotal(d){
    return (d.items||[]).reduce(function(a,it){return a+num(it.qty,0)*num(it.price,0);},0);
  }
  function payState(d){
    var p=d.pay||{}; return p.state==='paid'?'paid':'pending';
  }
  /* 지출결의서는 공문과 같은 결재 엔진을 쓴다. 승인 이후 단계만 따로 붙는다. */
  function newExpenseBody(){
    var y=new Date().getFullYear();
    return {type:'expense', title:'지출결의서', no:nextNo('expense'), date:today(),
      eventId:'', account:'기타', method:'bank',
      payee:'', payeeBank:'', payeeAcct:'', dueDate:'', note:'',
      items:[{name:'',qty:1,price:0,note:''}],
      pay:{state:'pending',at:'',by:'',memo:''},

  function newDocBody(form,scope){
    var f=FORMS[form]||FORMS.rent;
    scope=scope==='in'?'in':'out';
    return {type:'official', form:form||'rent', scope:scope,
      title:f.t||'(제목을 입력하세요)', no:nextNo('official'), date:today(),
      to:'', cc:'', subject:f.t||'',
      paras:f.p.slice(),
      ov:f.k.map(function(k){return {k:k,v:''};}),
      signer:'마이티블레싱대표', seal:scope!=='in',
      /* 연락처는 비워 둔다 — 저장소가 공개라 코드에 번호를 박지 않는다.
         한 번 입력하면 그 문서에 저장되고, 복사해서 새 문서를 만들면 따라온다. */
      addr:'', tel1:'', tel2:'', email:'contact@mightyblessing.com',
      line:[], steps:[], status:'draft', drafter:S.me.id||'', createdAt:nowISO(), updatedAt:nowISO()};
  }

  /* ============ 저장 ============ */
  var saveTimer=null,saving=false,dirty=null,dirtyKind=null;
  function touch(kind,id){
    dirty=id; dirtyKind=kind;
    if(saveTimer)clearTimeout(saveTimer);
    saveTimer=setTimeout(flush,700);
  }
  function flush(){
    if(saving||!dirty||!S.db)return;
    var kind=dirtyKind,id=dirty; dirty=null; dirtyKind=null;
    var src=kind==='doc'?S.docs[id]:S.events[id];
    if(!src)return;
    saving=true;
    var body=clone(src); delete body.id; body.updatedAt=nowISO();
    S.db.doc((kind==='doc'?'docs/':'events/')+id).set(body)
      .catch(function(e){errbar('저장 실패 '+(e&&e.code||''));})
      .then(function(){saving=false; if(dirty)flush();});
  }

  /* ============ 렌더 ============ */
  function render(){
    app=$('#app')||app; if(!app)return;
    renderNav();
    if(S.fatal){app.innerHTML='<div class="card"><div class="empty"><strong>열 수 없습니다</strong>'+esc(S.fatal)+'</div></div>';return;}
    if(S.loading){app.innerHTML='<div class="card"><div class="empty"><strong>불러오는 중</strong>잠시만 기다려 주세요.</div></div>';return;}
    if(S.view==='dash')return renderDash();
    if(S.view==='docs')return S.docSel&&S.docs[S.docSel]?renderDoc(S.docs[S.docSel]):renderDocList();
    if(S.view==='acct')return renderAcct();
    if(S.view==='report')return renderReport();

  function renderBell(){
    var b=$('#bellBtn'), pn=$('#bellPanel'); if(!b||!pn)return;

    b.hidden=false;

      (list.length?list.map(function(x){

  /* ---- 대시보드 ---- */
  function renderDash(){
    var evs=Object.keys(S.events).map(function(k){return S.events[k];});
    var paid=evs.filter(function(e){return progress(e).status==='paid';});
    var inflight=evs.filter(function(e){return progress(e).status==='submitted';});
    var totalPay=paid.reduce(function(a,e){return a+compute(e).payTotal;},0);
    var todo=docList('todo'), prog=docList('progress');

    var byMonth={};
    paid.forEach(function(e){var m=(e.date||'').slice(0,7); if(m)byMonth[m]=(byMonth[m]||0)+compute(e).payTotal;});
    var months=Object.keys(byMonth).sort().slice(-6);
    var max=months.reduce(function(a,m){return Math.max(a,byMonth[m]);},0)||1;
    var chart = months.length
      ? '<div style="display:flex;align-items:flex-end;gap:12px;height:132px;padding-top:6px">'+
        months.map(function(m){
          var h=Math.max(4,Math.round(byMonth[m]/max*108));
          return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">'+
            '<span style="font-family:var(--font-num);font-size:11px;color:var(--muted)">'+Math.round(byMonth[m]/10000)+'만</span>'+
            '<div style="width:100%;max-width:46px;height:'+h+'px;background:var(--accent);border-radius:4px 4px 0 0"></div>'+
            '<span style="font-size:11px;color:var(--muted)">'+m.slice(5)+'월</span></div>';
        }).join('')+'</div>'
      : '<div class="empty" style="padding:24px 8px">지급 완료된 정산이 아직 없습니다.</div>';

    var recent=[];
    Object.keys(S.docs).forEach(function(k){var d=S.docs[k];
      recent.push({at:d.updatedAt,t:'전자결재',n:d.title||'(제목 없음)',s:docStatus(d),l:DOC_STATUS[docStatus(d)],go:'doc:'+k});});
    evs.forEach(function(e){
      recent.push({at:e.updatedAt,t:'정산',n:e.name||'(이름 없음)',s:progress(e).status,l:SET_STATUS[progress(e).status],go:'ev:'+e.id});});
    recent.sort(function(a,b){return (b.at||'')<(a.at||'')?-1:1;});
    recent=recent.slice(0,8);

    app.innerHTML=
      '<div class="stack">'+
      (S.stale?'<div class="note n-warn">데이터를 아직 불러오지 못했습니다. 보이는 내용이 최신이 아닐 수 있습니다.</div>':'')+
      '<div class="tiles">'+
        tile('내 결재 대기', todo.length+'건', todo.length?'지금 처리해야 합니다':'처리할 문서 없음', todo.length>0)+
        tile('진행 중 문서', prog.length+'건', '결재 중')+
        tile('지급 완료 사례비', won(totalPay), paid.length+'개 행사 누계')+
        tile('정산 진행 중', inflight.length+'건', '결재 대기')+
        (function(){
          var xs=Object.keys(S.docs).map(function(k){return S.docs[k];})
            .filter(function(d){return d&&d.type==='expense'&&docStatus(d)==='approved'&&payState(d)==='pending';});
          var v=xs.reduce(function(a,d){return a+expTotal(d);},0);
          return tile('지급 대기 지출', won(v), xs.length+'건 · 승인 후 미지급', xs.length>0);
        })()+
      '</div>'+
      '<div class="cols">'+
        '<section class="card"><h2>내 결재 대기</h2>'+
          (todo.length? '<div class="people">'+todo.map(function(d){
            return '<div class="person" data-go="doc:'+esc(d.id)+'" style="cursor:pointer">'+
              '<span class="pill p-'+docStatus(d)+'">'+DOC_STATUS[docStatus(d)]+'</span>'+
              '<span class="nm">'+esc(d.title||'(제목 없음)')+'</span></div>';
          }).join('')+'</div>'
          : '<div class="empty" style="padding:22px 8px">처리할 문서가 없습니다.</div>')+
        '</section>'+
        '<section class="card"><h2>월별 사례비 지급</h2>'+chart+'</section>'+
      '</div>'+
      '<section class="card"><h2>최근 활동</h2>'+
        (recent.length?'<div class="scroll"><table><thead><tr><th>구분</th><th>제목</th><th>상태</th><th class="num">수정</th></tr></thead><tbody>'+
          recent.map(function(r){
            return '<tr class="rowlink" data-go="'+esc(r.go)+'"><td style="color:var(--muted)">'+r.t+'</td>'+
              '<td><b>'+esc(r.n)+'</b></td><td><span class="pill p-'+r.s+'">'+r.l+'</span></td>'+
              '<td class="num" style="color:var(--muted)">'+esc(shortTime(r.at))+'</td></tr>';
          }).join('')+'</tbody></table></div>'
        :'<div class="empty" style="padding:22px 8px">아직 활동이 없습니다.</div>')+
      '</section></div>';
  }
  function tile(k,v,s,hot){
    return '<div class="tile'+(hot?' hot':'')+'"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="s">'+esc(s||'')+'</div></div>';
  }

  /* 직인은 최종 승인된 문서에만 찍힌다. 그 전에는 자리만 표시한다. */
  function sealMark(d){

    if(S.seal) return '<img class="sealimg" src="'+esc(S.seal)+'" alt="직인">';

  var PDF_LIB=['https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',
               'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js'];

  function docFileName(d){
    var nm=[(d.no||'').replace(/[\\/:*?"<>|]/g,'-'), (d.subject||d.title||'문서')].filter(Boolean).join(' ');
    return nm.replace(/\s+/g,' ').trim();
  }
  function previewHTML(d){ return d.type==='expense'?expensePreview(d):docPreview(d); }

  /* 인쇄창을 거치면 브라우저가 날짜·쪽번호·웹주소를 종이에 같이 찍는다.
     그건 CSS로 못 막고 사람마다 설정이 달라진다. 그래서 화면을 직접 찍어
     A4 PDF 파일로 만든다. 설정을 건드릴 일이 없고 파일 이름도 정해진다. */
  /* 로고와 직인은 data: 주소라도 붙자마자 바로 그려지지는 않는다.
     다 올라오기 전에 찍으면 빈 칸으로 나가거나 아예 크기를 못 잡는다. */
  function waitImages(el){
    var imgs=Array.prototype.slice.call(el.querySelectorAll('img'));
    return Promise.all(imgs.map(function(im){
      if(im.complete&&im.naturalWidth) return null;
      return new Promise(function(res){
        var go=function(){res();};
        im.addEventListener('load',go,{once:true});
        im.addEventListener('error',go,{once:true});
        setTimeout(go,2500);
      });
    }));
  }
  function savePdf(d,btn){
    var root=document.getElementById('printroot'); if(!root)return;
    var label=btn?btn.textContent:'';
    if(btn){ btn.disabled=true; btn.textContent='만드는 중…'; }
    var done=function(){
      root.className=''; root.innerHTML='';
      if(btn){ btn.disabled=false; btn.textContent=label; }
    };
    root.innerHTML=previewHTML(d);
    root.className='cap';
    loadScript(PDF_LIB[0])
      .then(function(){ return loadScript(PDF_LIB[1]); })
      .then(function(){ return waitImages(root); })
      .then(function(){
        var w=root.offsetWidth||780, h=root.offsetHeight||0;
        if(!h) throw new Error('문서 높이를 잡지 못했습니다');
        /* 너무 긴 문서는 캔버스 한도에 걸린다. 그만큼 배율을 낮춘다. */
        var sc=Math.min(2, 32000/Math.max(1,h));
        return window.html2canvas(root,{scale:sc, backgroundColor:'#ffffff', useCORS:true,
          logging:false, width:w, height:h, windowWidth:w, scrollX:0, scrollY:0});
      })
      .then(function(cv){
        if(!cv||!cv.width||!cv.height) throw new Error('화면을 그려내지 못했습니다');
        var JS=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
        if(!JS) throw new Error('jsPDF를 불러오지 못했습니다');
        var pdf=new JS({unit:'mm',format:'a4',orientation:'p'});
        var PW=210, PH=297, M=16, iw=PW-M*2, ph=PH-M*2;
        /* 한 장짜리 그림을 음수 좌표로 밀어 넣는 대신, 장마다 그만큼만 잘라 넣는다.
           좌표가 음수로 가면 jsPDF 가 변환 행렬을 못 만들고 멈춘다. */
        var sliceH=Math.max(1, Math.floor(cv.width*ph/iw));
        var pages=Math.max(1, Math.ceil(cv.height/sliceH));
        var tmp=document.createElement('canvas'), ctx=tmp.getContext('2d');
        tmp.width=cv.width;
        for(var i=0;i<pages;i++){
          var y=i*sliceH, hh=Math.min(sliceH, cv.height-y);
          if(hh<=0) break;
          tmp.height=hh;
          ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,tmp.width,hh);
          ctx.drawImage(cv, 0,y,cv.width,hh, 0,0,cv.width,hh);
          var mm=hh*iw/cv.width;
          if(!isFinite(mm)||mm<=0) break;
          if(i) pdf.addPage();
          pdf.addImage(tmp.toDataURL('image/jpeg',0.92),'JPEG',M,M,iw,mm);
        }
        pdf.save(docFileName(d)+'.pdf');
        flash('PDF를 내려받았습니다');
        done();
      })
      .catch(function(e){
        errbar('PDF를 만들지 못했습니다 ('+(e&&e.message||e)+'). 대신 인쇄를 눌러 PDF로 저장해 주세요.');
        done();
      });
  }

  /* 브라우저 인쇄창을 열어 PDF로 저장하게 한다. 화면의 다른 요소는 숨기고
     공문 한 장만 A4에 올린다. 제목을 바꿔 두면 저장될 파일 이름이 된다. */
  function printDoc(d){
    var root=document.getElementById('printroot'); if(!root)return;
    root.innerHTML=previewHTML(d);
    var oldTitle=document.title;
    document.title=docFileName(d);
    document.body.classList.add('printing');
    var done=function(){
      document.body.classList.remove('printing');
      root.innerHTML=''; document.title=oldTitle;
      window.removeEventListener('afterprint',done);
    };
    window.addEventListener('afterprint',done);
    setTimeout(function(){ try{window.print();}catch(e){errbar('인쇄창을 열지 못했습니다');done();} setTimeout(done,1500); },80);
  }

  /* 원본 공문의 머리: 왼쪽에 로고, 가운데에 큰 기관명. */
  function docHead(title){
    return '<div class="dhead">'+
      '<img class="lg" src="'+esc(S.logo||LOGO_FALLBACK)+'" alt="마이티블레싱" onerror="this.style.display=\'none\'">'+
      '<span class="org">'+esc(title)+'</span></div>';

  function docSteps(d){
    var st=docStatus(d), cur=currentStep(d);
    if(!(d.steps||[]).length) return '<div class="empty" style="padding:20px 8px">결재선이 지정되지 않았습니다.</div>';
    return '<div class="steps">'+d.steps.map(function(s,i){
      var cls=s.state==='approved'?' done':s.state==='rejected'?' bad':(i===cur&&st!=='draft'?' now':'');
      var msg=s.state==='approved'?('승인 · '+shortTime(s.at)):s.state==='rejected'?('반려 · '+shortTime(s.at)):(i===cur&&st!=='draft'?'결재 대기 중':'대기');
      return '<div class="step'+cls+'"><span class="dot">'+(s.state==='approved'?'✓':s.state==='rejected'?'✕':(i+1))+'</span>'+
        '<span><span class="t">'+esc(nameOf(s.uid))+'</span><br><span class="m">'+msg+(s.comment?' — '+esc(s.comment):'')+'</span></span></div>';
    }).join('')+'</div>';
  }
  function lineSearch(q){
    if(!S.user||!S.user.search)return;
    S.user.search(q).then(function(hits){
      var el=$('#lnResults'); if(!el)return;
      var d=S.docs[S.docSel]||{}; var have=(d.steps||[]).map(function(s){return s.uid;});
      el.innerHTML=hits.filter(function(h){return have.indexOf(h.id)<0;}).map(function(h){
        S.profiles[h.id]=h;
        return '<div class="person"><img src="'+esc(avatarOf(h.id))+'" alt=""><span class="nm">'+esc(h.name)+'</span>'+
          '<button class="btn sm" data-lnadd="'+esc(h.id)+'">추가</button></div>';
      }).join('');
    });
  }

  /* ---- 정산 (보존) ---- */
  function renderSettleList(){
    var ids=Object.keys(S.events).sort(function(a,b){return (S.events[b].date||'')<(S.events[a].date||'')?-1:1;});
    app.innerHTML=
      '<div class="actions" style="margin-bottom:14px"><button class="btn primary" id="newEv"'+(writable()?'':' disabled')+'>+ 새 행사</button></div>'+
      '<div class="card">'+(ids.length?
        '<div class="scroll"><table><thead><tr><th>행사</th><th>상태</th><th class="num">잔여액</th><th class="num">지급 합계</th></tr></thead><tbody>'+
        ids.map(function(id){var ev=S.events[id],c=compute(ev),p=progress(ev);
          return '<tr class="rowlink" data-go="ev:'+esc(id)+'">'+

  function sg(id,label,on,ro){return '<button type="button" id="'+id+'" aria-pressed="'+(on?'true':'false')+'"'+(ro?' disabled':'')+'>'+label+'</button>';}
  function settleNote(c,ev){
    if(c.anyCap)return '<div class="note n-warn">1인 상한 '+won(c.cap)+'에 걸린 인원이 있습니다. 남는 '+won(c.leftover)+'은 현재 '+(ev.capMode==='redistribute'?'재배분':'이월')+' 처리입니다.</div>';
    if(c.net<=0)return '<div class="note n-warn">잔여액이 0 이하라 사례비 예산이 잡히지 않습니다. 지급 여부를 따로 정해야 합니다.</div>';
    if(c.pool===0&&c.net>0)return '<div class="note n-warn">준비 사례비 재원이 0원입니다. 당일 일급이 사례비 예산을 다 썼습니다.</div>';
    return '';
  }
  function settleApproval(ev,p){
    var role=myRole(),id=S.me.id,iAcc=role==='accounting',iCeo=role==='ceo';
    var did=function(k){return p.list.some(function(a){return a.kind===k&&a.uid===id;});};
    var roleless=p.acc.length===0||p.ceo.length===0;
    var steps=[
      stp(p.status!=='draft','1','상신',p.status==='draft'?'작성이 끝나면 상신하세요.':'결재 진행 중'),
      stp(p.accDone,'2','회계 승인',p.acc.length?(p.okAcc.length+' / '+p.acc.length+'명 승인'):'회계 역할이 지정되지 않았습니다'),
      stp(p.confirms.length>0,'3','팀원 확인',p.confirms.length+'명 확인함'),
      stp(p.ceoDone,'4','대표 승인',p.ceoDone?'승인됨':'대표 승인 대기'),
      stp(p.status==='paid','5','지급 완료',p.status==='paid'?'송금 완료':'지급 대기')
    ].join('');
    var btns=[];
    if(writable()){
      if(p.status==='draft')btns.push('<button class="btn primary" data-act="submit">상신</button>');
      if(p.status==='submitted'){
        if(iAcc&&!did('accounting'))btns.push('<button class="btn primary" data-act="accounting">회계 승인</button>');
        if(iCeo&&!did('ceo'))btns.push('<button class="btn primary" data-act="ceo">대표 승인</button>');
        if(!did('confirm'))btns.push('<button class="btn" data-act="confirm">확인했습니다</button>');
        if(iAcc||iCeo)btns.push('<button class="btn danger" data-act="reject">반려</button>');
      }
      if(p.status==='approved'&&iAcc)btns.push('<button class="btn primary" data-act="paid">지급 완료</button>');
      if(p.status==='approved'&&!did('confirm'))btns.push('<button class="btn" data-act="confirm">확인했습니다</button>');
    }
    var log=p.list.slice().reverse().map(function(a){
      var what={confirm:'확인',accounting:'회계 승인',ceo:'대표 승인',paid:'지급 완료',reject:'반려',submit:'상신'}[a.kind]||a.kind;
      return '<div style="display:flex;gap:8px;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px">'+
        '<span><b>'+esc(nameOf(a.uid))+'</b> · '+what+'</span><span style="color:var(--muted);white-space:nowrap">'+esc(shortTime(a.at))+'</span></div>';
    }).join('');
    return '<section class="card"><h2>결재</h2>'+
      (roleless?'<div class="note n-warn" style="margin:0 0 12px">회계·대표 역할이 아직 지정되지 않아 승인이 완료될 수 없습니다. 좌측 <b>역할</b>에서 지정하세요.</div>':'')+
      '<div class="steps">'+steps+'</div>'+
      (btns.length?'<div class="actions" style="margin-top:14px">'+btns.join('')+'</div>':'')+
      (log?'<h2 style="margin-top:18px">기록</h2>'+log:'')+'</section>';
  }
  function stp(done,n,t,m){
    return '<div class="step'+(done?' done':'')+'"><span class="dot">'+(done?'✓':n)+'</span>'+
      '<span><span class="t">'+t+'</span><br><span class="m">'+esc(m)+'</span></span></div>';
  }

  /* ---- 회계 ---- */
  function expenses(){
    return Object.keys(S.docs).map(function(k){return S.docs[k];}).filter(function(d){return d&&d.type==='expense';});
  }
  function acctList(tab){
    var all=expenses().filter(function(d){return docStatus(d)==='approved';});
    if(tab==='pending') all=all.filter(function(d){return payState(d)==='pending';});
    if(tab==='paid')    all=all.filter(function(d){return payState(d)==='paid';});
    all.sort(function(a,b){
      var ka=(payState(a)==='paid'?((a.pay||{}).at||''):(a.dueDate||a.date||''));
      var kb=(payState(b)==='paid'?((b.pay||{}).at||''):(b.dueDate||b.date||''));
      return kb<ka?-1:1;
    });
    return all;
  }
  function groupKey(d,by){
    if(by==='account') return d.account||'기타';
    if(by==='method')  return METHODS[d.method]||'기타';
    var ev=d.eventId&&S.events[d.eventId];
    return ev?(ev.name||'(이름 없음)'):'행사 미지정';
  }

  function renderAcct(){
    var approved=expenses().filter(function(d){return docStatus(d)==='approved';});
    var pending=approved.filter(function(d){return payState(d)==='pending';});
    var paid=approved.filter(function(d){return payState(d)==='paid';});
    var inflight=expenses().filter(function(d){return ['submitted','progress'].indexOf(docStatus(d))>=0;});
    var sum=function(a){return a.reduce(function(x,d){return x+expTotal(d);},0);};
    var thisMonth=today().slice(0,7);
    var mPaid=paid.filter(function(d){return String((d.pay||{}).at||'').slice(0,7)===thisMonth;});
    var noEv=paid.filter(function(d){return !evFiles(d).length;});

    var tabs=[['pending','지급 대기'],['paid','지급 완료'],['all','전체']];
    var list=acctList(S.acctTab);

    var g={}, order=[];
    paid.forEach(function(d){
      var k=groupKey(d,S.acctBy);
      if(!g[k]){ g[k]={n:0,v:0}; order.push(k); }
      g[k].n++; g[k].v+=expTotal(d);
    });
    order.sort(function(a,b){return g[b].v-g[a].v;});
    var gmax=order.reduce(function(a,k){return Math.max(a,g[k].v);},0)||1;
    var gtotal=order.reduce(function(a,k){return a+g[k].v;},0);

    var byLabel={event:'행사 / 사업',account:'계정과목',method:'지급 수단'};

    app.innerHTML=
      '<div class="stack">'+
      '<div class="tiles">'+
        tile('지급 대기', won(sum(pending)), pending.length+'건 · 승인됨', pending.length>0)+
        tile('이번 달 지급', won(sum(mPaid)), mPaid.length+'건')+
        tile('지급 완료 누계', won(sum(paid)), paid.length+'건')+
        tile('결재 중 지출', won(sum(inflight)), inflight.length+'건')+
        tile('증빙 없는 지급', noEv.length+'건', noEv.length?'영수증을 붙여주세요':'모두 갖춰졌습니다', noEv.length>0)+
      '</div>'+

      '<section class="card"><h2>'+byLabel[S.acctBy]+'별 지출</h2>'+
        '<div class="tabs" style="margin:0 0 12px">'+
          [['event','행사 / 사업'],['account','계정과목'],['method','지급 수단']].map(function(x){
            return '<button type="button" data-aby="'+x[0]+'" aria-pressed="'+(S.acctBy===x[0]?'true':'false')+'">'+x[1]+'</button>';
          }).join('')+'</div>'+
        (order.length
          ? '<div class="scroll"><table><thead><tr><th>'+byLabel[S.acctBy]+'</th><th class="num">건수</th><th class="num">금액</th><th style="width:34%">비중</th></tr></thead><tbody>'+
            order.map(function(k){
              var w=Math.max(2,Math.round(g[k].v/gmax*100));
              return '<tr><td><b>'+esc(k)+'</b></td><td class="num">'+g[k].n+'</td>'+
                '<td class="num" style="font-family:var(--font-num)">'+won(g[k].v)+'</td>'+
                '<td><div style="height:9px;border-radius:5px;background:var(--line)">'+
                  '<div style="height:9px;width:'+w+'%;border-radius:5px;background:var(--accent)"></div></div>'+
                  '<span style="font-size:11px;color:var(--muted)">'+Math.round(g[k].v/(gtotal||1)*100)+'%</span></td></tr>';
            }).join('')+
            '<tr><th>합계</th><th class="num">'+paid.length+'</th><th class="num" style="font-family:var(--font-num)">'+won(gtotal)+'</th><th></th></tr>'+
            '</tbody></table></div>'
          : '<div class="empty" style="padding:24px 8px">지급 완료된 지출이 아직 없습니다.</div>')+
        '<p class="hint" style="margin-top:10px">지급 완료된 건만 집계합니다. 승인만 되고 아직 안 나간 돈은 위 &lsquo;지급 대기&rsquo;에 있습니다.</p>'+
      '</section>'+

      '<section class="card"><h2>지출 목록</h2>'+
        '<div class="tabs" style="margin:0 0 12px">'+tabs.map(function(t){
          return '<button type="button" data-atab="'+t[0]+'" aria-pressed="'+(S.acctTab===t[0]?'true':'false')+'">'+t[1]+
            '<span class="n">'+acctList(t[0]).length+'</span></button>';
        }).join('')+'</div>'+
        (list.length
          ? '<div class="scroll"><table><thead><tr><th>제목</th><th>행사</th><th>계정과목</th><th>받는 사람</th><th class="num">금액</th><th>증빙</th><th>지급</th><th class="num">일자</th></tr></thead><tbody>'+
            list.map(function(d){
              var ps=payState(d), ev=d.eventId&&S.events[d.eventId];
              return '<tr class="rowlink" data-go="doc:'+esc(d.id)+'">'+
                '<td><b>'+esc(d.title||'(제목 없음)')+'</b><div style="font-size:12px;color:var(--muted)">'+esc(d.no||'')+'</div></td>'+

                '<td>'+esc(d.payee||'—')+'</td>'+

      '</section></div>';

  function payExpense(d){
    if(!S.db||!d)return;
    if(docStatus(d)!=='approved') return errbar('승인이 끝난 문서만 지급 처리할 수 있습니다');
    if(payState(d)==='paid')      return errbar('이미 지급 처리된 건입니다');
    if(!(myRole()==='accounting'||S.me.canEdit)) return errbar('회계 역할을 가진 사람만 지급 처리할 수 있습니다');
    var body=clone(d); delete body.id;
    body.pay={state:'paid', at:nowISO(), by:S.me.id, memo:S.payMemo||'', amount:expTotal(d)};
    body.updatedAt=nowISO();
    S.db.doc('docs/'+d.id).set(body).then(function(){
      S.confirmPay=null; S.payMemo='';
      notify(d.drafter, '「'+docLabel(d)+'」 '+won(expTotal(d))+' 지급이 끝났습니다', d.id);
      flash('지급 완료로 기록했습니다'); render();
    }).catch(function(e){ errbar('지급 처리 실패 '+(e&&(e.code||e.message)||'')); });
  }

  /* ---- 손익 보고서 ---- */
  /* 한 해의 돈이 어디서 들어와 어디로 나갔는지 한 장으로 본다.
     기준은 '현금이 움직인 날'이다. 지출결의서는 지급일, 정산은 행사일.
     승인만 되고 아직 안 나간 돈은 여기 들어오지 않는다. */
  function repRange(){
    var y=S.rep.y, seg=S.rep.seg;
    function d(m,day){ return y+'-'+pad2(m)+'-'+pad2(day); }
    if(seg==='all') return {from:y+'-01-01', to:y+'-12-31', label:y+'년 전체'};
    if(seg.charAt(0)==='q'){
      var q=+seg.slice(1), m0=(q-1)*3+1;
      return {from:d(m0,1), to:d(m0+2,lastDay(y,m0+2)), label:y+'년 '+q+'분기'};
    }
    var m=+seg;
    return {from:d(m,1), to:d(m,lastDay(y,m)), label:y+'년 '+m+'월'};
  }
  function pad2(n){ n=String(n); return n.length<2?('0'+n):n; }
  function lastDay(y,m){ return new Date(y,m,0).getDate(); }
  function inRange(iso,r){ var k=String(iso||'').slice(0,10); return !!k && k>=r.from && k<=r.to; }

  function repData(){
    var r=repRange();
    var evs=Object.keys(S.events).map(function(k){return S.events[k];})
      .filter(function(e){ return inRange(e.date,r); })
      .sort(function(a,b){ return (a.date||'')<(b.date||'')?-1:1; });
    /* 지급이 끝난 지출결의서만. 기준일은 실제로 돈이 나간 날. */
    var exps=expenses().filter(function(d){
      return docStatus(d)==='approved' && payState(d)==='paid' && inRange((d.pay||{}).at,r);
    });
    var byEvent={};
    exps.forEach(function(d){ var k=d.eventId||''; (byEvent[k]=byEvent[k]||[]).push(d); });

    var rows=evs.map(function(e){
      var c=compute(e), pr=progress(e);
      var direct=e.mode!=='calc';
      var rev=direct?null:num(e.rev);
      var cost=direct?null:(num(e.opex)+num(e.tax));
      var fee=pr.status==='paid'?c.payTotal:0;
      var own=(byEvent[e.id]||[]).reduce(function(a,d){return a+expTotal(d);},0);
      var sub=S.repNet?0:own;                    /* 운영비에 이미 들어갔다고 보면 빼지 않는다 */
      return {e:e, direct:direct, rev:rev, cost:cost, net:c.net, fee:fee, feePending:pr.status!=='paid'?c.payTotal:0,
              own:own, bal:c.net-fee-sub};
    });
    var loose=(byEvent['']||[]);
    var looseTotal=loose.reduce(function(a,d){return a+expTotal(d);},0);

    var sum=function(f){ return rows.reduce(function(a,x){return a+(f(x)||0);},0); };
    var anyDirect=rows.some(function(x){return x.direct;});
    return {r:r, rows:rows, loose:loose, looseTotal:looseTotal, exps:exps, anyDirect:anyDirect,
      income:sum(function(x){return x.rev;}),
      cost:sum(function(x){return x.cost;}),
      fee:sum(function(x){return x.fee;}),
      feePending:sum(function(x){return x.feePending;}),
      own:sum(function(x){return x.own;}),
      profit:sum(function(x){return x.bal;})-looseTotal};
  }

          ? '<div class="scroll"><table><thead><tr><th>계정과목</th><th class="num">건수</th><th class="num">금액</th><th style="width:30%">비중</th></tr></thead><tbody>'+

  function repCsv(){
    var D=repData(), L=[];
    function row(a){ return a.map(function(v){
      v=String(v==null?'':v);
      return /[",\n]/.test(v)?('"'+v.replace(/"/g,'""')+'"'):v;
    }).join(','); }
    L.push(row(['마이티블레싱 손익 보고서', D.r.label]));
    L.push(row(['기간', D.r.from, '~', D.r.to]));
    L.push('');
    L.push(row(['행사','일자','수입','운영비·세금','사례비','지출결의서','잔액']));
    D.rows.forEach(function(x){
      L.push(row([x.e.name||'', x.e.date||'', x.direct?'':x.rev, x.direct?'':x.cost, x.fee, x.own, x.bal]));
    });
    L.push(row(['합계','',D.income,D.cost,D.fee,D.own,D.profit+D.looseTotal]));
    L.push('');
    L.push(row(['지급된 지출결의서']));
    L.push(row(['지급일','문서번호','제목','행사','계정과목','지급수단','받는 사람','금액']));
    D.exps.forEach(function(d){
      var ev=d.eventId&&S.events[d.eventId];
      L.push(row([String((d.pay||{}).at||'').slice(0,10), d.no||'', d.title||'', ev?(ev.name||''):'',
                  d.account||'', METHODS[d.method]||'', d.payee||'', expTotal(d)]));
    });
    L.push('');
    L.push(row(['손익', D.profit]));
    /* 엑셀은 BOM 이 없으면 한글을 깨뜨린다. */
    var blob=new Blob(['\ufeff'+L.join('\r\n')],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a');

  /* 올린 그림을 220px 정사각 PNG로 줄여서 config/seal 에 넣는다.
     원본을 그대로 담으면 문서 한 건이 수 MB가 되어 동기화가 느려진다. */
  function onSealFile(file){
    if(!file)return;
    if(file.size>8*1024*1024) return errbar('그림이 너무 큽니다 (8MB 이하)');
    var fr=new FileReader();
    fr.onerror=function(){errbar('파일을 읽지 못했습니다');};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){errbar('그림 형식을 읽지 못했습니다. PNG 또는 JPG로 올려주세요.');};
      img.onload=function(){
        var out;
        try{ out=trimImage(img,220); }catch(e){ return errbar('그림을 변환하지 못했습니다'); }
        if(!out) return errbar('직인을 찾지 못했습니다. 배경이 밝은 그림인지 확인해 주세요.');
        saveSeal(out);
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  }
  /* 올린 그림에서 흰 배경을 빼고, 인장 부분만 잘라 220px 정사각 PNG로 만든다.
     스캔한 직인은 대개 흰 종이 위에 찍혀 있어서, 그대로 쓰면 공문 글자를 가린다. */
  function trimImage(img,N){
    var W=img.width, H=img.height;
    var c0=document.createElement('canvas'); c0.width=W; c0.height=H;
    var x0=c0.getContext('2d'); x0.drawImage(img,0,0);
    var im=x0.getImageData(0,0,W,H), px=im.data;
    var minX=W, minY=H, maxX=-1, maxY=-1;
    for(var y=0;y<H;y++){
      for(var x=0;x<W;x++){
        var i=(y*W+x)*4, r=px[i], g=px[i+1], b=px[i+2], a=px[i+3];
        if(a<8){ continue; }
        var mx=Math.max(r,g,b), mn=Math.min(r,g,b);
        /* 밝고 색이 없는 화소 = 종이. 투명하게 만든다. */
        if(mn>205 && mx-mn<26){ px[i+3]=0; continue; }
        /* 옅은 회색 테두리는 부드럽게 깎아 계단을 줄인다 */
        if(mn>170 && mx-mn<26){ px[i+3]=Math.round(a*(205-mn)/35); if(px[i+3]<8) continue; }
        if(x<minX)minX=x; if(x>maxX)maxX=x;
        if(y<minY)minY=y; if(y>maxY)maxY=y;
      }
    }
    if(maxX<0) return null;
    x0.putImageData(im,0,0);
    var pad=Math.round(Math.max(maxX-minX,maxY-minY)*0.04);
    minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad);
    maxX=Math.min(W-1,maxX+pad); maxY=Math.min(H-1,maxY+pad);
    var cw=maxX-minX+1, ch=maxY-minY+1;
    var cv=document.createElement('canvas'); cv.width=N; cv.height=N;
    var ctx=cv.getContext('2d');
    ctx.imageSmoothingQuality='high';
    var r2=Math.min(N/cw,N/ch), dw=cw*r2, dh=ch*r2;
    ctx.drawImage(c0,minX,minY,cw,ch,(N-dw)/2,(N-dh)/2,dw,dh);
    return cv.toDataURL('image/png');
  }

  /* 로고는 가로로 긴 그림이라 정사각으로 자르면 안 된다. 흰 배경만 빼고
     긴 변을 560px에 맞춘다. */
  function trimWide(img,MW,MH){
    var sq=trimImage(img,Math.max(MW,MH)); if(!sq)return null;
    return sq;
  }
  /* 얼굴 사진은 배경을 빼면 안 된다(살구색·흰옷이 뚫린다). 가운데를 정사각으로
     자르고 줄이기만 한다. */
  function fitSquare(img,N){
    var cv=document.createElement('canvas'); cv.width=cv.height=N;
    var ctx=cv.getContext('2d'); ctx.imageSmoothingQuality='high';
    var side=Math.min(img.width,img.height);
    ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,N,N);
    return cv.toDataURL('image/jpeg',0.86);
  }
  function readImage(file,limitMB,done){
    if(!file)return;
    if(file.size>limitMB*1024*1024) return errbar('그림이 너무 큽니다 ('+limitMB+'MB 이하)');
    var fr=new FileReader();
    fr.onerror=function(){errbar('파일을 읽지 못했습니다');};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){errbar('그림 형식을 읽지 못했습니다. PNG 또는 JPG로 올려주세요.');};
      img.onload=function(){ try{ done(img); }catch(e){ errbar('그림을 변환하지 못했습니다'); } };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  }

  /* ============ 슈파베이스 ============

  var SB_LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js';

  function loadScript(src){
    return new Promise(function(res,rej){
      var s=document.createElement('script'); s.src=src;
      s.onload=function(){res();}; s.onerror=function(){rej(new Error('라이브러리를 불러오지 못했습니다'));};

  function sbConfigured(){

  function sbStore(sb){
    var cache={}, subs=[];
    function fire(col){ subs.forEach(function(s){ if(s.col===col){ try{s.fn();}catch(e){} } }); }
    function snapOf(col,id){
      var v=cache[col]&&cache[col][id];
      return {id:id,exists:!!v,data:function(){return v?clone(v):undefined;},metadata:{fromCache:false,hasPendingWrites:false}};
    }
    var loading={};
    function loadCol(col){
      if(loading[col])return; loading[col]=true;
      sb.from('docs').select('id,data').eq('collection',col).then(function(r){
        loading[col]=false;
        if(r.error){ errbar('불러오기 실패 ('+col+'): '+r.error.message); return; }
        cache[col]={};
        (r.data||[]).forEach(function(row){ cache[col][row.id]=row.data; });
        fire(col);
      });
    }
    sb.channel('mb-docs')
      .on('postgres_changes',{event:'*',schema:'public',table:'docs'},function(p){
        var row=(p.new&&p.new.collection)?p.new:p.old;
        if(!row||!row.collection)return;
        var col=row.collection; cache[col]=cache[col]||{};
        if(p.eventType==='DELETE') delete cache[col][row.id];
        else cache[col][row.id]=p.new.data;
        fire(col);
      }).subscribe();

    function chk(r){ if(r&&r.error) throw r.error; return r; }
    function docRef(col,id){
      var ref={
        id:id, path:col+'/'+id,
        get:function(){ return Promise.resolve(snapOf(col,id)); },
        set:function(b){
          cache[col]=cache[col]||{}; cache[col][id]=clone(b); fire(col);
          return sb.from('docs').upsert({collection:col,id:id,data:b,updated_at:new Date().toISOString()}).then(chk);
        },
        update:function(b){
          var cur=(cache[col]&&cache[col][id])||{}, next=clone(cur);
          Object.keys(b).forEach(function(k){ next[k]=b[k]; });
          return ref.set(next);
        },
        delete:function(){
          if(cache[col]) delete cache[col][id]; fire(col);
          return sb.from('docs').delete().eq('collection',col).eq('id',id).then(chk);
        },
        onSnapshot:function(next){
          subs.push({col:col,fn:function(){ next(snapOf(col,id)); }});
          loadCol(col); return function(){};
        }
      };
      return ref;
    }
    return {
      doc:function(p){ var a=p.split('/'); return docRef(a[0],a[1]); },
      collection:function(col){
        return {
          doc:function(id){ return docRef(col, id||('d'+Date.now()+Math.floor(Math.random()*1000))); },
          onSnapshot:function(next){
            subs.push({col:col,fn:function(){
              var m=cache[col]||{};
              next({docs:Object.keys(m).map(function(k){return snapOf(col,k);}),metadata:{fromCache:false}});
            }});
            loadCol(col); return function(){};
          }
        };
      }
    };
  }

    var isAdmin=row.role==='admin';
    var me={id:uid,name:row.name||session.user.email||'사용자',avatarUrl:AV,color:'#1F6F4A',
            email:session.user.email||null,isOwner:isAdmin,canEdit:isAdmin,
            joinedAt:row.createdAt||null};
    function prof(i){
      var r=members[i]||{};
      return {id:i,name:r.name||r.email||'알 수 없음',avatarUrl:AV,color:'#888',
              email:r.email||null,isMe:i===uid,guest:false};
    }
    return {
      me:function(){return Promise.resolve(me);},
      id:function(){return Promise.resolve(uid);},
      ids:function(){return Object.keys(members);},
      can:function(n){return Promise.resolve(n==='data.write'?true:isAdmin);},
      isOwner:function(){return Promise.resolve(isAdmin);},
      canEdit:function(){return Promise.resolve(isAdmin);},
      profiles:function(ids){
        var out={}; (typeof ids==='string'?[ids]:ids).forEach(function(i){out[i]=prof(i);});
        return Promise.resolve(out);
      },
      search:function(q){
        var l=Object.keys(members).map(prof);
        if(q) l=l.filter(function(p){return (p.name||'').indexOf(q)>=0||(p.email||'').indexOf(q)>=0;});
        return Promise.resolve(l.slice(0,8));
      }
    };
  }

  /* 메일 주소는 기억해 둔다. 숫자 코드를 넣을 때 같은 주소여야 맞춰볼 수 있고,
     사람마다 매번 주소를 다시 치게 하고 싶지 않다. */
  var MAIL_KEY='mb-erp-mail';
  function lastMail(){ try{ return localStorage.getItem(MAIL_KEY)||''; }catch(e){ return ''; } }
  function keepMail(v){ try{ localStorage.setItem(MAIL_KEY,v); }catch(e){} }

  /* 로그인이 거절되면 슈파베이스는 주소 뒤에 error 를 붙여 돌려보낸다.
     그걸 읽지 않으면 화면에는 그냥 빈 로그인 창이 뜨고, 사람은 왜 안 되는지 모른다. */
  function urlAuthError(){
    var out=null;
    try{
      ['hash','search'].forEach(function(k){
        var raw=location[k]||''; if(raw.length<2) return;
        var q=new URLSearchParams(raw.slice(1));
        if(q.get('error')||q.get('error_code')||q.get('error_description'))
          out={code:(q.get('error_code')||q.get('error')||''), desc:(q.get('error_description')||'')};
      });
    }catch(e){}
    return out;
  }
  function cleanUrl(){
    try{ history.replaceState(null,'',location.origin+location.pathname); }catch(e){}
  }
  function authErrorText(e){
    var c=(e.code||'')+' '+(e.desc||'');
    if(/otp_expired|expired|invalid/i.test(c))
      return '로그인 링크가 만료됐거나 이미 한 번 쓰였습니다. 아래에서 다시 받아주세요.\n'+
             '회사 메일 보안 검사가 링크를 먼저 열어보고 써버리는 일이 있습니다. 그럴 때는 메일에 적힌 6자리 숫자를 넣는 쪽이 확실합니다.';
    if(/access_denied/i.test(c)) return '로그인이 거절되었습니다. 아래에서 다시 받아주세요.';
    return decodeURIComponent(String(e.desc||e.code||'').replace(/\+/g,' '));
  }
  /* 저장된 로그인 흔적이 있는지. 있는데 세션이 없으면 '만료'고, 없으면 '처음'이다. */
  function hadLogin(){
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k&&k.indexOf('sb-')===0&&k.indexOf('-auth-token')>0) return true;
      }
    }catch(e){}
    return false;
  }

  function renderLogin(sb,msg,stage){
    app=$('#app')||app; if(!app)return;
    var n=$('#nav'); if(n)n.innerHTML='';
    var t=$('#ptitle'); if(t)t.textContent='로그인';
    var mail=S.loginMail||lastMail();
    var note=msg?'<div class="note n-bad" style="margin:0 0 12px;white-space:pre-wrap">'+esc(msg)+'</div>':'';

    var body;
    if(stage==='sent'){
      body='<p style="color:var(--muted);font-size:13px;margin:0 0 12px"><b>'+esc(mail)+'</b> 으로 보냈습니다.</p>'+
        note+
        '<div class="note n-info" style="margin:0 0 14px">메일에 <b>링크</b>와 <b>6자리 숫자</b>가 같이 들어 있습니다.<br>'+
          '링크를 눌러도 되고, 아래에 숫자를 넣어도 됩니다.</div>'+
        '<div class="field"><label for="otpCode">6자리 숫자</label>'+
          '<input id="otpCode" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="000000" '+
          'style="font-size:22px;letter-spacing:.3em;text-align:center;font-variant-numeric:tabular-nums"></div>'+
        '<div class="actions"><button class="btn primary" id="otpGo">들어가기</button>'+
          '<button class="btn" id="loginAgain">주소 바꾸기</button></div>'+
        '<p class="hint" style="margin:12px 0 0">링크는 <b>누른 브라우저</b>에서만 로그인됩니다. '+
          '메일 앱이 다른 브라우저를 열어버리면 숫자를 쓰세요. 메일이 안 보이면 스팸함도 확인해 주세요.</p>';
    }else{
      body='<p style="color:var(--muted);font-size:13px;margin:0 0 6px">회사 이메일 주소를 넣으면 로그인 메일을 보내드립니다. 비밀번호는 없습니다.</p>'+
        '<p class="hint" style="margin:0 0 14px">한 번 들어오면 이 브라우저에서는 로그인 상태가 유지됩니다.</p>'+
        note+
        '<div class="field"><label for="loginEmail">이메일</label>'+
          '<input id="loginEmail" type="email" placeholder="name@mightyblessing.com" autocomplete="email" value="'+esc(mail)+'"></div>'+
        '<div class="actions"><button class="btn primary" id="loginGo">로그인 메일 받기</button></div>';
    }
    app.innerHTML='<div style="max-width:400px;margin:40px auto"><div class="card">'+
      '<h2 style="margin-bottom:6px">마블 ERP</h2>'+body+'</div></div>';

    if(stage==='sent'){
      var ob=$('#otpCode'), og=$('#otpGo');
      ob.addEventListener('keydown',function(e){ if(e.key==='Enter') og.click(); });
      og.addEventListener('click',function(){
        var code=(ob.value||'').replace(/\D/g,'');
        if(code.length<6) return renderLogin(sb,'메일에 적힌 6자리 숫자를 넣어주세요.','sent');
        og.disabled=true; og.textContent='확인 중…';
        sb.auth.verifyOtp({email:mail, token:code, type:'email'}).then(function(r){
          if(r.error) return renderLogin(sb,loginError(r.error.message),'sent');
          cleanUrl(); location.reload();
        });
      });
      $('#loginAgain').addEventListener('click',function(){ renderLogin(sb,'',''); });
      ob.focus();
    }else{
      var go=$('#loginGo'), box=$('#loginEmail');
      box.addEventListener('keydown',function(e){ if(e.key==='Enter') go.click(); });
      go.addEventListener('click',function(){
        var v=(box.value||'').trim();
        if(!v||v.indexOf('@')<0) return renderLogin(sb,'이메일 주소를 확인해 주세요.','');
        go.disabled=true; go.textContent='보내는 중…';
        S.loginMail=v; keepMail(v);
        sb.auth.signInWithOtp({email:v,options:{emailRedirectTo:location.origin+location.pathname}})
          .then(function(r){
            if(r.error) return renderLogin(sb,loginError(r.error.message),'');
            renderLogin(sb,'','sent');
          });
      });
      if(!mail) box.focus();
    }
  }

  /* 슈파베이스가 돌려주는 영문 오류를 쓸 만한 안내로 바꾼다.
     허용되지 않은 도메인은 DB 트리거가 막기 때문에 "Database error" 로 올라온다. */
  function loginError(m){
    m=String(m||'');
    if(/Database error|Signups not allowed|not allowed|허용/i.test(m))
      return '이 주소로는 들어올 수 없습니다. 회사 메일(@mightyblessing.com)을 쓰시거나, 외부 주소라면 관리자에게 등록을 요청해 주세요.';
    if(/rate limit|too many/i.test(m))
      return '메일 발송 한도에 걸렸습니다. 잠시 뒤에 다시 시도해 주세요.';
    if(/expired/i.test(m))
      return '숫자가 만료되었습니다. 주소를 다시 넣어 새로 받아주세요.';
    if(/Token has expired or is invalid|invalid.*token|otp/i.test(m))
      return '숫자가 맞지 않습니다. 메일에 적힌 6자리를 다시 확인해 주세요.';
    if(/invalid/i.test(m)) return '이메일 주소를 확인해 주세요.';
    return m;
  }

  function startSupabase(){
    S.loading=true; render();
    /* 주소에 붙어 온 오류는 라이브러리가 읽기 전에 먼저 챙겨 둔다. */
    var urlErr=urlAuthError();
    loadScript(SB_LIB).then(function(){
      var sb=window.supabase.createClient(window.MB_SUPABASE.url, window.MB_SUPABASE.anonKey, {
        auth:{
          persistSession:true,      /* 로그인 상태를 이 브라우저에 보관한다 */
          autoRefreshToken:true,    /* 만료 전에 조용히 갱신한다 */
          detectSessionInUrl:true,  /* 메일 링크로 들어왔을 때 주소에서 토큰을 읽는다 */
          /* 기본값인 pkce 는 링크를 '요청한 그 브라우저'에만 로그인된다.
             요청할 때 만든 비밀값이 그 브라우저에만 남기 때문이다.
             메일 앱이 다른 브라우저를 열면 그대로 실패한다.
             implicit 는 링크 안에 토큰이 들어 있어 어느 브라우저에서 눌러도 들어온다. */
          flowType:'implicit'
          /* storageKey 는 건드리지 않는다. 이름을 바꾸면 이미 로그인한 사람의
             세션을 못 찾아 전원 다시 로그인하게 된다. */
        }
      });
      S.sb=sb;
      /* 들어온 적이 있어야 '나갔다'가 말이 된다. 처음부터 세션이 없을 때도
         SIGNED_OUT 이 올라오는데, 거기서 새로고침하면 끝없이 돈다. */
      var hadSession=false;
      sb.auth.onAuthStateChange(function(ev){
        if(ev==='SIGNED_IN'||ev==='TOKEN_REFRESHED') hadSession=true;
        if(ev==='SIGNED_OUT'&&hadSession) location.reload();
      });
      sb.auth.getSession().then(function(r){
        var session=r.data&&r.data.session;
        if(urlErr) cleanUrl();
        if(!session){
          S.loading=false;
          var why=urlErr?authErrorText(urlErr)
                :hadLogin()?'로그인이 만료되었습니다. 아래에서 다시 받아주세요.':'';
          return renderLogin(sb,why,'');
        }
        hadSession=true;
        if(session.user&&session.user.email) keepMail(session.user.email);
        sb.from('members').select('uid,email,name,role,created_at').then(function(m){
          var map={};
          if(m.error) errbar('구성원을 불러오지 못했습니다: '+m.error.message);
          (m.data||[]).forEach(function(row){ map[row.uid]={email:row.email,name:row.name,role:row.role,createdAt:row.created_at}; });
          S.members=map;
          wire(sbStore(sb), sbUser(session,map));
        });
      });
    }).catch(function(e){
      S.loading=false; S.fatal='슈파베이스 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'; render();
    });
  }

  /* ============ 부팅 ============ */
  function boot(){
    try{var s=JSON.parse(localStorage.getItem('mb-erp-nav')||'{}');
      if(s.v)S.view=s.v; if(s.s)S.sel=s.s; if(s.d)S.docSel=s.d;}catch(e){}
    renderNav();
    if(sbConfigured()) return startSupabase();
    var tries=0;
    (function wait(){
      if(window.claude&&typeof window.claude.use==='function')return start(window.claude);
      if(tries++>24){ return startDemo(); }
      setTimeout(wait,250);
    })();
  }
  function start(claude){
    Promise.all([claude.use('db'),claude.use('user')]).then(function(r){
      if(!r[0]) return startDemo();
      wire(r[0],r[1]);
    }).catch(function(){ startDemo(); });
  }
  function startDemo(){
    if(S.demo) return;
    S.demo=true; demoBanner();
    Object.keys(DEMO_NAMES).forEach(function(u){
      S.members[u]={email:u+'@mightyblessing.com',name:DEMO_NAMES[u],
        role:u==='demo-me'?'admin':'member',createdAt:'2026-01-01T00:00:00.000Z'};
    });
    wire(demoStore(), demoUser());
  }
  function wire(db,user){
      S.db=db; S.user=user;
      if(S.user){
        S.user.me().then(function(me){
          S.me.id=me.id;S.me.name=me.name;S.me.avatarUrl=me.avatarUrl;S.me.canEdit=me.canEdit;S.me.isOwner=me.isOwner;S.me.joinedAt=me.joinedAt||null;
          syncMyProfile();
          var w=$('#who');
          if(w){
            w.innerHTML='<img alt=""><span></span>'+(S.sb?'<button class="btn sm" id="signOut" style="margin-left:6px">로그아웃</button>':'');
            w.querySelector('img').src=avatarOf(me.id);
            w.querySelector('span').textContent=(me.name||'익명')+' · '+ROLE_LABEL[myRole()];
          }
          render();
        });
        S.user.can('data.write').then(function(v){S.canWrite=v;render();});
      }
      var t=setTimeout(function(){if(S.loading){S.loading=false;S.stale=true;render();}},10000);
      var seen=false;
      S.db.collection('events').onSnapshot(function(snap){
        var next={};
        snap.docs.forEach(function(d){
          var o=clone(d.data()); o.id=d.id;
          next[d.id]=(dirty===d.id&&S.events[d.id])?S.events[d.id]:o;
        });
        S.events=next;
        if(!snap.metadata.fromCache&&!seen){seen=true;clearTimeout(t);S.stale=false;}
        S.loading=false; render();
      },function(e){clearTimeout(t);S.loading=false;S.fatal='데이터를 불러오지 못했습니다 ('+e.code+')';render();});

      S.db.collection('docs').onSnapshot(function(snap){
        var next={};
        snap.docs.forEach(function(d){
          var o=clone(d.data()); o.id=d.id;
          next[d.id]=(dirty===d.id&&S.docs[d.id])?S.docs[d.id]:o;
        });
        S.docs=next; resolveNames(); render();
      },function(){});

      S.db.collection('approvals').onSnapshot(function(snap){
        var next={}; snap.docs.forEach(function(d){next[d.id]=clone(d.data());});
        S.approvals=next; resolveNames(); render();
      },function(){});

      S.db.collection('profiles').onSnapshot(function(snap){
        var av={}, rows={};
        snap.docs.forEach(function(d){ var o=d.data()||{}; rows[d.id]=o; if(o.avatar) av[d.id]=o.avatar; });
        S.avatars=av; S.profileRows=rows; S.profilesLoaded=true;
        syncMyProfile();
        render();
      },function(){});

      S.db.collection('notifs').onSnapshot(function(snap){
        var next={}; snap.docs.forEach(function(d){ next[d.id]=d.data()||{}; });
        S.notifs=next; render();
      },function(){});

      S.db.doc('config/logo').onSnapshot(function(d){
        S.logo=(d.exists&&d.data().dataUrl)||null; render();
      },function(){});

      S.db.doc('config/seal').onSnapshot(function(d){
        S.seal=(d.exists&&d.data().dataUrl)||null; render();
      },function(){});

      S.db.doc('config/roles').onSnapshot(function(d){
        var m=(d.exists&&d.data().map)?d.data().map:{};
        S.roles={}; Object.keys(m).forEach(function(k){S.roles[k]=m[k];});
        resolveNames(); render();
      },function(){});
  }
  boot();
})();
</script>
</body>
</html>
