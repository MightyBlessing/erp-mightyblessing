        '<h2>통장'+(canEdit&&!ed?' <button class="btn primary sm" id="bkNew" style="float:right">통장 추가</button>':'')+'</h2>'+
        (L.length
          ? '<div class="scroll"><table><thead><tr>'+
              '<th>통장</th><th>이월</th><th class="num">거래</th><th class="num">잔액</th>'+(canEdit?'<th></th>':'')+
            '</tr></thead><tbody>'+rows+
            '<tr><th>합계</th><th></th><th></th>'+
              '<th class="num" style="font-family:var(--font-num)">'+won(total)+'</th>'+(canEdit?'<th></th>':'')+'</tr>'+
            '</tbody></table></div>'
          : '<div class="empty" style="padding:24px 8px">통장이 아직 없습니다.'+
            (canEdit?'<br>「통장 추가」를 눌러 이월잔액부터 넣어주세요.':'')+'</div>')+
        '<p class="hint" style="margin-top:10px">잔액은 이월잔액에 장부의 거래를 더해 계산합니다. '+
          '통장에 찍힌 숫자와 다르면 빠진 거래가 있는 것입니다.</p>'+
      '</section>'+
      '</div>';
  }

  /* ─── 개인별 급여 ───
     「이 사람이 이번 달에 얼마 받았나」 하나만 답한다.
     보고서의 원천세 화면은 회사가 신고하려고 보는 것이고,
     여기는 사람 한 명을 세로로 본다.

     일당과 수당을 따로 보여주는 게 핵심이다. 합계만 보면
     "왜 저 사람보다 적지" 를 설명할 수 없다. */
  function payKeyOf(m){
    var pid=livePid(m.pid);
    return pid?('p:'+pid):('n:'+String(m.n||'').trim());
  }
  function payKeyName(key){
    if(!key) return '';
    if(key.slice(0,2)==='p:') return personName(key.slice(2))||'(이름 없음)';
    return key.slice(2)||'(이름 없음)';
  }
  /* 한 사람이 그 달에 참여한 행사들. 지급 전이면 행사 날짜로,
     지급 후면 실제 이체일로 잡는다. evPaidOn 이 그 둘을 이미 가린다. */
  function payRows(key,ym){
    var out=[];
    Object.keys(S.events).forEach(function(k){
      var ev=S.events[k], c=null;
      (ev.members||[]).forEach(function(m,i){
        if(payKeyOf(m)!==key) return;
        var on=evPaidOn(ev);
        if(ym&&String(on).slice(0,7)!==ym) return;
        if(!c) c=compute(ev);
        var day=memberDays(m)*c.rate, prep=num(c.alloc[i],0);
        if(day+prep<=0) return;
        out.push({evId:k, evName:ev.name||'(이름 없음)', on:on,
                  day:day, prep:prep, amt:day+prep, capped:!!c.capped[i],
                  pt:memberPt(m), role:togText('day',m)||m.r||'',
                  paid:progress(ev).status==='paid'});
      });
    });
    return out.sort(function(a,b){ return String(a.on).localeCompare(String(b.on)); });
  }
  /* 급여가 잡힌 달 목록 */
  function payMonths(key){
    var m={};
    Object.keys(S.events).forEach(function(k){
      var ev=S.events[k];
      (ev.members||[]).forEach(function(x){
        if(payKeyOf(x)!==key) return;
        var on=String(evPaidOn(ev)||'').slice(0,7);
        if(on) m[on]=1;
      });
    });
    return Object.keys(m).sort().reverse();
  }
  /* 이 사람의 대신결제 중 아직 못 받은 것 */
  function payAdv(key){
    if(key.slice(0,2)!=='p:') return [];
    var pr=S.people[key.slice(2)]||{};
    var uid=pr.uid||'';
    var nm=(pr.name||'').trim();
    return advOpen().filter(function(a){
      return (uid&&a.uid===uid) || (!a.uid&&nm&&String(a.name||'').trim()===nm);
    });
  }

  function renderPay(){
    var key=S.payWho;
    var months=payMonths(key);
    var ym=S.payYm||months[0]||today().slice(0,7);
    var L=payRows(key,ym), all=payRows(key,'');
    var name=payKeyName(key);

    var day=0,prep=0,paidSum=0;
    L.forEach(function(r){ day+=r.day; prep+=r.prep; if(r.paid) paidSum+=r.amt; });
    var tot=day+prep;

    /* 원천세는 그 달에 실제로 이체된 금액에만 붙는다.
       회계가 지급명세서에서 고친 값이 있으면 그걸 따른다. */
    var t=taxOf(paidSum);
    var doc=S.wh[ym]||{}, adj=(doc.adj||{})[key]||{};
    var inc=(adj.inc===undefined||adj.inc===null)?t.inc:num(adj.inc,0);
    var loc=(adj.loc===undefined||adj.loc===null)?t.loc:num(adj.loc,0);
    var fixed=(inc!==t.inc)||(loc!==t.loc);
    var netPay=paidSum-inc-loc;

    var pr=(key.slice(0,2)==='p:')?(S.people[key.slice(2)]||{}):{};
    var adv=payAdv(key);

    var rows=L.map(function(r){
      return '<tr class="rowlink" data-go="ev:'+esc(r.evId)+'">'+
        '<td style="white-space:nowrap">'+esc(r.on||'')+'</td>'+
        '<td><b>'+esc(r.evName)+'</b>'+
          (r.role?'<div style="font-size:12px;color:var(--muted)">'+esc(r.role)+'</div>':'')+'</td>'+
        '<td class="num" style="font-family:var(--font-num)">'+
          (r.day?won(r.day):'<span style="color:var(--zero)">—</span>')+'</td>'+
        '<td class="num" style="font-family:var(--font-num)">'+
          (r.prep?won(r.prep):'<span style="color:var(--zero)">—</span>')+
          (r.pt?'<div style="font-size:11.5px;color:var(--muted)">'+r.pt+'점'+
            (r.capped?' · 상한':'')+'</div>':'')+'</td>'+
        '<td class="num" style="font-family:var(--font-num);font-weight:600">'+won(r.amt)+'</td>'+
        '<td style="white-space:nowrap">'+
          (r.paid?'<span class="pill p-paid">지급됨</span>':'<span class="pill p-pending">예정</span>')+'</td>'+
      '</tr>';
    }).join('');

    app.innerHTML=
      '<div class="stack">'+
      '<div class="actions" style="margin:0 0 4px">'+
        '<button class="btn sm" id="payBack">← 인력 명부</button></div>'+
      '<section class="card"><h2>'+esc(name)+
        '<span style="float:right;font-size:13px;font-weight:400;color:var(--muted)">'+
          (pr.taxRole?esc(pr.taxRole):'세무 구분 없음')+
          (pr.bank?' · '+esc(pr.bank)+' '+esc(pr.acct||''):'')+'</span></h2>'+
        '<div class="field" style="max-width:220px"><label for="payYm">달</label>'+
          '<select id="payYm">'+
            (months.indexOf(ym)<0?'<option value="'+esc(ym)+'" selected>'+esc(ym)+'</option>':'')+
            months.map(function(m){
              return '<option value="'+esc(m)+'"'+(m===ym?' selected':'')+'>'+esc(m)+'</option>';
            }).join('')+'</select></div>'+
        '<p class="hint" style="margin:8px 0 0">지급이 끝난 행사는 실제 이체일 기준, '+
          '아직인 행사는 행사 날짜 기준으로 모읍니다.</p>'+
      '</section>'+
      '<div class="tiles">'+
        tile('일당', won(day), L.filter(function(r){return r.day>0;}).length+'일 근무')+
        tile('수당', won(prep), '준비 사례비')+
        tile('합계', won(tot), ym+' 기준')+
        /* 아직 한 푼도 안 나갔으면 '실수령 0원'은 거짓말로 읽힌다.
           못 받은 게 아니라 아직 때가 안 된 것이다. */
        (paidSum>0
          ? tile('실수령', won(netPay), paidSum<tot?'이체된 '+won(paidSum)+'에서 세금 뗀 금액':'원천세 뗀 금액')
          : tile('실수령', '—', '아직 이체 전입니다'))+
      '</div>'+
      '<section class="card"><h2>'+esc(ym)+' 내역</h2>'+
        (L.length
          ? '<div class="scroll"><table><thead><tr>'+
              '<th>날짜</th><th>행사</th><th class="num">일당</th><th class="num">수당</th>'+
              '<th class="num">합계</th><th>상태</th>'+
            '</tr></thead><tbody>'+rows+
            '<tr><th>합계</th><th></th>'+
              '<th class="num" style="font-family:var(--font-num)">'+won(day)+'</th>'+
              '<th class="num" style="font-family:var(--font-num)">'+won(prep)+'</th>'+
              '<th class="num" style="font-family:var(--font-num)">'+won(tot)+'</th>'+
              '<th></th></tr>'+
            '</tbody></table></div>'+
            '<p class="hint" style="margin-top:10px">행사 줄을 누르면 그 정산표로 갑니다.</p>'
          : '<div class="empty" style="padding:26px 8px">이 달에 받은 돈이 없습니다.'+
            (all.length?'<br>참여한 달: '+esc(payMonths(key).slice(0,8).join(' · ')):'')+'</div>')+
      '</section>'+
      (paidSum>0
        ? '<section class="card"><h2>원천세</h2>'+
          '<div class="scroll"><table><tbody>'+
            '<tr><th style="text-align:left">지급액 (이체 완료분)</th>'+
              '<td class="num" style="font-family:var(--font-num)">'+won(paidSum)+'</td></tr>'+
            '<tr><th style="text-align:left">소득세 3%</th>'+
              '<td class="num" style="font-family:var(--font-num)">−'+won(inc)+'</td></tr>'+
            '<tr><th style="text-align:left">지방소득세 0.3%</th>'+
              '<td class="num" style="font-family:var(--font-num)">−'+won(loc)+'</td></tr>'+
            '<tr><th style="text-align:left">실수령</th>'+
              '<td class="num" style="font-family:var(--font-num);font-weight:700">'+won(netPay)+'</td></tr>'+
          '</tbody></table></div>'+
          (fixed
            ? '<div class="note n-info" style="margin-top:12px">회계가 신고 금액에 맞춰 세액을 직접 고친 달입니다 '+
              '(계산값 '+won(t.inc)+' · '+won(t.loc)+').</div>'
            : '')+
          (paidSum<tot
            ? '<div class="note n-warn" style="margin-top:12px">아직 이체되지 않은 '+won(tot-paidSum)+'은 '+
              '세금 계산에서 빠져 있습니다. 지급이 끝나면 같이 잡힙니다.</div>'
            : '')+
        '</section>'
        : '')+
      (adv.length
        ? '<section class="card"><h2>아직 못 받은 대신결제</h2>'+
          '<div class="scroll"><table><thead><tr><th>낸 날</th><th>내역</th><th class="num">금액</th></tr></thead><tbody>'+
            adv.map(function(a){
              return '<tr><td style="white-space:nowrap">'+esc(a.on||'')+'</td>'+
                '<td>'+esc(a.item||'')+'</td>'+
                '<td class="num" style="font-family:var(--font-num)">'+won(num(a.amt,0))+'</td></tr>';
            }).join('')+
            '<tr><th>합계</th><th></th>'+
              '<th class="num" style="font-family:var(--font-num)">'+won(advSum(adv))+'</th></tr>'+
          '</tbody></table></div>'+
          '<p class="hint" style="margin-top:10px">급여와 별개로 돌려받을 돈입니다. '+
            '회계 → 대신결제에서 처리합니다.</p>'+
        '</section>'
        : '')+
      '</div>';
  }

  function renderPeople(){
    var L=peopleList(), q=(S.peopleQ||'').trim();
    if(q) L=L.filter(function(p){
      return (p.name||'').indexOf(q)>=0 || (p.taxRole||'').indexOf(q)>=0 || (p.phone||'').indexOf(q)>=0;
    });
    var dups=dupNames(), un=unlinkedNames(), mn=membersNotInPeople();
    var ed=S.personEdit, cur=(ed&&ed!=='new')?(S.people[ed]||{}):{};

    var form='';
    if(ed){
      form='<section class="card" style="margin-bottom:14px"><h2>'+(ed==='new'?'새 사람':'고치기')+'</h2>'+
        '<div class="row2">'+
          '<div class="field"><label for="pfName">이름</label><input id="pfName" value="'+esc(cur.name||'')+'" placeholder="홍길동"></div>'+
          '<div class="field"><label for="pfPhone">연락처</label><input id="pfPhone" value="'+esc(cur.phone||'')+'" placeholder="010-0000-0000"></div>'+
        '</div>'+
        '<div class="field"><label for="pfTax">세무 구분</label>'+
          '<input id="pfTax" list="taxhint" value="'+esc(cur.taxRole||'')+'" placeholder="지급명세서에 신고하는 역할">'+
          '<datalist id="taxhint">'+TAX_HINT.map(function(t){return '<option value="'+esc(t)+'">';}).join('')+'</datalist></div>'+
        '<div class="row2">'+
          '<div class="field"><label for="pfBank">은행</label><input id="pfBank" value="'+esc(cur.bank||'')+'"></div>'+
          '<div class="field"><label for="pfAcct">계좌번호</label><input id="pfAcct" value="'+esc(cur.acct||'')+'"></div>'+
        '</div>'+
        '<div class="field"><label for="pfNote">비고</label><input id="pfNote" value="'+esc(cur.note||'')+'" placeholder="세금신고 특이사항 등"></div>'+
        '<div class="actions"><button class="btn primary" id="pfSave">저장</button>'+
          '<button class="btn" id="pfCancel">취소</button></div>'+
        '<p class="hint" style="margin-top:10px">주민등록번호는 아직 받지 않습니다. 법상 암호화해서 보관해야 해서, 넣을지부터 정하고 붙이겠습니다.</p>'+
      '</section>';
    }

    var rows=L.map(function(p){
      var used=usedCount(p.id,(p.name||'').trim());
      return '<tr>'+
        '<td><button class="linkbtn" data-paywho="p:'+esc(p.id)+'"><b>'+esc(p.name||'(이름 없음)')+'</b></button>'+
          (p.uid?' <span class="pill p-approved">구성원</span>':'')+
          (dups[(p.name||'').trim()]?' <span class="pill p-rejected">이름 겹침</span>':'')+
          (p.phone?'<div style="font-size:12px;color:var(--muted)">'+esc(p.phone)+'</div>':'')+'</td>'+
        '<td>'+(p.taxRole?esc(p.taxRole):'<span style="color:var(--zero)">—</span>')+'</td>'+
        '<td style="color:var(--muted)">'+(p.bank?esc(p.bank)+' '+esc(p.acct||''):'—')+'</td>'+
        '<td class="num">'+used+'</td>'+
        '<td style="width:250px">'+
          '<button class="btn sm" data-paywho="p:'+esc(p.id)+'">급여</button> '+
          (S.personDel===p.id
            ? '<button class="btn danger sm" data-pyes="'+esc(p.id)+'">삭제</button>'+
              '<button class="btn sm" id="pNo" style="margin-left:5px">취소</button>'
            : '<button class="btn sm" data-pedit="'+esc(p.id)+'">고치기</button>'+
              '<button class="btn sm" data-mfrom="'+esc(p.id)+'" style="margin-left:4px">합치기</button>'+
              '<button class="del" data-pdel="'+esc(p.id)+'" aria-label="삭제" style="margin-left:4px">×</button>')+
        '</td></tr>';
    }).join('');

    app.innerHTML=
      settleTabs()+
      (un.length
        ? '<div class="note n-warn" style="margin:0 0 14px">'+
            '<b>명부에 없는 이름이 '+un.length+'명</b> 있습니다 — '+
            esc(un.slice(0,6).map(function(x){return x.n;}).join(', '))+(un.length>6?' 외':'')+'<br>'+
            '지금 정산표의 사람은 글자일 뿐이라 같은 사람에게 여러 번 지급한 걸 합칠 수 없습니다. '+
            '한 번에 올려두면 앞으로 이름을 고를 수 있습니다.'+
            '<div class="actions" style="margin-top:10px">'+
              '<button class="btn primary sm" id="pRegAll"'+(S.linking?' disabled':'')+'>'+
                (S.linking?'올리는 중…':un.length+'명 한 번에 올리기')+'</button></div>'+
          '</div>'
        : '')+
      (mn.length
        ? '<div class="note n-info" style="margin:0 0 14px">'+
            '<b>로그인한 구성원 '+mn.length+'명</b>이 아직 명부에 없습니다 — '+
            esc(mn.slice(0,6).map(function(x){return x.name;}).join(', '))+(mn.length>6?' 외':'')+'<br>'+
            '명부에 올려두면 정산표 이름칸에서 바로 고를 수 있고, 지급 합산도 사람 단위로 맞습니다.'+
            '<div class="actions" style="margin-top:10px">'+
              '<button class="btn sm" id="pMemAll"'+(S.linking?' disabled':'')+'>'+
                (S.linking?'올리는 중…':mn.length+'명 명부에 올리기')+'</button></div>'+
          '</div>'
        : '')+
      orphanBox()+
      sameBox()+
      mergeBox()+
      form+
      '<div class="actions" style="margin-bottom:14px">'+
        '<button class="btn primary" id="pNew"'+(writable()?'':' disabled')+'>+ 새 사람</button>'+
        '<button class="btn" id="pLink"'+(S.linking?' disabled':'')+'>이름 이어 붙이기</button>'+
        '<span style="flex:1"></span>'+
        '<input id="pQ" placeholder="이름으로 찾기" value="'+esc(S.peopleQ||'')+'" style="max-width:200px">'+
      '</div>'+
      '<div class="card">'+(rows
        ? '<div class="scroll"><table><thead><tr><th>이름</th><th>세무 구분</th><th>계좌</th><th class="num">참여</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
          '<p class="hint" style="margin-top:10px">이름이나 「급여」를 누르면 그 사람이 달마다 받은 일당·수당을 볼 수 있습니다.</p>'
        : '<div class="empty"><strong>'+(q?'찾는 사람이 없습니다':'아직 명부가 비어 있습니다')+'</strong>'+
          (q?'':'행사에 참여하는 사람을 여기 한 번 올려두면, 정산표에서 이름을 고르기만 하면 됩니다.')+'</div>')+
      '</div>';

    var qb=$('#pQ');
    if(qb) qb.addEventListener('input',function(){ S.peopleQ=qb.value; renderPeople(); $('#pQ').focus(); });
  }
  /* 끊긴 연결. 사람을 지워서 급여가 안 보이게 된 줄들이 여기 모인다. */
  function orphanBox(){
    var L=orphanRows(); if(!L.length) return '';

      '<b>끊긴 연결 '+tot+'줄 ('+L.length+'명)</b> — 명부에서 지워진 사람을 아직 가리키고 있습니다. '+
      '이름은 정산표에 남아 있으니 <b>받은 돈 기록이 없어진 건 아닙니다.</b> 길만 끊겨서 급여 화면에 안 보일 뿐입니다.'+
      '<div class="scroll" style="margin-top:10px"><table><thead><tr>'+
        '<th>이름</th><th>행사</th><th class="num">줄</th><th>어떻게 됩니까</th></tr></thead><tbody>'+
      L.map(function(o){
        return '<tr><td><b>'+esc(o.n)+'</b></td>'+
          '<td style="font-size:12.5px;color:var(--muted)">'+esc(o.evList.slice(0,3).join(' · '))+

    '</div>';
  }

  /* 같은 사람으로 보이는 짝을 먼저 보여준다. 합칠지는 사람이 고른다. */
  function sameBox(){

        '<th>남길 사람</th><th>합칠 사람</th><th></th></tr></thead><tbody>'+
      L.map(function(x){
        return '<tr>'+
          '<td><b>'+esc(x.keep.name||'')+'</b>'+
            '<div style="font-size:12px;color:var(--muted)">정산표 '+x.keepN+'줄'+
            (x.keep.uid?' · 구성원':'')+'</div></td>'+
          '<td>'+esc(x.drop.name||'')+
            '<div style="font-size:12px;color:var(--muted)">정산표 '+x.dropN+'줄'+
            (x.drop.uid?' · 구성원':'')+'</div></td>'+
          '<td style="width:120px"><button class="btn sm" data-mgo="'+esc(x.drop.id)+'|'+esc(x.keep.id)+'"'+

        '</tr>';
      }).join('')+'</tbody></table></div>'+

  }

  /* 직접 고르는 합치기. 추천에 안 걸린 짝(이름이 아예 다른 경우)을 위해 둔다. */
  function mergeBox(){
    if(!S.mergeFrom) return '';
    var dp=S.people[S.mergeFrom]; if(!dp) return '';
    var dn=(dp.name||'').trim();
    var others=peopleList().filter(function(x){ return x.id!==S.mergeFrom; });
    return '<section class="card" style="margin-bottom:14px"><h2>'+esc(dn)+' 합치기</h2>'+
      '<p class="hint" style="margin:0 0 12px"><b>'+esc(dn)+'</b> 의 정산표 '+
        usedCount(S.mergeFrom,dn)+'줄을 아래에서 고른 사람에게 모두 옮기고, '+
        '<b>'+esc(dn)+'</b> 은(는) 명부에서 지웁니다. 받은 돈 기록은 그대로 따라갑니다.</p>'+
      '<div class="field"><label for="mgTo">누구로 합칠까요</label>'+
        '<select id="mgTo"><option value="">— 고르세요 —</option>'+
        others.map(function(x){
          return '<option value="'+esc(x.id)+'"'+(S.mergeTo===x.id?' selected':'')+'>'+
            esc(x.name||'(이름 없음)')+' · 정산표 '+usedCount(x.id,(x.name||'').trim())+'줄'+
            (x.uid?' · 구성원':'')+'</option>';
        }).join('')+'</select></div>'+
      '<div class="actions">'+
        '<button class="btn primary" id="mgYes"'+(S.merging||!S.mergeTo?' disabled':'')+'>'+
          (S.merging?'합치는 중…':'합치기')+'</button>'+
        '<button class="btn" id="mgNo">취소</button></div>'+
    '</section>';
  }

  function settleTabs(){
    return '<div class="tabs" style="margin:0 0 14px">'+
      [['events','행사'],['people','인력']].map(function(x){
        return '<button type="button" data-stab="'+x[0]+'" aria-pressed="'+(S.setTab===x[0]?'true':'false')+'">'+x[1]+
          (x[0]==='people'?'<span class="n">'+Object.keys(S.people).length+'</span>':'')+'</button>';
      }).join('')+'</div>';
  }

  /* ---- 정산 (보존) ---- */
  function renderSettleList(){
    if(S.setTab==='people') return S.payWho?renderPay():renderPeople();

        '<div class="scroll"><table><thead><tr><th>행사</th><th>담당자</th><th>상태</th><th class="num">잔여액</th><th class="num">지급 합계</th></tr></thead><tbody>'+

        :'<div class="empty"><strong>아직 행사가 없습니다</strong>+ 새 행사를 눌러 첫 정산을 만들어 보세요.</div>')+'</div>';
  }
  /* 누르면 켜지는 단추. select 나 글상자와 달리 열고 고르고 닫는 과정이
     없다 — 보이는 것을 그냥 누른다. */
  function togs(kind,list,m,i,dis){
    var on=(m&&m[kind])||[];
    return '<div class="togs">'+list.map(function(it,k){
      var hit=on.indexOf(k)>=0;
      return '<button type="button" class="tog'+(hit?' on':'')+'" '+
        'data-tog="'+kind+'" data-tk="'+k+'" data-i="'+i+'"'+(dis?' disabled':'')+
        ' aria-pressed="'+(hit?'true':'false')+'">'+esc(it.t)+'</button>';
    }).join('')+
    /* 목록에 없는 일은 늘 생긴다. 그때 설정 화면까지 가게 하면 그냥
       비고에 적고 점수에는 안 들어간다. 여기서 바로 만든다. */
    (dis||!S.me.canEdit?'':'<button type="button" class="tog addtog" data-addtog="'+kind+'" data-i="'+i+'" title="목록에 없는 일을 더합니다">+</button>')+
    '</div>';
  }

          }).join('')+'</select></td>'+

        '<td><input data-f="memo" data-i="'+i+'" value="'+esc(m.memo||'')+'" '+

        '<td class="num">'+(day?day.toLocaleString('ko-KR'):'—')+'</td>'+
        '<td class="num'+(c.capped[i]?' capped':'')+'">'+

      '<b>점수가 가장 높은 사람이 1인 상한</b>을 받습니다. 나머지는 그 비율대로 받습니다.<br>'+
      '항목은 <b>시스템 설정 → 사전 준비 항목 · 공연 당일 역할</b>에서 고칠 수 있습니다.<br>'+

    var chain=[['행사 잔여액 (세후)',won(c.net)],['× 사례비 배정 비율',(c.ratio*100).toFixed(0)+'%'],['사례비 예산',won(c.fundBase)]];
    if(ev.wageSrc!=='opex')chain.push(['− 당일 일급 '+c.workedCount+'일','−'+won(c.dayTotal)]);
    chain.push(['준비 사례비 재원',won(c.pool)]);
    var delCtl='';

      delCtl=S.confirmDel===ev.id

        : '<button class="btn danger sm" id="delEvent">행사 삭제</button>';

            slackChList()+'</div>'+
          (ro?'':'<p class="hint" style="margin:-4px 0 0">이 채널에서 <b>/지출</b> 을 치면 이 행사로 달립니다. '+
            '비워 두면 행사 없이 들어옵니다.'+
            (S.slackChErr?' <span style="color:var(--warn)">목록을 못 불러왔습니다 — 직접 쳐주세요 ('+esc(S.slackChErr)+')</span>':'')+
            '</p>')+
          '<div class="field"><label>잔여액 산출</label><div class="seg">'+
            sg('mDirect','직접 입력',ev.mode!=='calc',ro)+sg('mCalc','수입 − 운영비 − 세금',ev.mode==='calc',ro)+'</div></div>'+
          (ev.mode==='calc'

              '<p class="hint">당일 일급은 사례비 예산에서 나갑니다. 운영비에 중복으로 넣지 마세요.</p>'

        '<section class="card"><h2>계산 설정</h2>'+

            '</select></div></div>'+
          '<div class="field"><label>당일 일급 재원</label><div class="seg">'+
            sg('sFund','사례비 예산 (기본)',ev.wageSrc!=='opex',ro)+sg('sOpex','운영비 별도',ev.wageSrc==='opex',ro)+'</div></div>'+
          /* 「상한 초과분 이월/재배분」은 없앴다. 상한에서 비율로 내려오므로

        '</section>'+
      '</div><div class="stack" style="min-width:0">'+

          '<th style="text-align:center">점수</th><th>비고</th>'+
          '<th class="num">당일 일급</th><th class="num">준비 사례비</th><th class="num">지급액</th><th></th></tr></thead>'+
          '<tbody>'+rows+'</tbody><tfoot><tr><td colspan="6">합계 · 참가 '+c.workedCount+'일</td>'+

  function sg(id,label,on,ro){return '<button type="button" id="'+id+'" aria-pressed="'+(on?'true':'false')+'"'+(ro?' disabled':'')+'>'+label+'</button>';}
  function settleNote(c,ev){
    if(c.shrunk)return '<div class="note n-warn">예산이 모자라 <b>모두 같은 비율로 줄였습니다.</b> '+
      '상한대로면 '+won(Math.round(c.cap*c.ptSum/(c.maxPt||1)))+'이 필요한데 예산은 '+won(c.pool)+'입니다.</div>';
    if(c.anyCap)return '<div class="note n-info">가장 높은 포인트가 1인 상한 '+won(c.cap)+'을 받았습니다. '+
      '남는 '+won(c.leftover)+'은 운영통장으로 이월됩니다.</div>';
    if(c.net<=0)return '<div class="note n-warn">잔여액이 0 이하라 사례비 예산이 잡히지 않습니다. 지급 여부를 따로 정해야 합니다.</div>';
    if(c.pool===0&&c.net>0)return '<div class="note n-warn">준비 사례비 재원이 0원입니다. 당일 일급이 사례비 예산을 다 썼습니다.</div>';
    return '';
  }
  function settleApproval(ev,p){
    var role=myRole(),id=S.me.id,iAcc=role==='accounting',iCeo=role==='ceo';
    var did=function(k){return p.list.some(function(a){return a.kind===k&&a.uid===id;});};
    var roleless=p.acc.length===0||p.ceo.length===0;
    var steps=[
      stp(p.status!=='draft','1','상신',p.status==='draft'?'작성이 끝나면 상신하세요.':'결재 진행 중'),
      stp(p.accDone,'2','회계 승인',p.acc.length?(p.okAcc.length+' / '+p.acc.length+'명 승인'):'회계 역할이 지정되지 않았습니다'),
      stp(p.confirms.length>0,'3','팀원 확인',p.confirms.length+'명 확인함'),
      stp(p.ceoDone,'4','대표 승인',p.ceoDone?'승인됨':'대표 승인 대기'),
      stp(p.status==='paid','5','지급 완료',p.status==='paid'?('이체일 '+(evPaidOn(ev)||'—')):'지급 대기')
    ].join('');
    var btns=[];
    if(writable()){
      if(p.status==='draft')btns.push('<button class="btn primary" data-act="submit">상신</button>');
      if(p.status==='submitted'){
        if(iAcc&&!did('accounting'))btns.push('<button class="btn primary" data-act="accounting">회계 승인</button>');
        if(iCeo&&!did('ceo'))btns.push('<button class="btn primary" data-act="ceo">대표 승인</button>');
        if(!did('confirm'))btns.push('<button class="btn" data-act="confirm">확인했습니다</button>');
        if(iAcc||iCeo)btns.push('<button class="btn danger" data-act="reject">반려</button>');
      }
      if(p.status==='approved'&&iAcc){
        btns.push('<span style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)">'+
          '이체일 <input id="evPayOn" type="date" value="'+esc(S.payOn||today())+'" style="width:150px;padding:6px 8px"></span>');
        var bl=bankList();
        if(bl.length){
          btns.push('<span style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)">'+
            '나간 통장 <select id="evPayBank" style="width:150px;padding:6px 8px">'+
            '<option value="">— 장부에 안 넣음 —</option>'+
            bl.map(function(b){ return '<option value="'+esc(b.id)+'"'+(S.payBank===b.id?' selected':'')+'>'+esc(b.name)+'</option>'; }).join('')+
            '</select></span>');
          btns.push('<label style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)">'+
            '<input type="checkbox" id="evPayWh"'+(S.payWh!==false?' checked':'')+'> 원천세 떼고 보냄</label>');
        }
        btns.push('<button class="btn primary" data-act="paid">지급 완료</button>');
      }
      if(p.status==='approved'&&!did('confirm'))btns.push('<button class="btn" data-act="confirm">확인했습니다</button>');
    }
    var log=p.list.slice().reverse().map(function(a){
      var what={confirm:'확인',accounting:'회계 승인',ceo:'대표 승인',paid:'지급 완료',reject:'반려',submit:'상신'}[a.kind]||a.kind;
      return '<div style="display:flex;gap:8px;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px">'+
        '<span><b>'+esc(nameOf(a.uid))+'</b> · '+what+'</span><span style="color:var(--muted);white-space:nowrap">'+esc(shortTime(a.at))+'</span></div>';
    }).join('');
    return '<section class="card"><h2>결재</h2>'+
      (roleless?'<div class="note n-warn" style="margin:0 0 12px">회계·대표 역할이 아직 지정되지 않아 승인이 완료될 수 없습니다. 좌측 <b>역할</b>에서 지정하세요.</div>':'')+
      '<div class="steps">'+steps+'</div>'+
      (btns.length?'<div class="actions" style="margin-top:14px">'+btns.join('')+'</div>':'')+
      (log?'<h2 style="margin-top:18px">기록</h2>'+log:'')+'</section>';
  }
  function stp(done,n,t,m){
    return '<div class="step'+(done?' done':'')+'"><span class="dot">'+(done?'✓':n)+'</span>'+
      '<span><span class="t">'+t+'</span><br><span class="m">'+esc(m)+'</span></span></div>';
  }

  /* ---- 역할 ---- */
  /* ---- 회계 ---- */
  function expenses(){
    return Object.keys(S.docs).map(function(k){return S.docs[k];}).filter(function(d){return d&&d.type==='expense';});
  }
  function acctList(tab){
    var all=expenses().filter(function(d){return docStatus(d)==='approved';});
    if(tab==='pending') all=all.filter(function(d){return payState(d)!=='paid';});
    if(tab==='paid')    all=all.filter(function(d){return payState(d)==='paid';});
    all.sort(function(a,b){
      var ka=(payState(a)==='paid'?paidOn(a):(schedOn(a)||a.dueDate||a.date||''));
      var kb=(payState(b)==='paid'?paidOn(b):(schedOn(b)||b.dueDate||b.date||''));
      return kb<ka?-1:1;
    });
    return all;
  }
  function groupKey(d,by){
    if(by==='account') return d.account||'기타';
    if(by==='method')  return METHODS[d.method]||'기타';
    var ev=d.eventId&&S.events[d.eventId];
    return ev?(ev.name||'(이름 없음)'):'행사 미지정';
  }

  function acctTabs(){
    return '<div class="tabs" style="margin:0 0 14px">'+
      [['spend','지출 현황'],['book','장부'],['evpl','행사별'],['adv','대신결제'],['budget','예산'],['banks','통장']].map(function(x){
        return '<button type="button" data-amain="'+x[0]+'" aria-pressed="'+(S.acctMain===x[0]?'true':'false')+'">'+x[1]+
          (x[0]==='book'?'<span class="n">'+Object.keys(S.ledger).length+'</span>':'')+
          (x[0]==='adv'&&advOpen().length?'<span class="n">'+advOpen().length+'</span>':'')+
          (x[0]==='banks'?'<span class="n">'+Object.keys(S.banks).length+'</span>':'')+'</button>';
      }).join('')+'</div>';
  }

  function renderAcct(){
    if(S.acctMain==='book')  return renderBook();
    if(S.acctMain==='evpl')  return renderEvPl();
    if(S.acctMain==='adv')   return renderAdv();
    if(S.acctMain==='budget') return renderBudget();
    if(S.acctMain==='banks') return renderBanks();
    var approved=expenses().filter(function(d){return docStatus(d)==='approved';});
    var pending=approved.filter(function(d){return payState(d)!=='paid';});
    var paid=approved.filter(function(d){return payState(d)==='paid';});
    var inflight=expenses().filter(function(d){return ['submitted','progress'].indexOf(docStatus(d))>=0;});
    var sum=function(a){return a.reduce(function(x,d){return x+expTotal(d);},0);};
    var thisMonth=today().slice(0,7);
    var mPaid=paid.filter(function(d){return paidOn(d).slice(0,7)===thisMonth;});
    var noEv=paid.filter(function(d){return !evFiles(d).length;});

    var tabs=[['pending','지급 대기'],['paid','지급 완료'],['all','전체']];
    var list=acctList(S.acctTab);

    var g={}, order=[];
    paid.forEach(function(d){
      var k=groupKey(d,S.acctBy);
      if(!g[k]){ g[k]={n:0,v:0}; order.push(k); }
      g[k].n++; g[k].v+=expTotal(d);
    });
    order.sort(function(a,b){return g[b].v-g[a].v;});
    var gmax=order.reduce(function(a,k){return Math.max(a,g[k].v);},0)||1;
    var gtotal=order.reduce(function(a,k){return a+g[k].v;},0);

    var byLabel={event:'행사 / 사업',account:'계정과목',method:'지급 수단'};

    app.innerHTML=
      '<div class="stack">'+
      acctTabs()+
      '<div class="tiles">'+
        tile('지급 대기', won(sum(pending)), pending.length+'건 · 승인됨', pending.length>0)+
        tile('이번 달 지급', won(sum(mPaid)), mPaid.length+'건')+
        tile('지급 완료 누계', won(sum(paid)), paid.length+'건')+
        tile('결재 중 지출', won(sum(inflight)), inflight.length+'건')+
        tile('증빙 없는 지급', noEv.length+'건', noEv.length?'영수증을 붙여주세요':'모두 갖춰졌습니다', noEv.length>0)+
      '</div>'+

      '<section class="card"><h2>'+byLabel[S.acctBy]+'별 지출</h2>'+
        '<div class="tabs" style="margin:0 0 12px">'+
          [['event','행사 / 사업'],['account','계정과목'],['method','지급 수단']].map(function(x){
            return '<button type="button" data-aby="'+x[0]+'" aria-pressed="'+(S.acctBy===x[0]?'true':'false')+'">'+x[1]+'</button>';
          }).join('')+'</div>'+
        (order.length
          ? '<div class="scroll"><table><thead><tr><th>'+byLabel[S.acctBy]+'</th><th class="num">건수</th><th class="num">금액</th><th style="width:34%">비중</th></tr></thead><tbody>'+
            order.map(function(k){
              var w=Math.max(2,Math.round(g[k].v/gmax*100));
              return '<tr><td><b>'+esc(k)+'</b></td><td class="num">'+g[k].n+'</td>'+
                '<td class="num" style="font-family:var(--font-num)">'+won(g[k].v)+'</td>'+
                '<td><div style="height:9px;border-radius:5px;background:var(--line)">'+
                  '<div style="height:9px;width:'+w+'%;border-radius:5px;background:var(--accent)"></div></div>'+
                  '<span style="font-size:11px;color:var(--muted)">'+Math.round(g[k].v/(gtotal||1)*100)+'%</span></td></tr>';
            }).join('')+
            '<tr><th>합계</th><th class="num">'+paid.length+'</th><th class="num" style="font-family:var(--font-num)">'+won(gtotal)+'</th><th></th></tr>'+
            '</tbody></table></div>'
          : '<div class="empty" style="padding:24px 8px">지급 완료된 지출이 아직 없습니다.</div>')+
        '<p class="hint" style="margin-top:10px">지급 완료된 건만 집계합니다. 승인만 되고 아직 안 나간 돈은 위 &lsquo;지급 대기&rsquo;에 있습니다.</p>'+
      '</section>'+

      '<section class="card"><h2>지출 목록</h2>'+
        '<div class="tabs" style="margin:0 0 12px">'+tabs.map(function(t){
          return '<button type="button" data-atab="'+t[0]+'" aria-pressed="'+(S.acctTab===t[0]?'true':'false')+'">'+t[1]+
            '<span class="n">'+acctList(t[0]).length+'</span></button>';
        }).join('')+'</div>'+
        (list.length
          ? '<div class="scroll"><table><thead><tr><th>제목</th><th>행사</th><th>계정과목</th><th>받는 사람</th><th class="num">금액</th><th>증빙</th><th>지급</th><th class="num">일자</th></tr></thead><tbody>'+
            list.map(function(d){
              var ps=payState(d), ev=d.eventId&&S.events[d.eventId];
              return '<tr class="rowlink" data-go="doc:'+esc(d.id)+'">'+
                '<td><b>'+esc(d.title||'(제목 없음)')+'</b><div style="font-size:12px;color:var(--muted)">'+esc(d.no||'')+'</div></td>'+
                '<td>'+esc(ev?(ev.name||''):'—')+'</td>'+
                '<td style="color:var(--muted)">'+esc(d.account||'—')+'</td>'+
                '<td>'+esc(d.payee||'—')+'</td>'+
                '<td class="num" style="font-family:var(--font-num)">'+won(expTotal(d))+'</td>'+
                '<td>'+(evFiles(d).length
                  ? '<span class="pill p-approved">'+evFiles(d).length+'</span>'
                  : '<span class="pill p-rejected">없음</span>')+'</td>'+
                '<td><span class="pill p-'+(ps==='paid'?'approved':(payLate(d)?'rejected':'pending'))+'">'+PAY_LABEL[ps]+'</span>'+
                  (ps==='sched'?'<div style="font-size:11.5px;color:var(--muted)">'+esc(schedOn(d))+(payLate(d)?' 지남':'')+'</div>':'')+'</td>'+
                '<td class="num" style="color:var(--muted)">'+esc(ps==='paid'?paidOn(d):(d.dueDate||d.date||''))+'</td></tr>';
            }).join('')+'</tbody></table></div>'
          : '<div class="empty"><strong>해당하는 지출이 없습니다</strong>전자결재에서 지출결의서를 올리면 여기에 모입니다.</div>')+
      '</section></div>';
  }

  function payExpense(d){
    if(!S.db||!d)return;
    if(docStatus(d)!=='approved') return errbar('승인이 끝난 문서만 지급 처리할 수 있습니다');
    if(payState(d)==='paid')      return errbar('이미 지급 처리된 건입니다');
    if(!(myRole()==='accounting'||S.me.canEdit)) return errbar('회계 역할을 가진 사람만 지급 처리할 수 있습니다');
    var on=String(S.payOn||'').slice(0,10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(on)) return errbar('이체일을 넣어주세요');
    var body=clone(d); delete body.id;
    /* 잡아뒀던 예정일은 지운다고 없애지 않는다. 「언제 주기로 했고 언제 줬나」를
       나중에 비교하려면 둘 다 남아 있어야 한다. */
    var keepSched=(d.pay||{}).schedOn||'';
    body.pay={state:'paid', on:on, at:nowISO(), by:S.me.id, memo:S.payMemo||'', amount:expTotal(d)};
    if(keepSched) body.pay.schedOn=keepSched;
    body.updatedAt=nowISO();
    var bank=S.payBank||'';
    S.db.doc('docs/'+d.id).set(body).then(function(){
      S.confirmPay=null; S.payMemo=''; S.payOn=''; S.payBank='';
      notify(d.drafter, '「'+docLabel(d)+'」 '+won(expTotal(d))+' 지급이 끝났습니다', d.id);
      slackSay('paid', {what:docLabel(d), sub:ymdKo(on)+' 이체 완료 · 처리 '+(S.me.name||''),
        rows:[['금액', won(expTotal(d))],
              ['받는 사람', d.payee||'—'],
              ['통장', bankName(bank)||'—'],
              (keepSched&&keepSched!==on)?['예정 대비', '예정 '+keepSched+' → 실제 '+on]:['',''] ],
        link:appLink('docs',d.id), cta:'문서 보기'});
      if(!bank){ flash('지급 완료로 기록했습니다'); return render(); }
      var ev=d.eventId?S.events[d.eventId]:null;
      postLed('doc:'+d.id,{
        on:on, dir:'out', amt:expTotal(d), bank:bank,
        ev:(d.eventId||''),
        biz:ev?'다. 예배운영':'가. 운영비',
        item:(d.account||d.title||'').slice(0,40),
        party:(d.payee||'').slice(0,40),
        memo:docLabel(d)+(ev?' · '+(ev.name||''):''),
        way:(METHODS[d.method]||''), note:S.payMemo||''
      }).then(function(){ flash('지급 완료 · 장부에 넣었습니다'); render(); })
       .catch(function(){ flash('지급은 기록했는데 장부에 못 넣었습니다'); render(); });
    }).catch(function(e){ errbar('지급 처리 실패 '+(e&&(e.code||e.message)||'')); });
  }

  /* ---- 구성원과 초대 ---- */
  var JOIN_URL=(function(){
    try{ return location.origin+location.pathname.replace(/index\.html$/,''); }catch(e){ return ''; }
  })();
  var MB_DOMAIN='@mightyblessing.com';

  function memberList(){
    return Object.keys(S.members).map(function(u){
      var m=S.members[u]||{};
      return {uid:u, email:m.email||'', name:m.name||m.email||'알 수 없음',
              admin:m.role==='admin', role:S.roles[u]||'member', joinedAt:m.createdAt||''};
    }).sort(function(a,b){ return (a.joinedAt||'')<(b.joinedAt||'')?-1:1; });
  }
  /* 새로 들어온 사람은 members 테이블에만 생긴다. 실시간 구독 대상이 아니라서
     이 화면을 열 때 다시 읽어 온다. */
  function refreshMembers(){
    if(!S.sb)return;
    S.sb.from('members').select('uid,email,name,role,created_at').then(function(r){
      if(r.error)return;
      var map={};
      (r.data||[]).forEach(function(x){ map[x.uid]={email:x.email,name:x.name,role:x.role,createdAt:x.created_at}; });
      S.members=map;
      if(S.me.id&&map[S.me.id]) S.me.canEdit=S.me.isOwner=(map[S.me.id].role==='admin');
      render();
    });
  }
  function loadAllowed(){
    if(!S.sb||S.allowed!==null)return;
    S.allowed=[];
    S.sb.from('allowed_emails').select('email,note,created_at').then(function(r){
      S.allowed=r.error?[]:(r.data||[]); render();
    });
  }
  /* 메일 링크로 처음 들어온 사람은 이름이 메일 앞글자로 들어간다.
     구글로 들어오면 구글 이름이 들어오지만, 이미 만들어진 행은 덮어쓰지 않는다.
     그럴 때 관리자가 여기서 실명으로 고친다. SQL 을 또 돌릴 일이 아니다. */
  function saveMemberName(uid,nm){
    if(!S.sb||!S.me.canEdit)return;
    nm=String(nm||'').trim();
    if(!nm) return errbar('이름을 넣어주세요');
    S.busyUid=uid; render();
    S.sb.from('members').update({name:nm}).eq('uid',uid).then(function(r){
      S.busyUid=null; S.memberEdit=null;
      if(r.error){ errbar('이름 변경 실패 — '+r.error.message); return render(); }
      flash('이름을 바꿨습니다');
      refreshMembers();
    });
  }
  function setAdmin(uid,on){
    if(!S.sb||!S.me.canEdit)return;
    if(uid===S.me.id&&!on) return errbar('자기 관리자 권한은 스스로 내릴 수 없습니다. 다른 관리자에게 부탁하세요.');
    S.busyUid=uid; S.confirmAdmin=null; render();
    S.sb.from('members').update({role:on?'admin':'member'}).eq('uid',uid).then(function(r){
      S.busyUid=null;
      if(r.error){ errbar('권한 변경 실패 — '+r.error.message); return render(); }
      notify(uid, on?'관리자 권한을 받았습니다':'관리자 권한이 해제되었습니다','');
      flash(on?'관리자로 지정했습니다':'관리자를 해제했습니다');
      refreshMembers();
    });
  }
  function addAllowed(){
    if(!S.sb||!S.me.canEdit)return;
    var em=String(S.inviteMail||'').trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return errbar('이메일 주소를 확인해 주세요');
    if(em.slice(-MB_DOMAIN.length)===MB_DOMAIN) return errbar('회사 주소는 등록하지 않아도 바로 로그인됩니다');
    S.sb.from('allowed_emails').upsert({email:em,note:''}).then(function(r){
      if(r.error) return errbar('등록 실패 — '+r.error.message);
      S.inviteMail=''; S.allowed=null; loadAllowed();
      flash(em+' 주소를 허용했습니다');
    });
  }
  function removeAllowed(em){
    if(!S.sb||!S.me.canEdit)return;
    S.sb.from('allowed_emails').delete().eq('email',em).then(function(r){
      if(r.error) return errbar('해제 실패 — '+r.error.message);
      S.allowed=null; loadAllowed(); flash('허용을 해제했습니다');
    });
  }
  function copyInvite(){

  /* ---- 손익 보고서 ---- */
  /* 한 해의 돈이 어디서 들어와 어디로 나갔는지 한 장으로 본다.
     기준은 '현금이 움직인 날'이다. 지출결의서는 지급일, 정산은 행사일.
     승인만 되고 아직 안 나간 돈은 여기 들어오지 않는다. */
  function repRange(){
    var y=S.rep.y, seg=S.rep.seg;
    function d(m,day){ return y+'-'+pad2(m)+'-'+pad2(day); }
    if(seg==='all') return {from:y+'-01-01', to:y+'-12-31', label:y+'년 전체'};
    if(seg.charAt(0)==='q'){
      var q=+seg.slice(1), m0=(q-1)*3+1;
      return {from:d(m0,1), to:d(m0+2,lastDay(y,m0+2)), label:y+'년 '+q+'분기'};
    }
    var m=+seg;
    return {from:d(m,1), to:d(m,lastDay(y,m)), label:y+'년 '+m+'월'};
  }
  function pad2(n){ n=String(n); return n.length<2?('0'+n):n; }
  function lastDay(y,m){ return new Date(y,m,0).getDate(); }
  function inRange(iso,r){ var k=ymd(iso); return !!k && k>=r.from && k<=r.to; }

  function repData(){
    var r=repRange();
    var evs=Object.keys(S.events).map(function(k){return S.events[k];})
      /* 사례비가 나간 행사는 이체일로, 아직 안 나간 행사는 행사일로 본다. */
      .filter(function(e){ return inRange(progress(e).status==='paid'?evPaidOn(e):e.date, r); })
      .sort(function(a,b){ return (a.date||'')<(b.date||'')?-1:1; });
    /* 지급이 끝난 지출결의서만. 기준일은 실제로 돈이 나간 날. */
    var exps=expenses().filter(function(d){
      return docStatus(d)==='approved' && payState(d)==='paid' && inRange(paidOn(d),r);
    });
    var byEvent={};
    exps.forEach(function(d){ var k=d.eventId||''; (byEvent[k]=byEvent[k]||[]).push(d); });

    var rows=evs.map(function(e){
      var c=compute(e), pr=progress(e);
      var direct=e.mode!=='calc';
      var rev=direct?null:num(e.rev);
      var cost=direct?null:(num(e.opex)+num(e.tax));
      var fee=pr.status==='paid'?c.payTotal:0;
      var own=(byEvent[e.id]||[]).reduce(function(a,d){return a+expTotal(d);},0);
      var sub=S.repNet?0:own;                    /* 운영비에 이미 들어갔다고 보면 빼지 않는다 */
      return {e:e, direct:direct, rev:rev, cost:cost, net:c.net, fee:fee, feePending:pr.status!=='paid'?c.payTotal:0,
              own:own, bal:c.net-fee-sub};
    });
    var loose=(byEvent['']||[]);
    var looseTotal=loose.reduce(function(a,d){return a+expTotal(d);},0);

    var sum=function(f){ return rows.reduce(function(a,x){return a+(f(x)||0);},0); };
    var anyDirect=rows.some(function(x){return x.direct;});
    return {r:r, rows:rows, loose:loose, looseTotal:looseTotal, exps:exps, anyDirect:anyDirect,
      income:sum(function(x){return x.rev;}),
      cost:sum(function(x){return x.cost;}),
      fee:sum(function(x){return x.fee;}),
      feePending:sum(function(x){return x.feePending;}),
      own:sum(function(x){return x.own;}),
      profit:sum(function(x){return x.bal;})-looseTotal};
  }
  /* ============ 원천세 · 지급명세서 ============
     준철님 방식 그대로다.
       · 당월 1일~말일에 '이체'된 인건비를 행사 건별로 모은다 (이체일 기준)
       · 원천세 — 총 인원(인원중복 포함) / 총 지급액 / 국세 3% / 지방세 0.3%
       · 지급명세서 — 한 사람에게 여러 번 지급된 건 합쳐서 한 줄
       · 특이사항은 비고에 적는다
     주민등록번호는 넣지 않는다. 준철님이 따로 관리하신다. */
  /* 사업 구분. 「2026 마이티블레싱 회계」 시트의 사업명을 그대로 쓴다.
     여기를 바꾸면 지난 장부와 대조가 안 되므로 함부로 고치지 않는다. */
  function BIZL(){ return cfgList('biz',BIZ_DEF); }
  /* 결제수단. 시트 「분류」 탭에 적힌 경우의 수. */
  /* 대신결제는 회사 돈이 아니라 개인 돈이 먼저 나간 것이다. */
  var ADVWAY=['개인카드','현금','개인계좌'];
  function PAYWAYL(){ return cfgList('payway',PAYWAY_DEF); }

  var INC_RATE=0.03, LOC_RATE=0.003;
  var TAX_DEFAULT='행사도우미';
  function taxOf(amt){
    /* 1원 단위까지 쓴다. 국세청이 신고 때 임의로 반올림하므로 아래에서 고칠 수 있다. */
    return {inc:Math.floor(num(amt,0)*INC_RATE), loc:Math.floor(num(amt,0)*LOC_RATE)};
  }
  function whMonth(){
    return S.whYm || (function(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1); })();
  }
  function whKey(r){ return r.pid?('p:'+r.pid):('n:'+r.name); }
  function whDoc(){ return S.wh[whMonth()]||{}; }

  /* 그 달에 이체된 사례비를 사람별 한 줄씩 펼친다. */
  function whRows(ym){
    var out=[];
    Object.keys(S.events).forEach(function(k){
      var ev=S.events[k];
      if(progress(ev).status!=='paid') return;
      var on=evPaidOn(ev);
      if(String(on).slice(0,7)!==ym) return;
      var c=compute(ev);
      (ev.members||[]).forEach(function(m,i){
        /* 받은 돈 = 당일 일급(근무했으면) + 준비 사례비 */
        var amt=(memberDays(m)*c.rate)+num(c.alloc[i],0);
        if(amt<=0) return;
        out.push({pid:m.pid||'', name:(m.pid&&personName(m.pid))||String(m.n||'').trim()||'(이름 없음)',
                  evId:k, evName:ev.name||'(이름 없음)', on:on, amount:amt, role:m.r||''});
      });
    });
    return out.sort(function(a,b){ return (a.on+a.evName+a.name).localeCompare(b.on+b.evName+b.name,'ko'); });
  }
  /* 지급명세서 — 한 사람 한 줄 */
  function whPeople(rows){
    var m={}, order=[];
    rows.forEach(function(r){
      var k=whKey(r);
      if(!m[k]){ m[k]={key:k, pid:r.pid, name:r.name, n:0, amount:0, evs:{}}; order.push(k); }
      m[k].n++; m[k].amount+=r.amount; m[k].evs[r.evName]=1;
    });
    var doc=whDoc(), adj=doc.adj||{}, note=doc.note||{};
    return order.map(function(k){
      var o=m[k], t=taxOf(o.amount), a=adj[k]||{};
      o.taxRole=(o.pid&&(S.people[o.pid]||{}).taxRole)||'';
      o.incCalc=t.inc; o.locCalc=t.loc;
      o.inc=(a.inc===undefined||a.inc===null)?t.inc:num(a.inc,0);
      o.loc=(a.loc===undefined||a.loc===null)?t.loc:num(a.loc,0);
      o.fixed=(o.inc!==o.incCalc)||(o.loc!==o.locCalc);
      o.note=note[k]||'';
      o.evList=Object.keys(o.evs);
      return o;
    }).sort(function(a,b){ return b.amount-a.amount; });
  }
  function whSave(patch){
    if(!S.db)return;
    var ym=whMonth(), cur=clone(S.wh[ym]||{});
    Object.keys(patch).forEach(function(k){
      if(k==='adj'||k==='note'){
        cur[k]=cur[k]||{};
        Object.keys(patch[k]).forEach(function(kk){ cur[k][kk]=patch[k][kk]; });
      } else cur[k]=patch[k];
    });
    cur.updatedAt=nowISO();
    S.db.doc('withholding/'+ym).set(cur)
      .catch(function(e){ errbar('저장 실패 '+(e&&(e.code||e.message)||'')); });
  }

  /* ---- 역할 ---- */
  /* ─── 시스템 설정 ───
     바뀌는 값은 코드가 아니라 여기 있어야 한다. 계정과목 하나 늘릴 때마다
     개발자를 찾게 두면, 결국 「기타」로 몰아넣고 장부가 무뎌진다. */
  /* ─── 기여 항목 ───
     「이 사람은 7점」은 설명이 안 된다. 왜 7인지 아무도 모르고, 나중에
     보면 적은 사람도 모른다. 한 일에 체크하고 그 합이 점수가 되면
     숫자가 스스로 설명한다.
     빈칸을 주면 안 적는다. 안 적으면 왜 그 점수인지가 사라지고,
     나중에 보면 적은 사람도 모른다. 누르는 것으로 바꾼다.
     한 번 누를 때마다 그 항목 점수만큼 올라간다.

     「점수|이름」 한 줄에 하나. 가름쇠는 | 다 — 가운뎃점은 이름 안에도
     들어간다(「섭외·계약」). 설정에서 고친다. 내가 정한 목록이 이 회사
     일과 안 맞을 수 있고, 그때 코드를 고치게 하면 안 된다. */
  var PTPREP_DEF=[
    '1|기획·구성','1|대본·큐시트','1|디자인·영상 제작','1|송출화면 제작',
    '1|섭외·계약','1|대관·견적','1|홍보','1|소모품 구매·발주',
    '1|사전 테스트','1|정산·행정'
  ];
  var PTDAY_DEF=[
    '1|공연 연출','1|음향','1|영상·LED 운영','1|관객 접수',
    '1|현장 진행','1|촬영','1|설치·철수'
  ];
  function ptList(k,def){
    return cfgList(k,def).map(function(line){
      var a=String(line||'').split('|');
      return {w:num(a[0],1), t:String(a[1]||'').trim()};
    }).filter(function(it){ return it.t; });
  }
  function ptPrep(){ return ptList('ptprep',PTPREP_DEF); }
  function ptDay(){  return ptList('ptday', PTDAY_DEF); }
  /* 눌러 둔 항목을 글로. 내보내기와 옛 화면이 글을 기대한다. */
  function togText(kind,m){
    var L=kind==='day'?ptDay():ptPrep();
    return ((m&&m[kind])||[]).map(function(i){ return (L[i]&&L[i].t)||''; })
      .filter(Boolean).join(', ');
  }
  function sumPicks(list,picks){
    return (picks||[]).reduce(function(a,i){ return a+((list[i]&&list[i].w)||0); },0);
  }
  /* 누른 게 있으면 그 합이 점수다. 하나도 안 눌렀으면 예전처럼 적어 둔
     숫자를 쓴다 — 지난 정산을 지금 규칙으로 다시 계산하면 안 된다. */
  /* 하루만 일하는 행사가 아니다. 설치·리허설·본공연으로 사흘을 붙어
     있으면 일급도 사흘치다. 체크 하나로는 그걸 못 적는다. */
  function memberDays(m){
    if(!m) return 0;
    if(m.days!==undefined&&m.days!==null&&m.days!=='') return Math.max(0,num(m.days,0));
    return m.w?1:0;     /* 옛 정산은 체크 하나 = 하루 */
  }
  /* 대표가 기여도를 보고 직접 정한 금액. 비어 있으면 계산에 맡긴다. */
  function memberFix(m){
    if(!m) return null;
    if(m.fix===undefined||m.fix===null||String(m.fix).trim()==='') return null;
    return Math.max(0,num(m.fix,0));
  }
  /* 대표는 기여도 1등과 같은 사례비를 받는다.
     금액을 나중에 덮어쓰지 않고 「점수를 1등과 같게」 둔다. 상한에서
     비율로 내려오는 규칙이라 점수가 같으면 금액이 같고, 예산이 모자라
     줄어들 때도 둘이 같이 줄어든다. 금액을 덮어쓰면 예산이 깨진다. */
  function ceoNameSet(){
    var out={};
    ceoUids().forEach(function(u){
      var n=String(nameOf(u)||'').trim(); if(n) out[n]=1;
      var m2=S.members[u]; if(m2&&m2.name) out[String(m2.name).trim()]=1;
    });
    return out;
  }
  function isCeoMember(m,set){
    if(!m) return false;
    var n=String(m.n||'').trim(), pn=String(personName(m.pid)||'').trim();
    return !!((n&&set[n])||(pn&&set[pn]));
  }
  function memberPt(m){
    if(!m) return 0;
    var a=(m.prep||[]).length, b=(m.day||[]).length;
    if(a||b) return sumPicks(ptPrep(),m.prep)+sumPicks(ptDay(),m.day);
    return num(m.pt,0);
  }
  var LISTS=[
    {k:'accounts', t:'계정과목', d:ACCOUNTS_DEF, h:'지출결의서에서 고르는 항목입니다.'},
    {k:'biz',      t:'사업 구분', d:BIZ_DEF,     h:'장부와 행사별 수지를 가르는 기준입니다. 회계 시트의 사업명과 같게 두세요.'},

    {k:'ptprep',   t:'사전 준비 항목', d:PTPREP_DEF,
     h:'정산에서 누르는 단추입니다. 「점수|이름」 한 줄에 하나 — 가름쇠는 | 입니다. 누른 항목의 합이 그 사람 점수가 됩니다.'},
    {k:'ptday',    t:'공연 당일 역할', d:PTDAY_DEF,
     h:'당일 역할 단추입니다. 같은 모양으로 적습니다. 당일 일급과는 별개로 점수에 더해집니다.'}

  function saveCfg(id,body){
    if(!S.db) return Promise.resolve();
    if(!S.me.canEdit) return Promise.reject({code:'관리자만 고칠 수 있습니다'});
    body.updatedAt=nowISO(); body.by=S.me.id||'';
    return S.db.doc('config/'+id).set(body);
  }
  function saveList(k,arr){
    var next=clone(S.lists||{}); next[k]=arr;
    return saveCfg('lists',next).then(function(){
      S.confEdit=null; S.confDraft=''; flash('저장했습니다'); render();
    }).catch(function(e){ errbar('저장 실패 '+(e&&(e.code||e.message)||'')); });
  }

  /* ─── 슬랙으로 알리기 ───
     슬랙은 알림과 협업만 맡는다. 공식 기록은 여기 남는다.
     그래서 보내는 건 「무슨 일이 있었고 어디로 가면 되는지」 한 줄이면 된다.

     보내다 실패해도 하던 일을 막지 않는다. 결재가 슬랙 때문에 멈추면 안 된다. */
  /* 주소가 둘이면 링크가 갈린다. 다른 주소로 들어가면 로그인이 따로 잡혀서
     「처음 보는 사람」이 된다. 알림 링크는 늘 정식 주소 하나를 가리켜야 한다.
     설정에 적어두지 않으면 지금 열어둔 주소를 쓴다. */
  function appBase(){
    var b=String((S.slack||{}).base||'').trim();
    if(b){ return b.replace(/\/+$/,'')+'/'; }
    return location.origin+location.pathname;
  }
  function appLink(view,id){
    return appBase()+'#'+view+(id?('/'+id):'');
  }
  /* 포도알·라테키가 쓰는 모양을 그대로 따른다. 같은 일터에서 알림이
     서로 다른 모양으로 오면 읽는 사람이 매번 형식을 새로 익혀야 한다.

       :이모지: 제목 — 무엇
       날짜 · 누구                     ← 부제, 굵게 안 함
       *라벨*
       값
       :arrow_upper_right: <링크|여기서 하기>
       :large_purple_circle: *마이티블레싱 ERP* · <주소|주소>
  */
  var SLACK_FACE={
    ask:    {e:':inbox_tray:',      t:'결재 요청'},
    ok:     {e:':white_check_mark:',t:'최종 승인'},
    no:     {e:':no_entry:',        t:'반려'},
    due:    {e:':calendar:',        t:'지급 예정'},
    paid:   {e:':moneybag:',        t:'지급 완료'},
    settled:{e:':ledger:',          t:'정산 완료'},
    test:   {e:':satellite_antenna:',t:'연결 시험'}
  };
  function ymdKo(d){
    var m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m?(+m[2]+'월 '+(+m[3])+'일'):String(d||'');
  }
  /* 돈·결재를 다른 채널로 보내고 싶을 수 있다. 두 번째 주소가 있으면
     돈에 관한 것(지급 예정·지급 완료·정산 완료)은 그쪽으로 간다. */
  function slackHook(kind){
    var sl=S.slack||{};
    var money=(kind==='due'||kind==='paid'||kind==='settled');
    return (money&&sl.hook2)?sl.hook2:(sl.hook||'');
  }
  /* ─── 보내는 길 두 가지 ───
     옛 길: 브라우저가 웹후크로 바로 쏜다. 그러려면 웹후크 주소가
            config/slack 에 있어야 하고, 그 문서는 로그인한 사람이면
            누구나 읽는다. 주소만 있으면 누구든 우리 슬랙에 글을 쓴다.
            게다가 no-cors 라 성공했는지도 알 수 없다.
     새 길: Edge Function 을 거친다. 주소는 서버에만 있고,
            성공·실패가 진짜로 돌아온다.
     함수가 아직 안 올라간 집에서도 알림은 가야 하므로, 새 길이 막히면
     옛 길로 보낸다. */
  function fnUrl(){
    var c=window.MB_SUPABASE;
    return (c&&c.url)?String(c.url).replace(/\/+$/,'')+'/functions/v1/erp-slack':'';
  }
  function sbToken(){
    if(!S.sb||!S.sb.auth||!S.sb.auth.getSession) return Promise.resolve('');
    return S.sb.auth.getSession().then(function(r){
      return (r&&r.data&&r.data.session&&r.data.session.access_token)||'';
    }).catch(function(){ return ''; });
  }
  function hookPost(text,hook){
    if(!hook) return Promise.resolve(false);
    return fetch(hook,{method:'POST',mode:'no-cors',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text})})
      .then(function(){ return true; }).catch(function(){ return false; });
  }
  /* 결재는 당사자 일이다. 채널에 다 뿌리면 남의 일이 하루 종일 흘러가고,
     그러다 자기 차례도 같이 흘려보낸다. 당사자에게 쪽지로 보낸다. */
  function mailOf(uid){
    var m=(S.members||{})[uid];
    return (m&&m.email)||'';
  }
  function slackPost(text,money,hook,to){
    var url=fnUrl();
    if(!url) return hookPost(text,hook);
    return sbToken().then(function(tok){
      if(!tok) return hookPost(text,hook);
      return fetch(url,{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},
        body:JSON.stringify({action:'notify',text:text,money:!!money,to:to||''})})
        .then(function(r){ return r.json().catch(function(){ return {ok:r.ok}; }); })
        .then(function(j){ return (j&&j.ok)?true:hookPost(text,hook); })
        .catch(function(){ return hookPost(text,hook); });
    });
  }
  /* 채널 이름을 손으로 받아 적게 하면 오타가 난다. 오타는 조용히 안 걸린다 —
     「행사 없음」으로 들어와 버린다. 한 번 불러다 고르게 한다. */
  var chLoading=false;
  function loadSlackChs(){
    if(chLoading||S.slackChs!==null) return;
    var url=fnUrl(); if(!url){ S.slackChs=[]; return; }
    chLoading=true;
    sbToken().then(function(tok){
      if(!tok){ S.slackChs=[]; chLoading=false; return; }
      return fetch(url,{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},
        body:JSON.stringify({action:'channels'})})
        .then(function(r){ return r.json(); })
        .then(function(j){
          chLoading=false;
          S.slackChs=(j&&j.ok&&j.rows)?j.rows:[];
          S.slackChErr=(j&&j.ok)?'':((j&&j.error)||'채널을 못 불러왔습니다');
          render();
        });
    }).catch(function(){ chLoading=false; S.slackChs=[]; S.slackChErr='채널을 못 불러왔습니다'; });
  }
  function slackChList(){
    var L=S.slackChs||[];
    if(!L.length) return '';
    return '<datalist id="slackchs">'+L.map(function(c){
      return '<option value="#'+esc(c.name)+'"></option>';
    }).join('')+'</datalist>';
  }

  function slackSay(kind, o, hookOverride){
    try{
      var sl=S.slack||{};
      var hook=hookOverride||slackHook(kind);
      if(!hook&&!fnUrl()) return Promise.resolve(false);
      if((sl.on||{})[kind]===false) return Promise.resolve(false);

      var f=SLACK_FACE[kind]||{e:':bell:',t:'알림'};
      var L=[f.e+' '+f.t+(o.what?(' — '+o.what):'')];
      if(o.sub) L.push(o.sub);
      (o.rows||[]).forEach(function(r){
        if(r[1]==null||r[1]==='') return;
        L.push('*'+r[0]+'*'); L.push(String(r[1]));
      });
      /* 링크 라벨 안에 :이모지: 를 넣으면 슬랙이 링크 밖으로 밀어낸다.
         이모지는 라벨 앞에 따로 둔다. */
      if(o.link) L.push(':arrow_upper_right: <'+o.link+'|'+(o.cta||'ERP에서 열기')+'>');
      if(o.foot) L.push(o.foot);
      var base=appBase();
      var host=base.replace(/^https?:\/\//,'').replace(/\/.*$/,'');
      L.push(':large_purple_circle: *마이티블레싱 ERP* · <'+base+'|'+host+'>');

      /* 주소를 손으로 넣어 시험하는 중이면 그 주소로 바로 쏜다.
         아직 저장도 안 된 주소라 함수는 모른다. */
      if(hookOverride) return hookPost(L.join('\n'),hookOverride);
      var money=(kind==='due'||kind==='paid'||kind==='settled');
      return slackPost(L.join('\n'),money,hook,o.to);
    }catch(e){ return Promise.resolve(false); }
  }
  /* 결재선을 「김준철 → 최현영」으로. 끝난 사람은 ✓ 를 붙인다. */
  function lineText(d){
    return (d.steps||[]).map(function(x){
      return nameOf(x.uid)+(x.state==='approved'?' ✓':x.state==='rejected'?' ✗':'');
    }).join(' → ');

  /* 올린 그림을 220px 정사각 PNG로 줄여서 config/seal 에 넣는다.
     원본을 그대로 담으면 문서 한 건이 수 MB가 되어 동기화가 느려진다. */
  function onSealFile(file){
    if(!file)return;
    if(file.size>8*1024*1024) return errbar('그림이 너무 큽니다 (8MB 이하)');
    var fr=new FileReader();
    fr.onerror=function(){errbar('파일을 읽지 못했습니다');};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){errbar('그림 형식을 읽지 못했습니다. PNG 또는 JPG로 올려주세요.');};
      img.onload=function(){
        var out;
        try{ out=trimImage(img,220); }catch(e){ return errbar('그림을 변환하지 못했습니다'); }
        if(!out) return errbar('직인을 찾지 못했습니다. 배경이 밝은 그림인지 확인해 주세요.');
        saveSeal(out);
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  }
  /* 올린 그림에서 흰 배경을 빼고, 인장 부분만 잘라 220px 정사각 PNG로 만든다.
     스캔한 직인은 대개 흰 종이 위에 찍혀 있어서, 그대로 쓰면 공문 글자를 가린다. */
  function trimImage(img,N){
    var W=img.width, H=img.height;
    var c0=document.createElement('canvas'); c0.width=W; c0.height=H;
    var x0=c0.getContext('2d'); x0.drawImage(img,0,0);
    var im=x0.getImageData(0,0,W,H), px=im.data;
    var minX=W, minY=H, maxX=-1, maxY=-1;
    for(var y=0;y<H;y++){
      for(var x=0;x<W;x++){
        var i=(y*W+x)*4, r=px[i], g=px[i+1], b=px[i+2], a=px[i+3];
        if(a<8){ continue; }
        var mx=Math.max(r,g,b), mn=Math.min(r,g,b);
        /* 밝고 색이 없는 화소 = 종이. 투명하게 만든다. */
        if(mn>205 && mx-mn<26){ px[i+3]=0; continue; }
        /* 옅은 회색 테두리는 부드럽게 깎아 계단을 줄인다 */
        if(mn>170 && mx-mn<26){ px[i+3]=Math.round(a*(205-mn)/35); if(px[i+3]<8) continue; }
        if(x<minX)minX=x; if(x>maxX)maxX=x;
        if(y<minY)minY=y; if(y>maxY)maxY=y;
      }
    }
    if(maxX<0) return null;
    x0.putImageData(im,0,0);
    var pad=Math.round(Math.max(maxX-minX,maxY-minY)*0.04);
    minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad);
    maxX=Math.min(W-1,maxX+pad); maxY=Math.min(H-1,maxY+pad);
    var cw=maxX-minX+1, ch=maxY-minY+1;
    var cv=document.createElement('canvas'); cv.width=N; cv.height=N;
    var ctx=cv.getContext('2d');
    ctx.imageSmoothingQuality='high';
    var r2=Math.min(N/cw,N/ch), dw=cw*r2, dh=ch*r2;
    ctx.drawImage(c0,minX,minY,cw,ch,(N-dw)/2,(N-dh)/2,dw,dh);
    return cv.toDataURL('image/png');
  }

  /* 로고는 가로로 긴 그림이라 정사각으로 자르면 안 된다. 흰 배경만 빼고
     긴 변을 560px에 맞춘다. */
  function trimWide(img,MW,MH){
    var sq=trimImage(img,Math.max(MW,MH)); if(!sq)return null;
    return sq;
  }
  /* 얼굴 사진은 배경을 빼면 안 된다(살구색·흰옷이 뚫린다). 가운데를 정사각으로
     자르고 줄이기만 한다. */
  function fitSquare(img,N){
    var cv=document.createElement('canvas'); cv.width=cv.height=N;
    var ctx=cv.getContext('2d'); ctx.imageSmoothingQuality='high';
    var side=Math.min(img.width,img.height);
    ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,N,N);
    return cv.toDataURL('image/jpeg',0.86);
  }
  function readImage(file,limitMB,done){
    if(!file)return;
    if(file.size>limitMB*1024*1024) return errbar('그림이 너무 큽니다 ('+limitMB+'MB 이하)');
    var fr=new FileReader();
    fr.onerror=function(){errbar('파일을 읽지 못했습니다');};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){errbar('그림 형식을 읽지 못했습니다. PNG 또는 JPG로 올려주세요.');};
      img.onload=function(){ try{ done(img); }catch(e){ errbar('그림을 변환하지 못했습니다'); } };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  }

  document.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&e.target&&e.target.id==='mnEdit'&&S.memberEdit){
      e.preventDefault(); return saveMemberName(S.memberEdit, e.target.value);

  document.addEventListener('change',function(e){
    var t=e.target;
    /* 일수·금액은 손을 떼는 순간 합계와 계산 과정까지 맞춰 준다. */
    if(t.dataset&&(t.dataset.f==='days'||t.dataset.f==='fix')&&S.sel&&S.events[S.sel]){
      return render();
    }
    if(t.id==='sealFile') return onSealFile(t.files&&t.files[0]);
    if(t.id==='nform'&&S.newPanel){
      S.newPanel.form=t.value;
      /* 회의 결과 보고는 안으로 올리는 문서다. 서식을 고르면 거기 맞춰 바꿔준다.
         바꾼 뒤에도 대내/대외 단추로 다시 고를 수 있다. */
      var f=FORMS[t.value];
      if(f&&f.scope) S.newPanel.scope=f.scope;
      pickRender('nform'); return;
    }
    if(t.id==='logoFile') return onLogoFile(t.files&&t.files[0]);
    if(t.id==='avaFile')  return onAvatarFile(t.files&&t.files[0]);
    if(t.id==='evFile'){ addEvidence(t.files); t.value=''; return; }
    var xd=S.docSel&&S.docs[S.docSel];
    if(xd&&xd.type==='expense'){
      var sm={xEvent:'eventId',xAccount:'account',xMethod:'method'};
      if(sm[t.id]){ xd[sm[t.id]]=t.value; touch('doc',xd.id); pickRender(t.id); return; }
    }
    if(xd&&xd.type!=='expense'&&t.id==='dScope'){
      xd.scope=t.value; xd.seal=t.value!=='in'; touch('doc',xd.id); pickRender('dScope'); return;
    }
    if(t.dataset&&t.dataset.apk){
      var cd=S.docSel&&S.docs[S.docSel];
      if(cd&&isApply(cd)){ cd[t.dataset.apk]=t.value; touch('doc',cd.id); pickRender('ap_'+t.dataset.apk); return; }
    }
    if(t.id==='whY'){ S.whYm=t.value+'-'+whMonth().slice(5,7); pickRender('whY'); return; }
    if(t.id==='whM'){ S.whYm=whMonth().slice(0,4)+'-'+t.value; pickRender('whM'); return; }
    if(t.id==='repY'){ S.rep.y=+t.value; pickRender('repY'); return; }
    if(t.id==='repM'){ S.rep.seg=t.value||'all'; pickRender('repM'); return; }
    if(t.id==='repNet'){ S.repNet=t.checked; render(); return; }
    if(t.dataset&&t.dataset.roleFor)return setRole(t.dataset.roleFor,t.value);
    if(t.id==='evPayOn'){ S.payOn=t.value; return; }
    if(t.id==='unit'){var ev=S.sel&&S.events[S.sel]; if(ev){ev.unit=t.value;touch('ev',ev.id);pickRender('unit');}}
  });

  /* 글자를 칠 때마다 화면을 통째로 다시 그리면 커서가 튄다.
     미리보기 조각만 갈아끼운다. */
  function softApply(d){
    try{
      var box=document.querySelector('.card .doc');
      if(!box) return;
      var tmp=document.createElement('div');
      tmp.innerHTML=applyPreview(d);
      box.parentNode.replaceChild(tmp.firstChild, box);
    }catch(e){}
  }

  /* 붙임 줄은 미리보기 맨 끝에만 나온다. 그 한 조각만 갈아끼운다. */
  function softPreview(d){
    try{
      var box=document.querySelector('.card .doc .att, .card .doc .end');
      if(!box)return;
      var tmp=document.createElement('div');
      tmp.innerHTML=attBlock(d);
      box.parentNode.replaceChild(tmp.firstChild, box);
    }catch(e){}
  }

  /* 수량·단가를 칠 때마다 전체를 다시 그리면 글자가 튄다. 숫자만 갈아끼운다. */
  function softExpense(d){
    var tb=document.querySelector('tbody'); if(!tb)return;
    Array.prototype.forEach.call(tb.rows,function(tr,i){
      var it=d.items&&d.items[i]; if(!it)return;
      if(tr.cells[3]) tr.cells[3].textContent=won(num(it.qty,0)*num(it.price,0));
    });
    var tot=$('#xTotal'); if(tot) tot.textContent=won(expTotal(d));
  }

  function softNumbers(ev){
    var c=compute(ev),tb=document.querySelector('tbody'); if(!tb)return;
    Array.prototype.forEach.call(tb.rows,function(tr,i){
      var m=ev.members&&ev.members[i]; if(!m)return;
      var sb=tr.querySelector('[data-ptsum]');
      if(sb) sb.textContent=(c.isCeo[i]&&c.topOther>0)?c.topOther:memberPt(m);
      var day=memberDays(m)*c.rate,prep=c.alloc[i]||0;
      if(tr.cells[6])tr.cells[6].textContent=day?day.toLocaleString('ko-KR'):'—';
      if(tr.cells[7])tr.cells[7].textContent=prep?prep.toLocaleString('ko-KR'):'—';
      if(tr.cells[8])tr.cells[8].textContent=(day+prep).toLocaleString('ko-KR');
    });
  }

  /* ============ 액션 ============ */
  function newDoc(kind,opt){
    if(!S.db)return;
    var ref=S.db.collection('docs').doc();
    var body = kind==='expense' ? newExpenseBody()
             : APPLY[kind]      ? newApplyBody(kind)
             :                    newDocBody(opt&&opt.form,opt&&opt.scope);
    ref.set(body).then(function(){S.view='docs';S.docSel=ref.id;S.newPanel=null;remember();render();})

  }
  /* 지급 예정일만 적어둔다. 돈은 아직 안 나갔으니 장부는 건드리지 않는다. */
  function setSched(d,on){
    if(!S.db) return;
    if(!(myRole()==='accounting'||S.me.canEdit)) return errbar('회계 역할을 가진 사람만 잡을 수 있습니다');
    if(on&&!/^\d{4}-\d{2}-\d{2}$/.test(on)) return errbar('날짜를 넣어주세요');
    var pay=clone(d.pay||{});
    if(on){ pay.schedOn=on; pay.schedBy=S.me.id||''; pay.schedAt=nowISO(); }
    else { delete pay.schedOn; delete pay.schedBy; delete pay.schedAt; }
    S.db.doc('docs/'+d.id).update({pay:pay,updatedAt:nowISO()}).then(function(){
      S.schedOn='';
      flash(on?('지급 예정일 '+on+' 으로 잡았습니다'):'예정을 지웠습니다');
      if(on) slackSay('due', {what:docLabel(d), sub:ymdKo(on)+'에 나갈 예정입니다',
        rows:[['금액', won(expTotal(d))],
              ['받는 사람', d.payee||'—'],
              ['예정일', on]],
        link:appLink('docs',d.id), cta:'문서 보기'});
      render();
    }).catch(function(e){ errbar('저장 실패 '+(e&&e.code||'')); });
  }

  function removeDoc(){
    var id=S.docSel; if(!S.db||!id)return;
    /* 장부에 전표가 꽂힌 문서는 지울 수 없다. 행사와 같은 이유다 —
       통장에서는 돈이 나갔는데 왜 나갔는지가 사라진다. */
    if(ledBySrc('doc:'+id)){
      S.confirmDocDel=null; render();
      return errbar('이 문서로 장부에 전표가 들어가 있어 지울 수 없습니다. 회계 → 장부에서 먼저 정리해 주세요');
    }
    S.db.doc('docs/'+id).delete().then(function(){S.confirmDocDel=null;S.docSel=null;remember();flash('문서를 삭제했습니다');render();})
      .catch(function(e){errbar('삭제 실패 '+(e&&e.code||''));});
  }
  function docAct(d,kind){
    if(!S.db||!S.me.id)return;
    if(kind==='submit'){ d.status='submitted'; }
    else if(kind==='cancel'){ d.status='canceled'; }
    else if(kind==='reopen'){
      d.status='draft';
      d.steps=(d.steps||[]).map(function(s){return {uid:s.uid,state:'pending',comment:'',at:''};});
    }
    else if(kind==='approve'||kind==='reject'){
      var i=currentStep(d); if(i<0)return;
      d.steps[i]={uid:d.steps[i].uid,state:kind==='approve'?'approved':'rejected',comment:'',at:nowISO()};
      if(kind==='reject')d.status='rejected';
    }
    d.updatedAt=nowISO();
    var body=clone(d); delete body.id;
    S.db.doc('docs/'+d.id).set(body).then(function(){ notifyDoc(d,kind); render(); })
      .catch(function(e){errbar('처리 실패 '+(e&&e.code||''));});
  }
  function copyDoc(d){
    var L=['마이티블레싱','수신: '+(d.to||''),'참조: '+(d.cc||''),'제목: '+(d.subject||''),''];
    (d.paras||[]).forEach(function(p,i){L.push((i+1)+'. '+p);});
    L.push('');
    (d.ov||[]).forEach(function(r,i){ if((r.k||'').trim()||(r.v||'').trim()) L.push((OV_LETTER[i]||'')+'. '+r.k+'\t'+r.v); });
    L.push('','끝.','',d.signer||'', (d.no||'')+' ('+(d.date||'')+')', d.addr||'', (d.tel1||'')+' / '+(d.tel2||''), d.email||'');
    put(L.join('\n'),'공문 본문을 복사했습니다');

  function newEvent(){
    if(!S.db)return;

    ref.set({name:'새 행사',date:today(),place:'',mode:'direct',net:0,rev:0,opex:0,tax:0,
      rate:150000,ratio:50,cap:300000,unit:10000,wageSrc:'fund',capMode:'carry',members:[],status:'draft',
      createdBy:S.me.id||'',createdAt:nowISO(),updatedAt:nowISO()})

  function removeEvent(){
    var id=S.sel,ev=S.events[id]; if(!S.db||!ev)return;
    /* 장부에 이 행사로 오간 돈이 있으면 지울 수 없다.
       행사만 지우면 그 줄들은 통장 잔액에는 남은 채 행사별 수지에서만
       사라진다. 돈은 통장에서 움직였는데 어디에 쓴 돈인지 알 수 없게 된다. */
    var tied=0;
    Object.keys(S.ledger).forEach(function(k){ if((S.ledger[k]||{}).ev===id) tied++; });
    if(tied){
      S.confirmDel=null; render();
      return errbar('장부에 이 행사로 오간 돈이 '+tied+'건 있어 지울 수 없습니다. 회계 → 장부에서 먼저 정리해 주세요');
    }
    var jobs=apprOf(id).map(function(a){return S.db.doc('approvals/'+id+'__'+a.kind+'__'+a.uid).delete().catch(function(){});});
    Promise.all(jobs).then(function(){return S.db.doc('events/'+id).delete();})
      .then(function(){S.confirmDel=null;S.sel=null;remember();flash('행사를 삭제했습니다');render();})
      .catch(function(e){errbar('삭제 실패 '+(e&&e.code||''));});
  }
  function settleAct(ev,kind){
    if(!S.db||!S.me.id)return;
    if(kind==='submit'){ev.status='submitted';return writeStatus(ev,'submit');}
    if(kind==='paid'){
      var on=String(S.payOn||'').slice(0,10);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(on)) return errbar('이체일을 넣어주세요');
      var bank=S.payBank||'', wh=S.payWh!==false;
      var gross=compute(ev).payTotal;
      /* 통장에서 실제로 나간 돈. 원천세를 떼고 보내셨으면 세후다.
         원천세는 익월 10일에 따로 나가므로 그때 한 줄 더 적으시면 된다. */
      /* 원천세는 사람마다 뗀다. 총액에 한 번 걸면 1원 단위에서
         지급명세서와 어긋난다 — 신고 서류와 통장 잔액이 안 맞는다. */
      var cc=compute(ev), txTot=0;
      (ev.members||[]).forEach(function(m,i){
        var a=(memberDays(m)*cc.rate)+num(cc.alloc[i],0);
        if(a<=0) return;
        var t=taxOf(a); txTot+=t.inc+t.loc;
      });
      var net=wh?(gross-txTot):gross;
      ev.status='paid'; ev.paidOn=on;
      S.db.doc('events/'+ev.id).update({status:'paid',paidOn:on,updatedAt:nowISO()})
        .then(function(){
          S.payOn=''; S.payBank=''; logApproval(ev,'paid');
          slackSay('settled', {what:ev.name||'행사', sub:ymdKo(on)+' 이체 완료 · '+(ev.members||[]).length+'명',
            rows:[['사례비 총액', won(gross)],
                  wh?['원천세', '−'+won(txTot)]:['',''],
                  ['실제 지급', won(net)],
                  ['통장', bankName(bank)||'—']],
            link:appLink('settle',ev.id), cta:'정산표 보기'});
          if(!bank){ flash(on+' 지급으로 기록했습니다'); return render(); }
          return postLed('ev:'+ev.id,{
            on:on, dir:'out', amt:net, bank:bank,
            ev:ev.id,
            biz:'다. 예배운영', item:'사례비',
            party:(ev.members||[]).length+'명',
            memo:(ev.name||'행사')+' 사례비',
            way:'계좌이체',
            note:wh?('세전 '+won(gross)+' · 원천세 '+won(txTot)+' 공제'):'원천세 공제 없음'
          }).then(function(){
            flash(on+' 지급 · 장부에 '+won(net)+' 넣었습니다'); render();
          });
        })
        .catch(function(e){ errbar('처리 실패 '+(e&&e.code||'')); });
      return;
    }
    if(kind==='reject'){ev.status='draft';logApproval(ev,'reject');return writeStatus(ev,null);}
    logApproval(ev,kind);
  }
  function writeStatus(ev,kind){
    S.db.doc('events/'+ev.id).update({status:ev.status,updatedAt:nowISO()})
      .then(function(){if(kind)logApproval(ev,kind);render();})
      .catch(function(e){errbar('처리 실패 '+(e&&e.code||''));});
  }
  function logApproval(ev,kind){
    S.db.doc('approvals/'+ev.id+'__'+kind+'__'+S.me.id)
      .set({eventId:ev.id,uid:S.me.id,kind:kind,note:'',at:nowISO()})
      .catch(function(e){errbar('기록 실패 '+(e&&e.code||''));});
  }
  function setRole(uid,role){
    if(!S.db)return;
    var next={}; Object.keys(S.roles).forEach(function(k){next[k]=S.roles[k];});
    /* 팀원은 기본값이다. 명단에 남겨 둘 이유가 없다. */
    if(role==='member') delete next[uid]; else next[uid]=role;
    S.db.doc('config/roles').set({map:next}).catch(function(e){errbar('역할 저장 실패 '+(e&&e.code||''));});
  }
  function copyTable(ev){
    var c=compute(ev);
    var L=[(ev.name||'')+' 팀 사례비 정산표',
      ['팀원','사전 준비 및 실제 기여','공연 당일 역할','점수','비고','당일 일급','준비 사례비','지급액'].join('\t')];
    (ev.members||[]).forEach(function(m,i){

              memberPt(m), m.memo||'', d, c.alloc[i], d+c.alloc[i]].join('\t'));
    });
    L.push(['합계','당일 근무 '+c.workedCount+'명','',c.ptSum,'',c.dayTotal,c.prepTotal,c.payTotal].join('\t'),'',
      ['정산 기준액',c.net].join('\t'),['사례비 배정 비율',(c.ratio*100)+'%'].join('\t'),
      ['사례비 예산',c.fundBase].join('\t'),['1인당 당일 일급',c.rate].join('\t'),['지급 후 잔액',c.leftover].join('\t'));
    put(L.join('\n'),'표를 복사했습니다');

  function put(text,ok){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){flash(ok);}).catch(function(){fb();});
    } else fb();
    function fb(){var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';
      document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');flash(ok);}catch(e){flash('복사하지 못했습니다');}ta.remove();}
  }

  /* ─── 뒤로가기 ───
     화면 하나짜리 앱이라 탭을 옮겨도 브라우저가 보기엔 아무 데도 안 갔다.
     그래서 뒤로가기를 누르면 앱 안에서 한 칸 돌아가는 게 아니라 통째로
     밖으로 나가 버렸다. 화면을 옮길 때마다 발자국을 하나씩 남긴다. */
  function navSnap(){
    return {v:S.view, sel:S.sel, doc:S.docSel, setTab:S.setTab, docTab:S.docTab,
            acctMain:S.acctMain, acctTab:S.acctTab, repTab:S.repTab, payWho:S.payWho};
  }
  var histKey=null;
  function syncHistory(){
    try{
      var snap=navSnap(), key=JSON.stringify(snap);
      if(key===histKey) return;          /* 같은 자리면 발자국을 안 남긴다 */
      if(histKey===null){ histKey=key; history.replaceState({mb:snap},''); return; }
      histKey=key; history.pushState({mb:snap},'');
    }catch(e){}
  }
  function applyNav(snap){
    S.view=snap.v; S.sel=snap.sel; S.docSel=snap.doc;
    S.setTab=snap.setTab; S.docTab=snap.docTab;
    S.acctMain=snap.acctMain; S.acctTab=snap.acctTab;
    S.repTab=snap.repTab; S.payWho=snap.payWho;
    /* 돌아간 자리에서 반쯤 열려 있던 것들은 닫는다 */
    S.ledEdit=null; S.ledDraft=null; S.bankEdit=null; S.personEdit=null;
    S.advEdit=null; S.advDraft=null; S.advPay=null; S.newPanel=null;
    S.confirmDel=null; S.confirmDocDel=null; S.confirmPay=null;
    histKey=JSON.stringify(navSnap());
    try{localStorage.setItem('mb-erp-nav',JSON.stringify({v:S.view,s:S.sel,d:S.docSel}));}catch(e){}
    render(); goTop();
  }
  window.addEventListener('popstate',function(e){
    var snap=e&&e.state&&e.state.mb;
    if(!snap) return;                    /* 우리가 남긴 게 아니면 브라우저에 맡긴다 */
    applyNav(snap);
  });

  /* 알림 링크는 주소 끝에 #docs/d1763… 을 달고 온다. 그런데 그걸 읽는
     데가 없었다. 링크를 눌러도 ERP 만 열리고 그 문서로는 안 갔다. */
  function hashNav(){
    try{
      var h=String(location.hash||'').replace(/^#/,'');
      if(!h) return false;
      var a=h.split('/'), v=a[0], id=decodeURIComponent(a[1]||'');
      var known=false;
      NAV.forEach(function(n){ if(n.k===v) known=true; });
      if(!known) return false;
      S.view=v;
      if(v==='docs'&&id) S.docSel=id;
      if(v==='settle'&&id) S.sel=id;
      /* 한 번 읽고 주소에서 지운다. 남겨 두면 새로고침할 때마다
         어디를 보고 있든 이 문서로 끌려온다. */
      history.replaceState(history.state,'',location.pathname+location.search);
      return true;

  function sbStore(sb){
    var cache={}, subs=[];
    function fire(col){ subs.forEach(function(s){ if(s.col===col){ try{s.fn();}catch(e){} } }); }
    function snapOf(col,id){
      var v=cache[col]&&cache[col][id];
      return {id:id,exists:!!v,data:function(){return v?clone(v):undefined;},metadata:{fromCache:false,hasPendingWrites:false}};
    }
    var loading={};
    function loadCol(col){
      if(loading[col])return; loading[col]=true;
      sb.from('docs').select('id,data').eq('collection',col).then(function(r){
        loading[col]=false;
        if(r.error){ errbar('불러오기 실패 ('+col+'): '+r.error.message); return; }
        cache[col]={};
        (r.data||[]).forEach(function(row){ cache[col][row.id]=row.data; });
        fire(col);
      });
    }
    sb.channel('mb-docs')
      .on('postgres_changes',{event:'*',schema:'public',table:'docs'},function(p){
        var row=(p.new&&p.new.collection)?p.new:p.old;
        if(!row||!row.collection)return;
        var col=row.collection; cache[col]=cache[col]||{};
        if(p.eventType==='DELETE') delete cache[col][row.id];
        else cache[col][row.id]=p.new.data;
        fire(col);
      }).subscribe();

    function chk(r){ if(r&&r.error) throw r.error; return r; }
    function docRef(col,id){
      var ref={
        id:id, path:col+'/'+id,
        get:function(){ return Promise.resolve(snapOf(col,id)); },
        set:function(b){
          cache[col]=cache[col]||{}; cache[col][id]=clone(b); fire(col);
          return sb.from('docs').upsert({collection:col,id:id,data:b,updated_at:new Date().toISOString()}).then(chk);
        },
        update:function(b){
          var cur=(cache[col]&&cache[col][id])||{}, next=clone(cur);
          Object.keys(b).forEach(function(k){ next[k]=b[k]; });
          return ref.set(next);
        },
        delete:function(){
          if(cache[col]) delete cache[col][id]; fire(col);
          return sb.from('docs').delete().eq('collection',col).eq('id',id).then(chk);
        },
        onSnapshot:function(next){
          subs.push({col:col,fn:function(){ next(snapOf(col,id)); }});
          loadCol(col); return function(){};
        }
      };
      return ref;
    }
    return {
      doc:function(p){ var a=p.split('/'); return docRef(a[0],a[1]); },
      collection:function(col){
        return {
          doc:function(id){ return docRef(col, id||('d'+Date.now()+Math.floor(Math.random()*1000))); },
          onSnapshot:function(next){
            subs.push({col:col,fn:function(){
              var m=cache[col]||{};
              next({docs:Object.keys(m).map(function(k){return snapOf(col,k);}),metadata:{fromCache:false}});
            }});
            loadCol(col); return function(){};
          }
        };
      }
    };
  }
