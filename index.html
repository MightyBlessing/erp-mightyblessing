<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
</head>
<body>
<title>마이티블레싱 업무관리시스템</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  /* Layout: fixed left rail + content column; rail becomes a scrolling top bar on phones */
  /* 색과 글꼴은 크쇼·포도나무·라이브텍스트와 같은 언어를 쓴다.
     Pretendard, 먹색 잉크, 아주 밝은 종이, 둥근 모서리, 옅은 그림자.
     강조색은 로고의 보라다. */
  :root{
    --paper:#F7F7FA; --card:#FFFFFF; --ink:#12121A; --muted:#676573; --faint:#9A97A6;
    --line:#E9E8EF; --accent:#7A00FF; --accent-soft:#F3EAFF; --accent-ink:#5E00C4;
    --warn:#9A5B00; --warn-soft:#FFF3E0; --bad:#D1403A; --bad-soft:#FFECEA;
    --info:#2A5BD7; --info-soft:#EDF2FF; --seal:#C0392B;
    --zero:#A8A5B4; --rail:#12121A; --rail-ink:#A6A3B4; --rail-on:#FFFFFF;
    --rail-hover:#1E1D2A; --rail-active:#2A2838;
    --shadow:0 1px 2px rgba(18,18,26,.05), 0 10px 28px rgba(18,18,26,.055);
    --shadow-sm:0 1px 2px rgba(18,18,26,.05), 0 4px 12px rgba(18,18,26,.045);
    --r-card:14px; --r-ctl:10px;
    --font-body:'Pretendard Variable', Pretendard, -apple-system, system-ui, 'Apple SD Gothic Neo', sans-serif;
    --font-num:var(--font-body);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0D0D12; --card:#17171F; --ink:#ECEBF2; --muted:#9C99AB; --faint:#7D7A8B;
      --line:#262533; --accent:#A866FF; --accent-soft:#1F1630; --accent-ink:#C79BFF;
      --warn:#E0A355; --warn-soft:#2B2113; --bad:#F0837B; --bad-soft:#2E1818;
      --info:#89ADFF; --info-soft:#141A2B; --seal:#E0796E;
      --zero:#6E6B7C; --rail:#08080C; --rail-ink:#93909F; --rail-on:#FFFFFF;
      --rail-hover:#17161F; --rail-active:#242232;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
      --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0D0D12; --card:#17171F; --ink:#ECEBF2; --muted:#9C99AB; --faint:#7D7A8B;
    --line:#262533; --accent:#A866FF; --accent-soft:#1F1630; --accent-ink:#C79BFF;
    --warn:#E0A355; --warn-soft:#2B2113; --bad:#F0837B; --bad-soft:#2E1818;
    --info:#89ADFF; --info-soft:#141A2B; --seal:#E0796E;
    --zero:#6E6B7C; --rail:#08080C; --rail-ink:#93909F; --rail-on:#FFFFFF;
    --rail-hover:#17161F; --rail-active:#242232;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-body);
    font-size:14.5px; line-height:1.62; margin:0; padding:0;
    -webkit-font-smoothing:antialiased; letter-spacing:-.011em}
  body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--rail)}

  .shell{display:grid; grid-template-columns:224px minmax(0,1fr); min-height:100%}
  @media (max-width:900px){ .shell{grid-template-columns:minmax(0,1fr)} }

  /* ---- rail ---- */
  .rail{background:var(--rail); color:var(--rail-ink); position:sticky; top:0; align-self:start;
    height:100vh; display:flex; flex-direction:column; border-right:1px solid var(--line);
    padding-top:env(safe-area-inset-top,0px); padding-left:env(safe-area-inset-left,0px)}
  .rail .logo{padding:18px 18px 14px; color:#fff; font-weight:700; font-size:15px; letter-spacing:-.01em}
  .rail .logo small{display:block; font-weight:400; font-size:11px; color:var(--rail-ink);
    letter-spacing:.01em; margin-top:3px; white-space:nowrap}
  .rail nav{display:flex; flex-direction:column; gap:2px; padding:4px 10px; overflow-y:auto}
  .rail button{display:flex; align-items:center; gap:9px; border:0; background:transparent; color:var(--rail-ink);
    font-family:inherit; font-size:13.5px; font-weight:500; letter-spacing:-.01em;
    text-align:left; padding:9px 11px; border-radius:9px; cursor:pointer; width:100%;
    transition:background .12s ease, color .12s ease}
  .rail button:hover{background:var(--rail-hover); color:#fff}
  .rail button[aria-current=true]{background:var(--rail-active); color:var(--rail-on); font-weight:700}
  .rail .ic{width:17px; height:17px; flex:0 0 auto; opacity:.8; display:grid; place-items:center}
  .rail .ic svg{width:17px; height:17px; display:block}
  .rail button:hover .ic,.rail button[aria-current=true] .ic{opacity:1}
  .rail .badge{margin-left:auto; background:var(--bad); color:#fff; font-size:10.5px; font-weight:700;
    border-radius:999px; padding:1px 6px; font-family:var(--font-num)}
  .rail .foot{margin-top:auto; padding:14px 18px; border-top:1px solid var(--rail-hover); font-size:11.5px; color:#6B6878}
  @media (max-width:900px){
    .rail{height:auto; position:sticky; top:0; z-index:20}
    .rail .logo{padding:12px 16px 8px}
    .rail nav{flex-direction:row; overflow-x:auto; padding:0 10px 10px; gap:4px}
    .rail nav button{width:auto; white-space:nowrap}
    .rail .foot{display:none}
  }

  /* ---- content ---- */
  .main{min-width:0; display:flex; flex-direction:column}
  .bar{position:sticky; top:0; z-index:15; background:color-mix(in srgb, var(--paper) 82%, transparent);
    -webkit-backdrop-filter:saturate(1.6) blur(12px); backdrop-filter:saturate(1.6) blur(12px);
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:13px max(16px, env(safe-area-inset-right,0px)) 13px 22px}
  @media (max-width:900px){ .bar{top:0; position:static} }
  .bar h1{font-size:19px; font-weight:700; margin:0; letter-spacing:-.03em}
  .bar .who{margin-left:auto; display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted)}
  .bar .who img{width:24px; height:24px; border-radius:50%; display:block}
  /* ---- 로그인 ---- */
  .gbtn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
    padding:12px 14px; border:1px solid var(--line); border-radius:var(--r-ctl);
    background:var(--card); color:var(--ink); font-family:inherit; font-size:14.5px;
    font-weight:600; letter-spacing:-.01em; cursor:pointer; box-shadow:var(--shadow-sm);
    transition:border-color .12s ease, transform .08s ease}
  .gbtn:hover{border-color:var(--faint)}
  .gbtn:active{transform:translateY(1px)}
  .gbtn:disabled{opacity:.6; cursor:default}
  .gbtn svg{width:18px; height:18px; flex:0 0 auto}
  .orline{display:flex; align-items:center; gap:10px; margin:16px 0;
    color:var(--faint); font-size:11.5px}
  .orline::before,.orline::after{content:""; flex:1; height:1px; background:var(--line)}
  .linkbtn{border:0; background:transparent; color:var(--accent-ink); font-family:inherit;
    font-size:12.5px; font-weight:600; cursor:pointer; padding:0; text-decoration:underline}

  /* 알림에서 넘어온 사람 줄을 잠깐 짚어준다 */
  tr.focusrow > td{background:var(--accent-soft)}
  tr.focusrow > td:first-child{box-shadow:inset 3px 0 0 var(--accent)}

  /* ---- 증빙 ---- */
  .evgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(124px,1fr)); gap:10px}
  .ev{position:relative; border:1px solid var(--line); border-radius:var(--r-ctl); overflow:hidden;
    background:var(--paper); display:flex; flex-direction:column}
  .ev .shot{display:block; width:100%; height:92px; border:0; padding:0; cursor:pointer;
    background:var(--paper) center/cover no-repeat; color:var(--faint)}
  .ev .shot.file{display:grid; place-items:center; font-size:11px; font-weight:700; letter-spacing:.04em}
  .ev .shot.file svg{width:22px; height:22px; margin-bottom:3px}
  .ev .cap{padding:7px 8px; font-size:11px; line-height:1.4; color:var(--muted); border-top:1px solid var(--line)}
  .ev .cap b{display:block; color:var(--ink); font-weight:600; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap}
  .ev .x{position:absolute; top:5px; right:5px; width:22px; height:22px; border-radius:7px;
    border:0; background:rgba(18,18,26,.62); color:#fff; font-size:14px; line-height:22px;
    cursor:pointer; padding:0}
  .ev .x:hover{background:var(--bad)}
  .ev.sure{outline:2px solid var(--bad); outline-offset:-2px}
  /* 작은 ×가 작은 ✓로 바뀌는 건 아무도 못 알아본다. 카드를 덮고 묻는다. */
  .ev .ask{position:absolute; inset:0; z-index:2; padding:8px; text-align:center;
    background:color-mix(in srgb, var(--card) 92%, transparent);
    display:grid; place-items:center; align-content:center; gap:7px}
  .ev .ask b{display:block; font-size:12px; color:var(--bad); margin-bottom:1px}
  .ev .ask .btn{padding:5px 10px; font-size:11.5px}
  .drop{border:1.5px dashed var(--line); border-radius:var(--r-ctl); padding:18px 12px; text-align:center;
    color:var(--muted); font-size:12.5px; cursor:pointer; transition:border-color .12s, background .12s}
  .drop:hover,.drop.over{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink)}

  /* ---- 알림 ---- */
  .bar .bellwrap{margin-left:auto; display:flex}
  .bar .who{margin-left:0}
  .bell{border:1px solid var(--line); background:var(--card); color:var(--muted);
    width:34px; height:34px; border-radius:var(--r-ctl); display:grid; place-items:center;
    cursor:pointer; position:relative; padding:0; box-shadow:var(--shadow-sm)}
  .bell:hover{color:var(--ink); border-color:var(--faint)}
  .bell[aria-expanded=true]{color:var(--accent-ink); border-color:var(--accent); background:var(--accent-soft)}
  .bell svg{width:17px; height:17px; display:block}
  .bell .dot{position:absolute; top:-5px; right:-5px; min-width:17px; height:17px; padding:0 4px;
    background:var(--bad); color:#fff; border-radius:999px; font-size:10.5px; font-weight:700;
    line-height:17px; font-family:var(--font-num); border:2px solid var(--paper)}
  .bellpanel{position:fixed; top:58px; right:max(16px, env(safe-area-inset-right,0px));
    width:min(330px, calc(100vw - 32px));
    max-height:min(62vh, 460px); overflow:auto; z-index:60;
    background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); box-shadow:var(--shadow)}
  /* 좁은 화면에서는 종 아래에 매달지 않는다. 상단 바가 같이 흘러가 버려서
     패널이 화면 밖으로 나간다. 가운데 띄워서 항상 보이게 한다. */
  @media (max-width:700px){
    .bellpanel{left:14px; right:14px; top:50%; width:auto;
      transform:translateY(-50%); max-height:72vh}
  }
  .bellpanel h3{margin:0; padding:13px 15px 10px; font-size:12.5px; font-weight:700;
    border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px}
  .bellpanel h3 button{margin-left:auto; border:0; background:transparent; color:var(--accent-ink);
    font-family:inherit; font-size:11.5px; font-weight:600; cursor:pointer; padding:0}
  .nrow{display:flex; gap:9px; padding:11px 15px; border-bottom:1px solid var(--line);
    width:100%; border-left:0; border-right:0; border-top:0; background:transparent;
    font-family:inherit; text-align:left; color:var(--ink); cursor:pointer; align-items:flex-start}
  .nrow:last-child{border-bottom:0}
  .nrow:hover{background:var(--paper)}
  .nrow .mark{width:7px; height:7px; border-radius:50%; flex:0 0 auto; margin-top:7px; background:transparent}
  .nrow.unread .mark{background:var(--accent)}
  .nrow .tx{flex:1; min-width:0; font-size:12.8px; line-height:1.5}
  .nrow .tm{display:block; color:var(--faint); font-size:11px; margin-top:2px; font-family:var(--font-num)}
  .bellpanel .empty{padding:26px 15px}

  .page{padding:20px; padding-left:max(20px, env(safe-area-inset-left,0px));
    padding-right:max(20px, env(safe-area-inset-right,0px)); padding-bottom:64px}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-card);
    padding:18px; box-shadow:var(--shadow-sm)}
  /* 한글에 대문자 변환은 아무 일도 하지 않는다. 자간만 벌어져 읽기 나빠진다. */
  .card h2{font-size:13px; font-weight:700; letter-spacing:-.015em; color:var(--ink); margin:0 0 13px}
  .stack{display:flex; flex-direction:column; gap:16px}
  .cols{display:grid; grid-template-columns:minmax(0,330px) minmax(0,1fr); gap:16px; align-items:start}
  @media (max-width:980px){ .cols{grid-template-columns:minmax(0,1fr)} }
  /* 타일이 다섯 장으로 늘면서 금액이 두 줄로 꺾였다. 좁으면 줄을 바꿔 내려가게 둔다. */
  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px}
  .tile{background:var(--card); border:1px solid var(--line); border-radius:var(--r-card);
    padding:16px 18px; box-shadow:var(--shadow-sm)}
  .tile .k{font-size:12px; color:var(--muted); font-weight:500}
  .tile .v{font-family:var(--font-num); font-variant-numeric:tabular-nums; font-size:26px;
    font-weight:700; letter-spacing:-.035em; margin-top:4px}
  .tile .s{font-size:11.5px; color:var(--faint); margin-top:2px}
  .tile.hot .v{color:var(--bad)}

  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:11px}
  .field label{font-size:12px; color:var(--muted); font-weight:500}
  input,select,textarea{font-family:inherit; font-size:14px; color:var(--ink); background:var(--paper);
    border:1px solid var(--line); border-radius:var(--r-ctl); padding:9px 11px; width:100%;
    transition:border-color .12s ease, box-shadow .12s ease}
  input:hover:not(:disabled),select:hover:not(:disabled),textarea:hover:not(:disabled){border-color:var(--faint)}
  input:focus,select:focus,textarea:focus{outline:0; border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent)}
  textarea{resize:vertical}
  input[type=number]{font-family:var(--font-num); font-variant-numeric:tabular-nums}
  input:disabled,select:disabled,textarea:disabled{opacity:.6; cursor:not-allowed}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
  @media(max-width:620px){ .row3{grid-template-columns:1fr} }
  .hint{font-size:11.5px; color:var(--muted); margin:-5px 0 11px}

  .seg{display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden}
  .seg button{flex:1; border:0; background:var(--paper); color:var(--muted); font-family:inherit;
    font-size:12.5px; padding:7px 4px; cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--accent-soft); color:var(--accent-ink); font-weight:700}

  .tabs{display:flex; gap:3px; flex-wrap:wrap; margin-bottom:14px}
  .tabs button{border:1px solid transparent; background:transparent; color:var(--muted); font-family:inherit;
    font-size:13.5px; font-weight:500; padding:7px 13px; border-radius:999px; cursor:pointer;
    transition:background .12s ease, color .12s ease}
  .tabs button:hover{background:var(--card); color:var(--ink)}
  .tabs button[aria-pressed=true]{background:var(--accent-soft); border-color:transparent;
    color:var(--accent-ink); font-weight:700}
  .tabs .n{font-family:var(--font-num); font-size:11.5px; opacity:.75; margin-left:4px}

  .btn{border:1px solid var(--line); background:var(--card); color:var(--ink); font-family:inherit;
    font-size:13.5px; font-weight:600; letter-spacing:-.015em; padding:9px 16px;
    border-radius:var(--r-ctl); cursor:pointer; box-shadow:var(--shadow-sm);
    transition:border-color .12s ease, transform .12s ease, box-shadow .12s ease, background .12s ease}
  .btn:hover:not(:disabled){border-color:var(--faint); transform:translateY(-1px); box-shadow:var(--shadow)}
  .btn:active:not(:disabled){transform:translateY(0)}
  .btn:disabled{opacity:.45; cursor:not-allowed; box-shadow:none}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;
    box-shadow:0 1px 2px rgba(18,18,26,.1), 0 8px 20px color-mix(in srgb, var(--accent) 26%, transparent)}
  .btn.primary:hover:not(:disabled){border-color:var(--accent); filter:brightness(1.07)}
  .btn.danger{color:var(--bad); border-color:color-mix(in srgb, var(--bad) 40%, var(--line))}
  .btn.danger:hover:not(:disabled){border-color:var(--bad); background:var(--bad-soft)}
  .btn.sm{padding:6px 12px; font-size:12.5px}
  .actions{display:flex; flex-wrap:wrap; gap:8px}

  .pill{display:inline-flex; align-items:center; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap}
  .p-draft{background:var(--paper); color:var(--muted); border:1px solid var(--line)}
  .p-submitted,.p-pending{background:var(--warn-soft); color:var(--warn)}
  .p-progress{background:var(--info-soft); color:var(--info)}
  .p-approved{background:var(--accent-soft); color:var(--accent-ink)}
  .p-paid{background:var(--accent); color:#fff}
  .p-rejected{background:var(--bad-soft); color:var(--bad)}
  .p-canceled{background:var(--paper); color:var(--zero); border:1px solid var(--line)}

  table{width:100%; border-collapse:collapse; font-size:13px}
  th{font-size:12px; letter-spacing:-.01em; color:var(--muted); font-weight:600; text-align:left;
    padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
  td{padding:10px; border-bottom:1px solid var(--line); vertical-align:top}
  td.num,th.num{text-align:right; font-family:var(--font-num); font-variant-numeric:tabular-nums; white-space:nowrap}
  tr.off td{color:var(--zero)}
  .pay{font-weight:700}
  .capped{color:var(--warn)}
  .scroll{overflow-x:auto}
  tfoot td{border-top:2px solid var(--ink); border-bottom:0; padding-top:9px; font-weight:700}
  .rowlink{cursor:pointer}
  .rowlink:hover td{background:var(--accent-soft)}
  .rowlink:hover td:first-child{border-top-left-radius:8px; border-bottom-left-radius:8px}
  .rowlink:hover td:last-child{border-top-right-radius:8px; border-bottom-right-radius:8px}
  .desc{min-width:180px; font-size:12.5px; color:var(--muted); line-height:1.45}
  .ptsel{width:60px; padding:4px 6px; font-size:12px}
  .togs{display:flex; flex-wrap:wrap; gap:4px; min-width:190px}
  .tog{padding:3px 8px; font-size:11.5px; line-height:1.5; border:1px solid var(--line);
       border-radius:999px; background:var(--card); color:var(--muted); cursor:pointer}
  .tog:hover:not(:disabled){border-color:var(--accent); color:var(--ink)}
  .tog.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
  .tog:disabled{cursor:default; opacity:.65}
  .tog.addtog{border-style:dashed; font-weight:700; padding:3px 9px}
  .ptsum{font-family:var(--font-num); font-size:15px; font-weight:700}
  .dsel{width:54px; padding:4px 6px; font-size:12px; text-align:center}
  .fixin{width:92px; padding:4px 6px; font-size:12.5px; text-align:right; font-family:var(--font-num)}
  .fixin::placeholder{color:var(--zero); font-weight:400}
  .oldtxt{margin-top:5px; font-size:11.5px; color:var(--zero); white-space:pre-wrap}
  .ceotag{margin-top:2px; font-size:10.5px; color:var(--accent-ink); white-space:nowrap}
  .chk{width:16px; height:16px; accent-color:var(--accent)}
  .del{border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:15px; padding:0 4px}

  .chain,.base{border-radius:12px; padding:13px 15px; font-family:var(--font-num);
    font-variant-numeric:tabular-nums; font-size:13px}
  .chain{background:var(--paper); border:1px solid var(--line)}
  .base{background:var(--accent-soft); margin-top:14px}

      },
      del:function(m){ return S.sb.storage.from(EV_BUCKET).remove([m.p]); }

        ? '<div class="drop'+(grid?'" style="margin-top:10px':'')+'" id="evDrop">'+
            (S.upBusy?'올리는 중…':'눌러서 파일 고르기 · 또는 여기로 끌어다 놓기')+
            '<br><span style="font-size:11px;color:var(--faint)">사진·PDF · 한 개 '+EV_SIZE+'MB까지 · 사진은 자동으로 줄여서 올립니다</span></div>'+
          '<input type="file" id="evFile" accept="image/*,application/pdf" multiple hidden>'
        : (grid?'':'<div class="empty" style="padding:20px 8px">첨부된 파일이 없습니다.</div>'))+
    '</section>';
  }

  /* ============ 알림 ============ */
  /* 알림은 docs 저장소의 notifs 컬렉션에 한 줄씩 쌓인다.
     to 는 받을 사람 uid 배열, 또는 전원을 뜻하는 '*'.
     읽은 시각은 사람마다 profiles/<uid>.notifReadAt 한 칸에만 적는다.
     알림마다 사람 수만큼 읽음 표시를 만들면 금방 불어난다. */
  function allUids(){
    var m={};
    if(S.user&&S.user.ids) S.user.ids().forEach(function(u){m[u]=1;});
    Object.keys(S.roles).forEach(function(u){m[u]=1;});
    Object.keys(S.profileRows).forEach(function(u){m[u]=1;});
    return Object.keys(m);
  }
  function notify(to,text,docId,go){
    if(!S.db||!S.me.id)return;
    var list;
    if(to==='*'){ list='*'; }
    else {
      list=(Array.isArray(to)?to:[to]).filter(function(u){return u&&u!==S.me.id;});
      /* 중복 제거 — 같은 사람이 결재선에 두 번 들어갈 수 있다 */
      list=list.filter(function(u,i){return list.indexOf(u)===i;});
      if(!list.length)return;
    }
    var id='n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    var row={to:list,text:text,doc:docId||'',by:S.me.id,at:nowISO()};
    if(go) row.go=go;
    S.db.doc('notifs/'+id).set(row).catch(function(){});
    pruneNotifs();
  }
  /* 90일이 지난 알림은 지운다. 아무도 안 치우면 영원히 쌓인다. */
  function pruneNotifs(){
    if(!S.db)return;
    var cut=new Date(Date.now()-90*86400000).toISOString();
    Object.keys(S.notifs).forEach(function(k){
      if((S.notifs[k].at||'')<cut) S.db.doc('notifs/'+k).delete().catch(function(){});
    });
  }
  function notifsFor(){
    var me=S.me.id; if(!me)return [];
    return Object.keys(S.notifs).map(function(k){ var o=clone(S.notifs[k]); o.id=k; return o; })
      .filter(function(n){
        if(n.by===me) return false;                       /* 내가 만든 알림은 나한테 안 온다 */
        return n.to==='*' || (Array.isArray(n.to)&&n.to.indexOf(me)>=0);
      })
      .sort(function(a,b){ return (a.at||'')<(b.at||'')?1:-1; })
      .slice(0,60);
  }
  function unreadCount(){
    var r=S.notifReadAt||'';
    return notifsFor().filter(function(n){return (n.at||'')>r;}).length;
  }
  function saveProfile(patch){
    if(!S.db||!S.me.id)return Promise.resolve();
    /* 아직 내 행을 못 받았으면 쓰지 않는다. set 은 통째로 덮어쓰므로
       지금 쓰면 남아 있던 프로필 사진이 사라진다. */
    if(!S.profilesLoaded)return Promise.resolve();
    var body=clone(S.myProfile||{});
    Object.keys(patch).forEach(function(k){ body[k]=patch[k]; });
    body.updatedAt=nowISO();
    S.myProfile=body;
    return S.db.doc('profiles/'+S.me.id).set(body);
  }
  function markNotifsRead(){
    S.notifReadAt=nowISO();
    saveProfile({notifReadAt:S.notifReadAt}).catch(function(){});
  }
  function syncMyProfile(){
    if(!S.me.id||!S.profilesLoaded)return;
    var row=S.profileRows[S.me.id];
    S.myProfile=row||S.myProfile;
    S.notifReadAt=(row&&row.notifReadAt)||S.notifReadAt||'';
    announceJoin(S.profileRows);
  }
  var joinAnnounced=false;
  /* 처음 들어온 사람은 자기 손으로 "합류했습니다"를 띄운다.
     members 행이 만들어진 지 14일이 넘었으면 기존 사람이므로 조용히 넘어간다.
     (이 기능을 붙이기 전부터 쓰던 사람들이 한꺼번에 '신규'로 뜨는 걸 막는다) */
  function announceJoin(rows){
    if(joinAnnounced||!S.me.id||!S.db)return;
    joinAnnounced=true;
    if(rows[S.me.id])return;
    var fresh=!S.me.joinedAt || (Date.now()-Date.parse(S.me.joinedAt))<14*86400000;
    saveProfile({avatar:'',joinedAt:nowISO(),notifReadAt:nowISO()}).then(function(){
      if(fresh) notify('*', (S.me.name||'새 사용자')+' 님이 합류했습니다. 역할을 지정해 주세요.',
                       '', {v:'roles', uid:S.me.id});
    }).catch(function(){});
  }
  function docLabel(d){ return (d.subject||d.title||'문서'); }
  /* 결재가 움직일 때마다 관련된 사람에게만 보낸다. */
  function notifyDoc(d,kind){
    var me=S.me.name||'누군가', ttl='「'+docLabel(d)+'」';
    /* 앱 안 알림과 같은 자리에서 슬랙에도 한 줄 보낸다.
       사람들이 하루 종일 보는 건 슬랙이다. 여기만 띄워 두면 안 본다. */
    try{
      var kindName=DOC_KIND[d.type]||'문서';
      var who=nameOf(d.drafter);
      var rows=[['제목', d.title||docLabel(d)]];
      if(d.type==='expense'){
        rows.push(['금액', won(expTotal(d))+(d.payee?(' · 받는 사람 '+d.payee):'')]);
      } else if(isApply(d)){
        var A=applySchema(d.type)||{};
        if(A.days) rows.push(['기간', (d.from||'')+' ~ '+(d.to||'')+' · '+leaveDays(d)+'일'+(d.kind?(' · '+d.kind):'')]);
        else if(A.sum&&num(d[A.sum],0)>0) rows.push(['예상 금액', won(num(d[A.sum],0))]);
      } else if(d.type==='official'){
        rows.push(['수신', d.to||'—']);
      }
      rows.push(['결재선', lineText(d)||'—']);

      var waiting=(d.steps||[]).filter(function(x){return x.state!=='approved'&&x.state!=='rejected';});
      var turn=waiting[0]&&waiting[0].uid;

      if(kind==='submit')
        slackSay('ask', {what:kindName, sub:ymdKo(d.date||today())+' · 기안 '+who,
          rows:rows, link:appLink('docs',d.id), cta:'결재하러 가기',
          to:mailOf(turn)});
      else if(kind==='approve'){
        if(!waiting.length)
          slackSay('ok', {what:kindName, sub:'기안 '+who+' · 마지막 승인 '+me,
            rows:rows, link:appLink('docs',d.id),
            foot:(d.type==='expense'?'지급 처리를 기다립니다.':''),
            to:mailOf(d.drafter)});
        else
          /* 다음 사람 차례다. 이 한 줄이 없으면 앞사람이 승인한 걸
             뒷사람이 모른다 — ERP 를 켜 봐야 안다. */
          slackSay('ask', {what:kindName, sub:me+' 님이 승인했습니다 · 기안 '+who,
            rows:rows, link:appLink('docs',d.id), cta:'결재하러 가기',
            to:mailOf(turn)});
      }
      else if(kind==='reject')
        slackSay('no', {what:kindName, sub:me+' 님이 반려했습니다 · 기안 '+who,
          rows:rows, link:appLink('docs',d.id), cta:'다시 작성하기',
          to:mailOf(d.drafter)});
    }catch(e){}
    var pend=(d.steps||[]).filter(function(x){return x.state!=='approved'&&x.state!=='rejected';})
                          .map(function(x){return x.uid;});
    var next=pend[0];
    if(kind==='submit'){
      if(next) notify(next, '결재 차례입니다 — '+ttl, d.id);
      var others=allUids().filter(function(u){return pend.indexOf(u)<0;});
      notify(others, me+' 님이 '+ttl+'을(를) 기안했습니다', d.id);
    }
    else if(kind==='approve'){
      if(next){
        notify(next, '결재 차례입니다 — '+ttl, d.id);
        notify(d.drafter, me+' 님이 '+ttl+'을(를) 승인했습니다', d.id);
      }else{
        notify(d.drafter, ttl+'이(가) 최종 승인되었습니다', d.id);
        if(d.type==='expense') notify(accountingUids(), ttl+' 지급 처리를 기다립니다', d.id);
      }
    }
    else if(kind==='reject') notify(d.drafter, me+' 님이 '+ttl+'을(를) 반려했습니다', d.id);
    else if(kind==='cancel') notify(pend, me+' 님이 '+ttl+' 결재를 취소했습니다', d.id);
  }

  /* ============ 정산 계산 ============ */
  function compute(ev){
    var net=ev.mode==='calc'?(num(ev.rev)-num(ev.opex)-num(ev.tax)):num(ev.net);
    var rate=num(ev.rate,150000),ratio=num(ev.ratio,50)/100,cap=num(ev.cap,300000),unit=num(ev.unit,10000)||1;
    var ms=ev.members||[];
    var dayList=ms.map(memberDays);
    var workedCount=dayList.reduce(function(a,b){return a+b;},0);   /* 사람 수가 아니라 일수의 합 */
    var dayTotal=rate*workedCount, fundBase=Math.round(net*ratio);
    /* 기본: 사례비 예산 안에 당일 일급이 포함된다. 'opex'로 둔 행사만 운영비에서 따로 나간다. */
    var pool=ev.wageSrc==='opex'?fundBase:fundBase-dayTotal; if(pool<0)pool=0;
    /* ─── 배분 ───
       「상한에서 비율대로」. 가장 높은 포인트가 상한(30만)을 받고
       나머지는 그 비율만큼 받는다. 11·7·3 이면 30만 / 19만 / 8만.

       예산보다 많으면 전부를 같은 비율로 줄인다. 누구 하나를 깎는 게
       아니라 다 같이 줄어야 기여 비율이 그대로 남는다.

       예산을 다 안 쓰는 게 보통이다. 남는 돈은 운영통장으로 이월된다.
       「예산을 남김없이 나눈다」가 아니라 「기여만큼 준다」가 규칙이다. */
    var alloc=ms.map(function(){return 0;}),capped=ms.map(function(){return false;});
    var fixed=ms.map(memberFix);

    /* 대표가 직접 적은 금액이 먼저다. 그 돈을 떼고 남은 것으로 나머지를
       나눈다. 계산이 사람의 판단을 덮으면 안 된다. */
    var fixSum=0;
    fixed.forEach(function(v,i){ if(v!==null){ alloc[i]=v; fixSum+=v; } });
    var poolLeft=pool-fixSum; if(poolLeft<0) poolLeft=0;

    /* 대표를 빼고 1등 점수를 구한 다음, 대표에게 그 점수를 준다.
       대표끼리만 있는 행사면 자기 점수를 그대로 쓴다. */
    var ceoSet=ceoNameSet();
    var isCeo=ms.map(function(m){ return isCeoMember(m,ceoSet); });
    var topOther=0;
    ms.forEach(function(m,i){ if(fixed[i]!==null||isCeo[i]) return;
      var v=memberPt(m); if(v>topOther) topOther=v; });
    var ptOf=function(m,i){
      if(isCeo[i]&&topOther>0) return topOther;
      return memberPt(m);
    };

    var maxPt=0;
    ms.forEach(function(m,i){ if(fixed[i]!==null) return;
      var v=ptOf(m,i); if(v>maxPt) maxPt=v; });
    var want=0;
    if(maxPt>0){
      var raw=ms.map(function(m,i){
        if(fixed[i]!==null) return 0;
        var v=ptOf(m,i);
        return v>0 ? cap*(v/maxPt) : 0;
      });
      want=raw.reduce(function(a,b){return a+b;},0);
      var shrink=(want>poolLeft&&want>0)?(poolLeft/want):1;
      ms.forEach(function(m,i){
        if(fixed[i]!==null) return;
        if(!(ptOf(m,i)>0)){ alloc[i]=0; return; }
        var v=Math.floor((raw[i]*shrink)/unit)*unit;
        if(v>cap) v=cap;
        alloc[i]=v;
        /* 상한에 닿은 사람은 표시한다. 예산이 모자라 줄어든 건 상한이 아니다. */
        if(shrink>=1 && v>=cap) capped[i]=true;
      });
    }
    var shrunk=(maxPt>0&&want>poolLeft);
    var prepTotal=alloc.reduce(function(a,b){return a+b;},0);
    return {net:net,rate:rate,ratio:ratio,cap:cap,workedCount:workedCount,dayTotal:dayTotal,fundBase:fundBase,
      pool:pool,poolLeft:poolLeft,fixSum:fixSum,fixed:fixed,days:dayList,
      isCeo:isCeo,topOther:topOther,ptEff:ms.map(function(m,i){return ptOf(m,i);}),
      alloc:alloc,capped:capped,anyCap:capped.some(Boolean),shrunk:shrunk,want:want,
      maxPt:maxPt,ptSum:ms.reduce(function(a,m,i){return a+ptOf(m,i);},0),prepTotal:prepTotal,
      leftover:pool-prepTotal,payTotal:dayTotal+prepTotal};
  }
  function accountingUids(){return Object.keys(S.roles).filter(function(u){return S.roles[u]==='accounting';});}
  function ceoUids(){return Object.keys(S.roles).filter(function(u){return S.roles[u]==='ceo';});}
  function apprOf(id){
    var out=[];Object.keys(S.approvals).forEach(function(k){var a=S.approvals[k];if(a&&a.eventId===id)out.push(a);});
    out.sort(function(a,b){return (a.at||'')<(b.at||'')?-1:1;});return out;
  }
  function progress(ev){
    var list=apprOf(ev.id),acc=accountingUids(),ceo=ceoUids();
    var okAcc=acc.filter(function(u){return list.some(function(a){return a.kind==='accounting'&&a.uid===u;});});
    var okCeo=list.filter(function(a){return a.kind==='ceo';});
    var confirms=list.filter(function(a){return a.kind==='confirm';});
    var accDone=acc.length>0&&okAcc.length===acc.length, ceoDone=okCeo.length>0;
    var derived=ev.status==='paid'?'paid':(ev.status==='submitted'&&accDone&&ceoDone)?'approved':(ev.status||'draft');
    return {list:list,acc:acc,ceo:ceo,okAcc:okAcc,confirms:confirms,accDone:accDone,ceoDone:ceoDone,status:derived};
  }

  /* ============ 전자결재 ============ */
  /* 지금 이 문서가 누구 손에 있는가.
     결재가 돌고 있으면 그 사람, 아니면 기안한 사람이다. */
  function docTurn(d){
    var st=docStatus(d);
    if(st!=='submitted'&&st!=='progress') return null;
    var i=currentStep(d);
    return i>=0?d.steps[i].uid:null;
  }
  /* 정산은 회계가 '전원' 승인해야 넘어간다. 아직 안 한 사람들이 차례다. */
  function evTurn(ev){
    var p=progress(ev);
    if(p.status!=='submitted') return null;
    if(!p.accDone){
      var w=p.acc.filter(function(u){return p.okAcc.indexOf(u)<0;});
      if(w.length) return w;
    }
    if(!p.ceoDone&&p.ceo.length) return p.ceo.slice(0,1);
    return null;
  }
  function whoCell(uids,tag){
    if(!uids||!uids.length) return '<span style="color:var(--zero)">—</span>';
    var more=uids.length>1?' 외 '+(uids.length-1)+'명':'';
    return '<span style="display:inline-flex;align-items:center;gap:6px;white-space:nowrap">'+
      '<img src="'+esc(avatarOf(uids[0]))+'" alt="" style="width:20px;height:20px;border-radius:50%;flex:0 0 auto">'+
      '<span>'+esc(nameOf(uids[0]))+more+
      (tag?' <span class="pill p-'+(tag==='차례'?'pending':'approved')+'">'+tag+'</span>':'')+
      '</span></span>';
  }
  /* 문서·정산 한 줄에 들어갈 '담당자' 칸 */
  function ownerCell(kind,o){
    if(kind==='doc'){
      var u=docTurn(o);
      if(u) return whoCell([u],'차례');
      return o.drafter?whoCell([o.drafter],'기안'):'<span style="color:var(--zero)">—</span>';
    }
    var w=evTurn(o);
    if(w&&w.length) return whoCell(w,'차례');
    var log=apprOf(o.id), last=log[log.length-1];
    return last?whoCell([last.uid],'최근'):'<span style="color:var(--zero)">—</span>';
  }

  function docStatus(d){
    if(d.status==='draft'||d.status==='canceled'||d.status==='rejected')return d.status;
    var st=d.steps||[];
    if(st.some(function(s){return s.state==='rejected';}))return 'rejected';
    if(st.length&&st.every(function(s){return s.state==='approved';}))return 'approved';
    if(st.some(function(s){return s.state==='approved';}))return 'progress';
    return 'submitted';
  }
  function currentStep(d){
    var st=d.steps||[];
    for(var i=0;i<st.length;i++){ if(st[i].state==='pending') return i; }
    return -1;
  }
  function isMyTurn(d){
    var i=currentStep(d);
    return i>=0 && (d.steps[i].uid===S.me.id) && ['submitted','progress'].indexOf(docStatus(d))>=0;
  }
  /* 슬랙에서 들어온 초안은 아직 임자가 없다. 「내 문서」에서도 보여야
     누군가 집어 간다. 아무 탭에도 안 뜨면 영영 묻힌다. */
  function slackDraft(d){
    return !!(d&&d.fromSlack&&!d.drafter&&docStatus(d)==='draft');
  }
  function docList(tab){
    var all=Object.keys(S.docs).map(function(k){return S.docs[k];});
    all.sort(function(a,b){return (b.updatedAt||'')<(a.updatedAt||'')?-1:1;});
    if(tab==='mine')return all.filter(function(d){return d.drafter===S.me.id||slackDraft(d);});
    if(tab==='todo')return all.filter(isMyTurn);
    if(tab==='progress')return all.filter(function(d){return ['submitted','progress'].indexOf(docStatus(d))>=0;});
    if(tab==='approved')return all.filter(function(d){return docStatus(d)==='approved';});
    if(tab==='rejected')return all.filter(function(d){return docStatus(d)==='rejected';});
    return all;
  }
  /* 문서번호.
     2026년까지는 제2024/2026 접두어로 14호까지 나갔다. 2027년부터는
     두 해를 한 회기로 묶어 제2027/2028, 제2029/2030 … 으로 간다.
     번호는 이미 있는 문서 중 가장 큰 것 다음으로 매긴다. */
  function docNoPrefix(y){
    if(y<=2026) return '마블 제2024/2026';
    var base=2027+Math.floor((y-2027)/2)*2;
    return '마블 제'+base+'/'+(base+1);
  }
  function pad3(n){ n=String(n); while(n.length<3) n='0'+n; return n; }
  function nextNo(kind){
    var y=new Date().getFullYear();
    var pre=(kind==='expense')?('마블 지출 '+docNoPrefix(y).replace('마블 제','')):docNoPrefix(y);
    var re=new RegExp('^'+pre.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'-(\\d+)호$');
    var mx=0;
    Object.keys(S.docs).forEach(function(k){
      var d=S.docs[k]; if(!d)return;
      if((d.type==='expense')!==(kind==='expense'))return;
      var m=re.exec(String(d.no||''));
      if(m){ var n=parseInt(m[1],10); if(n>mx) mx=n; }
    });
    /* 종이로 나간 공문이 이미 14호까지 있다. 앱에 적힌 번호가 그보다
       작더라도 15호부터 이어가야 한다. */
    if(kind!=='expense' && y<=2026 && mx<14) mx=14;
    return pre+'-'+pad3(mx+1)+'호';
  }

  function expTotal(d){
    return (d.items||[]).reduce(function(a,it){return a+num(it.qty,0)*num(it.price,0);},0);
  }
  /* 승인 → 지급 예정 → 지급 완료.
     「언제 주기로 했나」와 「언제 실제로 나갔나」는 다른 날짜다. 둘을 하나로
     합쳐 두면 예정일이 밀렸는지 알 수가 없고, 받을 사람도 물어볼 데가 없다.
     예정을 안 잡고 바로 지급해도 된다 — 급한 건까지 두 번 누르게 할 일은 아니다. */
  function payState(d){
    var p=d.pay||{};
    if(p.state==='paid') return 'paid';
    if(p.schedOn) return 'sched';
    return 'pending';
  }
  function schedOn(d){ return String((d.pay||{}).schedOn||'').slice(0,10); }
  /* 예정일이 지났는데 아직 안 나갔으면 늦은 것이다. */
  function payLate(d){
    var so=schedOn(d);
    return !!(so && payState(d)==='sched' && so < today());
  }
  /* 돈이 실제로 움직인 날. 원천세·지급명세서는 이 날짜로 끊는다.
     at(처리한 시각)은 '언제 버튼을 눌렀나'일 뿐이라 월말·월초에 어긋난다.
     예전 건에는 on 이 없으니 그때는 at 을 쓴다. */
  function paidOn(d){
    var p=d.pay||{};
    return p.on?String(p.on).slice(0,10):ymd(p.at);
  }
  function evPaidOn(ev){
    if(ev&&ev.paidOn) return String(ev.paidOn).slice(0,10);
    var log=apprOf(ev.id).filter(function(a){return a.kind==='paid';});
    var last=log[log.length-1];
    return last?ymd(last.at):(ev.date||'');
  }
  /* 지출결의서는 공문과 같은 결재 엔진을 쓴다. 승인 이후 단계만 따로 붙는다. */
  function newExpenseBody(){
    var y=new Date().getFullYear();
    return {type:'expense', title:'지출결의서', no:nextNo('expense'), date:today(),
      eventId:'', account:'기타', method:'bank',
      payee:'', payeeBank:'', payeeAcct:'', dueDate:'', note:'',
      items:[{name:'',qty:1,price:0,note:''}],
      pay:{state:'pending',at:'',by:'',memo:''},
      steps:expenseSteps(), status:'draft', drafter:S.me.id||'', createdAt:nowISO(), updatedAt:nowISO()};
  }
  /* 돈이 나가는 문서는 회계가 한 번 보는 게 기본이다. 매번 손으로 넣게 하면
     바쁜 날에 빠지고, 빠진 줄도 모른 채 결재가 끝난다.
     회계 역할이 없거나 내가 회계면 나 혼자다. 필요 없으면 지울 수 있다. */
  function expenseSteps(){
    var L=firstStep();
    var acc=accountingUids()[0];
    if(acc&&acc!==S.me.id) L.push({uid:acc,role:'coop',state:'pending',comment:'',at:''});
    return L;
  }
  function newDocBody(form,scope){
    var f=FORMS[form]||FORMS.rent;
    /* 회의 결과 보고처럼 성격이 정해진 서식은 기본값을 따로 둔다. */
    if(f.scope&&!scope) scope=f.scope;
    scope=scope==='in'?'in':'out';
    return {type:'official', form:form||'rent', scope:scope,
      title:f.t||'(제목을 입력하세요)', no:nextNo('official'), date:today(),
      to:'', cc:'', subject:f.t||'',
      paras:f.p.slice(),
      ov:f.k.map(function(k){return {k:k,v:''};}),
      att:[],
      signer:'마이티블레싱대표', seal:scope!=='in',
      /* 연락처는 비워 둔다 — 저장소가 공개라 코드에 번호를 박지 않는다.
         한 번 입력하면 그 문서에 저장되고, 복사해서 새 문서를 만들면 따라온다. */
      addr:'', tel1:'', tel2:'', email:'contact@mightyblessing.com',
      line:[], steps:firstStep(), status:'draft', drafter:S.me.id||'', createdAt:nowISO(), updatedAt:nowISO()};
  }

  /* 올리는 사람이 1차 결재자다. 자기가 쓴 걸 자기가 확인하고 넘기는 게
     실제 순서이고, 매번 첫 줄에 자기 이름을 찾아 넣는 건 군더더기다.
     필요 없으면 지울 수 있게만 해 둔다. */
  function firstStep(){
    return S.me.id ? [{uid:S.me.id, state:'pending', comment:'', at:''}] : [];
  }

  function newApplyBody(kind){
    var body={type:kind, title:DOC_KIND[kind]||'신청서',
      no:nextNo(kind), date:today(),
      line:[], steps:firstStep(), status:'draft',
      drafter:S.me.id||'', createdAt:nowISO(), updatedAt:nowISO()};
    (applySchema(kind).f||[]).forEach(function(f){ body[f.k]=''; });
    if(kind==='leave'){ body.from=today(); body.to=today(); body.kind='연차'; }
    if(kind==='trip'){ body.from=today(); body.to=today(); }
    return body;
  }

  /* ============ 저장 ============ */
  var saveTimer=null,saving=false,dirty=null,dirtyKind=null;
  function touch(kind,id){
    dirty=id; dirtyKind=kind;
    if(saveTimer)clearTimeout(saveTimer);
    saveTimer=setTimeout(flush,700);
  }
  function flush(){
    if(saving||!dirty||!S.db)return;
    var kind=dirtyKind,id=dirty; dirty=null; dirtyKind=null;
    var src=kind==='doc'?S.docs[id]:S.events[id];
    if(!src)return;
    saving=true;
    var body=clone(src); delete body.id; body.updatedAt=nowISO();
    S.db.doc((kind==='doc'?'docs/':'events/')+id).set(body)
      .catch(function(e){errbar('저장 실패 '+(e&&e.code||''));})
      .then(function(){saving=false; if(dirty)flush();});
  }

  /* ============ 렌더 ============ */
  /* 화면 맨 위로. 탭을 옮겼는데 아까 보던 중간 높이에 그대로 서 있으면
     바뀐 게 없어 보여서 결국 새로고침을 누르게 된다. */
  function goTop(){
    try{ window.scrollTo(0,0); }catch(e){}
    try{ document.documentElement.scrollTop=0; document.body.scrollTop=0; }catch(e){}
  }

  /* 드롭다운에서 하나 고른 순간, 운영체제가 띄운 목록은 아직 닫히는 중이다.
     그 틈에 화면을 통째로 다시 그리면 목록이 매달려 있던 그 <select> 가
     사라진다. 그러면 다음에 한 번 더 눌러도 목록이 안 열린다.
     ― 한 번 고르면 다른 걸로 못 바꾸던 게 이것 때문이다.

     그래서 한 박자 늦춰 그리고, 그린 뒤에 같은 자리로 초점을 돌려준다.
     초점이 돌아와야 키보드로 위아래 눌러 고르던 것도 안 끊긴다. */
  function pickRender(id){
    setTimeout(function(){
      render();
      if(!id) return;
      var e=$('#'+id); if(!e||!e.focus) return;
      try{ e.focus({preventScroll:true}); }catch(err){ try{ e.focus(); }catch(e2){} }
    },0);
  }

  /* 다시 그리면 치고 있던 칸이 통째로 새로 만들어진다. 커서도, 방금 친
     글자도 같이 사라진다. 저장은 0.7초 뒤에 조용히 일어나므로 「잠깐
     멈췄다가 다시 치는」 바로 그 순간이 정확히 거기에 걸린다.
     스페이스가 먹히는 것처럼 보이던 게 이것이다.

     그려 놓고 같은 칸을 다시 찾아 커서를 제자리에 돌려놓는다. */
  function fieldKey(n){
    try{
      if(n.id) return '#'+(window.CSS&&CSS.escape?CSS.escape(n.id):n.id);
      var d=n.dataset||{};
      if(d.apk) return '[data-apk="'+d.apk+'"]';
      if(d.ei!=null&&d.ef) return '[data-ei="'+d.ei+'"][data-ef="'+d.ef+'"]';
      if(d.i!=null&&d.f) return '[data-i="'+d.i+'"][data-f="'+d.f+'"]';
    }catch(e){}
    return '';
  }
  function render(){
    var act=document.activeElement, keep=null;
    if(act&&(act.tagName==='INPUT'||act.tagName==='TEXTAREA'||act.tagName==='SELECT')&&act.type!=='file'){
      var k=fieldKey(act);
      if(k){
        keep={k:k, v:act.value, s:null, e:null};
        /* number·date 칸은 커서 위치를 물어보면 화를 낸다. 모르면 비워 둔다. */
        try{ keep.s=act.selectionStart; keep.e=act.selectionEnd; }catch(e2){}
      }
    }
    paint();
    if(!keep) return;
    try{
      var n=document.querySelector(keep.k);
      if(!n) return;
      /* 그리는 사이에 친 글자가 상태보다 앞서 있을 수 있다. 화면 쪽을 믿는다. */
      if(n.value!==keep.v) n.value=keep.v;
      n.focus({preventScroll:true});
      if(keep.s!=null&&n.setSelectionRange) n.setSelectionRange(keep.s,keep.e);
    }catch(e3){}
  }
  function paint(){
    app=$('#app')||app; if(!app)return;
    renderNav();
    if(S.fatal){app.innerHTML='<div class="card"><div class="empty"><strong>열 수 없습니다</strong>'+esc(S.fatal)+'</div></div>';return;}
    if(S.loading){app.innerHTML='<div class="card"><div class="empty"><strong>불러오는 중</strong>잠시만 기다려 주세요.</div></div>';return;}
    if(S.view==='dash')return renderDash();
    if(S.view==='docs')return S.docSel&&S.docs[S.docSel]?renderDoc(S.docs[S.docSel]):renderDocList();
    if(S.view==='acct')return renderAcct();
    if(S.view==='report')return renderReport();
    if(S.view==='roles')return renderRoles();
    if(S.view==='conf')return renderConfig();
    return S.sel&&S.events[S.sel]?renderEvent(S.events[S.sel]):renderSettleList();
  }
  function renderNav(){
    var todo=docList('todo').length;
    var n=$('#nav'); if(!n)return;
    n.innerHTML=NAV.map(function(x){
      return '<button type="button" data-nav="'+x.k+'" aria-current="'+(S.view===x.k?'true':'false')+'">'+
        '<span class="ic">'+(ICON[x.k]||'')+'</span>'+x.t+
        (x.k==='docs'&&todo?'<span class="badge">'+todo+'</span>':'')+'</button>';
    }).join('');
    var lg=$('.rail .logo');
    if(lg){
      lg.setAttribute('role','button');
      lg.setAttribute('tabindex','0');
      lg.setAttribute('title','대시보드로');
      lg.setAttribute('data-home','1');
      var want='<img src="'+esc(S.logo||LOGO_FALLBACK)+'" alt="마이티블레싱" '+
        'onerror="this.parentNode.innerHTML=\'마이티블레싱<small>업무관리시스템</small>\'"><small>업무관리시스템</small>';
      if(lg.innerHTML!==want) lg.innerHTML=want;
    }
    var t=$('#ptitle');
    if(t)t.textContent={dash:'대시보드',docs:'전자결재',acct:'회계·재무',settle:'행사',
      report:'손익 보고서',roles:'사용자·권한',conf:'시스템 설정'}[S.view]||'업무관리시스템';
    renderBell();
    renderWho();
    renderPeopleList();
    renderPartyList();
  }
  /* 정산표 이름칸이 쓰는 목록. 화면마다 다시 만들지 않고 한 장만 둔다. */
  function renderPeopleList(){
    var dl=document.getElementById('plist'); if(!dl)return;
    var L=nameChoices();
    var key=L.map(function(x){return x.n+'·'+x.hint;}).join('|');
    if(dl.getAttribute('data-k')===key) return;
    dl.setAttribute('data-k',key);
    dl.innerHTML=L.map(function(x){
      return '<option value="'+esc(x.n)+'">'+esc(x.hint)+'</option>';
    }).join('');
  }
  function renderWho(){
    var w=$('#who'); if(!w)return;
    if(!S.me.id){ if(w.innerHTML)w.innerHTML=''; return; }
    var av=avatarOf(S.me.id), nm=(S.me.name||'익명')+' · '+ROLE_LABEL[myRole()];
    /* 사진은 data: 주소라 길다. 통째로 비교하면 매번 문자열을 복사한다. */
    var key=av.length+'·'+av.slice(-20)+'·'+nm+'·'+(S.sb?1:0);
    if(w.getAttribute('data-k')===key) return;
    w.setAttribute('data-k',key);
    w.innerHTML='<img alt="" src="'+esc(av)+'"><span>'+esc(nm)+'</span>'+
      (S.sb?'<button class="btn sm" id="signOut" style="margin-left:6px">로그아웃</button>':'');
  }
  function renderBell(){
    var b=$('#bellBtn'), pn=$('#bellPanel'); if(!b||!pn)return;
    if(!S.me.id){ b.hidden=true; pn.hidden=true; return; }
    b.hidden=false;
    var n=unreadCount();
    b.innerHTML=ICON.bell+(n?'<span class="dot">'+(n>99?'99+':n)+'</span>':'');
    b.setAttribute('aria-expanded',S.bellOpen?'true':'false');
    b.setAttribute('aria-label','알림'+(n?' '+n+'건':''));
    pn.hidden=!S.bellOpen;
    if(!S.bellOpen){ pn.innerHTML=''; return; }
    var list=notifsFor(), rd=S.notifReadAt||'';
    pn.innerHTML='<h3>알림'+(n?'<button type="button" id="nAllRead">모두 읽음</button>':'')+'</h3>'+
      (list.length?list.map(function(x){
        var tgt=x.doc?' data-ngo="'+esc(x.doc)+'"'
               :(x.go&&x.go.v==='roles')?' data-nrole="'+esc(x.go.uid||'')+'"':'';
        return '<button type="button" class="nrow'+((x.at||'')>rd?' unread':'')+'"'+tgt+'>'+
          '<span class="mark"></span><span class="tx">'+esc(x.text)+
          '<span class="tm">'+esc(shortTime(x.at))+'</span></span></button>';
      }).join('')
      :'<div class="empty">아직 알림이 없습니다.</div>');
  }

  /* ---- 대시보드 ---- */
  /* ─── 대시보드 ───
     업무 진행률은 슬랙이 보여준다. 여기는 돈이다.
     아침에 열었을 때 「지금 돈이 어떻게 돼 있나」가 한 화면에 들어와야 한다. */

  /* 그 달에 오간 돈. 통장 사이 이동은 회사 밖으로 나간 게 아니라 뺀다. */
  function ledMonth(ym){
    var inn=0,out=0,n=0;
    Object.keys(S.ledger).forEach(function(k){
      var r=S.ledger[k]||{};
      if(r.dir==='move') return;
      if(String(r.on||'').slice(0,7)!==ym) return;
      var a=num(r.amt,0); n++;
      if(r.dir==='in') inn+=a; else out+=a;
    });
    return {inn:inn, out:out, n:n};
  }
  function cashTotal(){
    return bankList().reduce(function(a,b){ return a+bankBal(b.id); },0);
  }
  /* 아직 안 나간 돈 — 승인됐는데 미지급 + 돌려주지 않은 대신결제 */
  function unpaidAll(){
    var docs=Object.keys(S.docs).map(function(k){var d=clone(S.docs[k]); d.id=k; return d;})
      .filter(function(d){ return d&&d.type==='expense'&&docStatus(d)==='approved'&&payState(d)!=='paid'; });
    var sum=docs.reduce(function(a,d){ return a+expTotal(d); },0);
    var adv=advOpen(), advSum2=advSum(adv);
    var late=docs.filter(payLate);
    return {docs:docs, sum:sum, adv:adv, advSum:advSum2, late:late, total:sum+advSum2};
  }
  /* 아직 안 들어온 돈 */
  function dueAll(){
    var rows=[], sum=0;
    Object.keys(S.events).forEach(function(k){
      var ev=clone(S.events[k]); ev.id=k;
      var d=rcvDue(ev);
      if(d>0){ rows.push({ev:ev, due:d}); sum+=d; }
    });
    rows.sort(function(a,b){ return b.due-a.due; });
    return {rows:rows, sum:sum};
  }

  function renderDash(){
    var ym=today().slice(0,7);
    var m=ledMonth(ym), cash=cashTotal();
    var up=unpaidAll(), due=dueAll();
    var todo=docList('todo'), prog=docList('progress');
    var evs=Object.keys(S.events).map(function(k){var e=clone(S.events[k]); e.id=k; return e;});
    var running=evs.filter(function(e){ return progress(e).status!=='paid'; });

    /* 최근 6개월 수입·지출 */
    var months=[];
    for(var i=5;i>=0;i--){
      var d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
      months.push(d.getFullYear()+'-'+pad2(d.getMonth()+1));
    }
    var md=months.map(function(x){ var g=ledMonth(x); g.ym=x; return g; });
    var mx=md.reduce(function(a,g){ return Math.max(a,g.inn,g.out); },0)||1;
    var chart = md.some(function(g){return g.n;})
      ? '<div style="display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:6px">'+
        md.map(function(g){
          var hi=Math.max(2,Math.round(g.inn/mx*120)), ho=Math.max(2,Math.round(g.out/mx*120));
          return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px">'+
            '<div style="display:flex;align-items:flex-end;gap:3px;height:124px">'+
              '<div title="수입 '+won(g.inn)+'" style="width:13px;height:'+hi+'px;background:var(--accent);border-radius:3px 3px 0 0"></div>'+
              '<div title="지출 '+won(g.out)+'" style="width:13px;height:'+ho+'px;background:var(--bad);border-radius:3px 3px 0 0;opacity:.75"></div>'+
            '</div>'+
            '<span style="font-size:11px;color:var(--muted)">'+(+g.ym.slice(5))+'월</span>'+
            '<span style="font-family:var(--font-num);font-size:10.5px;color:var(--muted)">'+
              (g.inn-g.out>=0?'+':'−')+Math.abs(Math.round((g.inn-g.out)/10000))+'만</span>'+
          '</div>';
        }).join('')+'</div>'+
        '<p class="hint" style="margin:10px 0 0">'+
          '<span style="color:var(--accent)">■</span> 수입 &nbsp; '+
          '<span style="color:var(--bad)">■</span> 지출 &nbsp;·&nbsp; 아래 숫자는 그 달 남은 돈입니다. 통장 사이 이동은 뺐습니다.</p>'
      : '<div class="empty" style="padding:26px 8px">장부에 거래가 아직 없습니다.<br>회계·재무 → 장부에서 넣거나, 지출결의서를 지급 처리하면 모입니다.</div>';

    var recent=[];
    Object.keys(S.docs).forEach(function(k){var d=S.docs[k];
      recent.push({at:d.updatedAt,t:DOC_KIND[d.type]||'문서',n:d.title||'(제목 없음)',s:docStatus(d),l:DOC_STATUS[docStatus(d)],
                   w:ownerCell('doc',d),go:'doc:'+k});});
    evs.forEach(function(e){
      recent.push({at:e.updatedAt,t:'정산',n:e.name||'(이름 없음)',s:progress(e).status,l:SET_STATUS[progress(e).status],
                   w:ownerCell('ev',e),go:'ev:'+e.id});});
    Object.keys(S.ledger).forEach(function(k){
      var r=S.ledger[k]||{};
      if(!r.src) return;          /* 손으로 넣은 줄은 문서 쪽에서 이미 보인다 */
      recent.push({at:r.updatedAt,t:'회계',n:(r.memo||r.item||'거래')+' · '+(r.dir==='in'?'+':'−')+won(num(r.amt,0)),
                   s:'approved',l:'장부',w:'',go:'acct:book'});
    });
    recent.sort(function(a,b){return (b.at||'')<(a.at||'')?-1:1;});
    recent=recent.slice(0,10);

    app.innerHTML=
      '<div class="stack">'+
      (S.stale?'<div class="note n-warn">데이터를 아직 불러오지 못했습니다. 보이는 내용이 최신이 아닐 수 있습니다.</div>':'')+
      (up.late.length
        ? '<div class="note n-bad"><b>지급 예정일이 지난 건이 '+up.late.length+'건</b> 있습니다 — '+
          won(up.late.reduce(function(a,d){return a+expTotal(d);},0))+
          '<div class="actions" style="margin-top:10px"><button class="btn sm" data-go="acct:spend">지출 현황 보기</button></div></div>'

            (up.adv.length

        (editable?'<td style="width:32px"><button class="del" data-eidel="'+i+'" aria-label="항목 삭제">×</button></td>':'')+
      '</tr>';
    }).join('');

    var lineUI=(d.steps||[]).map(function(x,i){
      var tag=x.state==='approved'?'<span class="pill p-approved">승인</span>':x.state==='rejected'?'<span class="pill p-rejected">반려</span>':'<span class="pill p-pending">대기</span>';
      return '<div class="person"><span style="font-family:var(--font-num);color:var(--muted);width:14px">'+(i+1)+'</span>'+
        '<span class="nm">'+esc(nameOf(x.uid))+'</span>'+

              acts.push('<button class="btn danger" data-dact="reject">반려</button>'); }

            '<div class="field"><label for="xAccount">계정과목</label><select id="xAccount"'+dis+'>'+
              ACC().map(function(a){return '<option'+(d.account===a?' selected':'')+'>'+esc(a)+'</option>';}).join('')+'</select></div>'+
            '<div class="field"><label for="xMethod">지급 수단</label><select id="xMethod"'+dis+'>'+
              Object.keys(METHODS).map(function(k){return '<option value="'+k+'"'+(d.method===k?' selected':'')+'>'+METHODS[k]+'</option>';}).join('')+'</select></div>'+
          '</div>'+

        '</section>'+
        '<section class="card"><h2>받는 사람</h2>'+
          '<div class="field"><label for="xPayee">성명 / 상호</label>'+

            ' placeholder="치면 지금까지 적은 곳이 내려옵니다"></div>'+
          '<div class="row2">'+fld('text','xBank','은행',d.payeeBank,dis)+fld('text','xAcct','계좌번호',d.payeeAcct,dis)+'</div>'+
          (editable?'<p class="hint" style="margin:-4px 0 0">명부나 예전 문서에 계좌가 있으면 이름을 고르는 순간 아래가 채워집니다.</p>':'')+
        '</section>'+
        '<section class="card"><h2>결재선</h2>'+
          (lineUI?'<div class="people">'+lineUI+'</div>':'<div class="empty" style="padding:18px 8px">결재자를 추가하세요.</div>')+
          (editable?'<div class="field" style="margin-top:12px"><input id="lnSearch" placeholder="이름으로 검색해 결재자 추가" autocomplete="off"></div><div class="people" id="lnResults"></div>':'')+
          (editable&&coopAddable(d)
            ? '<div class="actions" style="margin-top:8px"><button class="btn sm" id="xCoop">+ 회계 협조</button></div>'+
              '<p class="hint" style="margin:6px 0 0">돈이 나가는 문서는 회계가 한 번 보는 게 안전합니다. '+
                '통장에 돈이 있는지, 계정과목이 맞는지를 봅니다.</p>'
            : '')+
          '<p class="hint" style="margin-top:8px">위에서부터 순서대로 결재합니다.</p>'+
        '</section>'+
      '</div><div class="stack" style="min-width:0">'+
        '<section class="card"><h2>지출 내역</h2>'+
          '<div class="scroll"><table><thead><tr><th>항목</th><th class="num">수량</th><th class="num">단가</th><th class="num">금액</th><th>비고</th>'+(editable?'<th></th>':'')+'</tr></thead>'+
          '<tbody>'+rows+'</tbody></table></div>'+
          (editable?'<div class="actions" style="margin-top:10px"><button class="btn sm" id="eiAdd">+ 항목 추가</button></div>':'')+
          '<div class="note n-info" style="margin:12px 0 0;display:flex;justify-content:space-between;align-items:baseline">'+
            '<b>합계</b><b id="xTotal" style="font-family:var(--font-num);font-size:17px">'+won(total)+'</b></div>'+
        '</section>'+
        evidenceCard(d)+
        foldCard('xnote','지출 사유',
          '<textarea id="xNote" rows="3"'+dis+' placeholder="무엇을 위한 지출인지 적어주세요">'+esc(d.note||'')+'</textarea>',
          {open:!!(d.note||'').trim()||editable,
           sum:(d.note||'').trim()?esc((d.note||'').trim().slice(0,24)):'비어 있습니다'})+
        foldCard('xprev','미리보기',expensePreview(d),{open:false,sum:'눌러서 펼치기'})+
        '<section class="card"><h2>결재</h2>'+docSteps(d)+
          (acts.length?'<div class="actions" style="margin-top:14px">'+acts.join('')+'</div>':'')+
          (st==='approved'?'<p class="hint" style="margin:10px 0 0">PDF는 파일로 바로 내려받습니다.</p>':'')+
        '</section>'+
        '<section class="card"><h2>지급</h2>'+payBlock+'</section>'+
      '</div></div>';

    if(editable){
      var box=$('#lnSearch');
      if(box){ box.addEventListener('focus',function(){lineSearch('');});
               box.addEventListener('input',function(){lineSearch(box.value);}); }
    }
  }

  function expensePreview(d){
    var st=docStatus(d);
    var rows=(d.items||[]).filter(function(it){return (it.name||'').trim()||num(it.price,0);}).map(function(it,i){
      return '<tr><td class="num">'+(i+1)+'</td><td>'+esc(it.name)+'</td><td class="num">'+num(it.qty,0)+'</td>'+
        '<td class="num">'+won(num(it.price,0))+'</td><td class="num">'+won(num(it.qty,0)*num(it.price,0))+'</td>'+
        '<td>'+esc(it.note||'')+'</td></tr>';
    }).join('');
    var ev=d.eventId&&S.events[d.eventId];
    return '<div class="doc">'+
      docHead('지 출 결 의 서')+'<hr>'+
      signBox(d)+
      '<div class="to"><b>문서번호</b>'+esc(d.no||'—')+'</div>'+
      '<div class="to"><b>기안일자</b>'+esc(d.date||'—')+'</div>'+
      '<div class="to"><b>행　　사</b>'+esc(ev?(ev.name||''):'—')+'</div>'+
      '<div class="to"><b>계정과목</b>'+esc(d.account||'—')+'</div>'+
      '<div class="to"><b>지급수단</b>'+esc(METHODS[d.method]||'—')+'</div>'+
      '<div class="to"><b>받는사람</b>'+esc(d.payee||'—')+(d.payeeBank?' ('+esc(d.payeeBank)+' '+esc(d.payeeAcct||'')+')':'')+'</div>'+
      '<hr class="thin">'+
      '<table class="ov" style="margin-top:14px"><thead><tr><th style="width:26px">№</th><th style="width:auto">항목</th><th style="width:42px">수량</th><th style="width:84px">단가</th><th style="width:94px">금액</th><th style="width:100px">비고</th></tr></thead>'+
      '<tbody>'+(rows||'<tr><td colspan="6" style="text-align:center;color:#8a8f97">내역 없음</td></tr>')+'</tbody>'+
      '<tfoot><tr><th colspan="4" style="text-align:right">합　계</th><th class="num" style="font-family:var(--font-num)">'+won(expTotal(d))+'</th><th></th></tr></tfoot></table>'+
      (d.note?'<p style="margin:12px 0 0;white-space:pre-wrap">'+esc(d.note)+'</p>':'')+
      '<div class="end" style="text-align:left;margin-top:14px">위와 같이 지출하고자 하오니 결재하여 주시기 바랍니다.</div>'+
