    '</div>';
  }

  /* ---- 공문 작성/보기 ---- */
  /* 신청서 한 칸. 서식이 달라도 그리는 법은 같다. */
  function applyField(d,f,dis){
    var v=d[f.k]==null?'':d[f.k];
    var id='ap_'+f.k;
    var lab='<label for="'+id+'">'+esc(f.l)+(f.r?' <span style="color:var(--bad)">*</span>':'')+'</label>';
    if(f.t==='a')
      return '<div class="field">'+lab+'<textarea id="'+id+'" data-apk="'+f.k+'" rows="3"'+dis+
             ' placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea></div>';
    if(f.t==='s'){
      var opts=(typeof f.o==='function')?f.o():(f.o||[]);
      return '<div class="field">'+lab+'<select id="'+id+'" data-apk="'+f.k+'"'+dis+'>'+
        '<option value=""></option>'+
        opts.map(function(o){ return '<option'+(v===o?' selected':'')+'>'+esc(o)+'</option>'; }).join('')+
        '</select></div>';
    }
    var tp=f.t==='d'?'date':(f.t==='n'?'number':'text');
    return '<div class="field">'+lab+'<input id="'+id+'" data-apk="'+f.k+'" type="'+tp+'" value="'+esc(v)+'"'+dis+
           ' placeholder="'+esc(f.ph||'')+'"'+(f.t==='n'?' inputmode="numeric"':'')+'></div>';
  }

  /* 종이로 내는 신청서에는 누가 쓰고 누가 결재했는지가 문서 안에 있어야 한다.
     화면의 결재선은 화면에만 있다. 인쇄하면 사라진다. */
  /* 협조는 결재와 다르다. 「이 돈을 써도 되는가」를 정하는 게 결재라면,
     협조는 「통장에 돈이 있는가, 계정과목이 맞는가」를 보는 자리다.
     순서는 같은 줄에 세운다 — 따로 돌리면 둘 다 기다리다 아무도 안 본다. */
  /* 회계 역할인 사람 중 아직 결재선에 없는 사람. 없으면 단추를 안 보인다 —
     누를 수 없는 단추를 보여 주는 건 거짓말이다. */
  function coopPick(d){
    var on={}; (d.steps||[]).forEach(function(x){ on[x.uid]=1; });
    return accountingUids().filter(function(u){ return !on[u]; });
  }
  function coopAddable(d){ return coopPick(d).length>0; }
  function stepRole(x,i){
    if(x&&x.role==='coop') return '협조';
    return i===0?'기안':'결재';
  }
  function signBox(d){
    var L=(d.steps||[]);
    if(!L.length) return '';
    var th='padding:4px 10px;border:1px solid #bbb;background:var(--bg);'+
           'font-size:11.5px;font-weight:600;color:#555;text-align:center';
    var td='padding:10px;border:1px solid #bbb;text-align:center;font-size:13px;height:40px;min-width:68px;white-space:nowrap';
    var tdd='padding:3px 10px;border:1px solid #bbb;text-align:center;font-size:11px;color:#777';
    /* 전역 table{width:100%} 이 있어서 width 를 안 적으면 한 칸짜리 표가
       문서 폭을 다 먹는다.
       띄우지(float) 않는다. 띄우면 가운데 정렬한 제목 위로 올라앉는다.
       종이 문서도 결재란은 제목 위, 오른쪽에 따로 놓는다. */
    return '<div style="text-align:right;margin:6px 0 2px">'+
      '<table style="width:auto;display:inline-table;border-collapse:collapse">'+
      '<tr>'+L.map(function(x,i){ return '<th style="'+th+'">'+stepRole(x,i)+'</th>'; }).join('')+'</tr>'+
      '<tr>'+L.map(function(x){
        return '<td style="'+td+'">'+esc(nameOf(x.uid))+
          (x.state==='approved'?' <span style="color:var(--accent-ink)">(인)</span>'
           :x.state==='rejected'?' <span style="color:var(--bad)">(반려)</span>':'')+'</td>';
      }).join('')+'</tr>'+
      '<tr>'+L.map(function(x){
        return '<td style="'+tdd+'">'+esc(x.at?ymd(x.at):'')+'</td>';
      }).join('')+'</tr>'+
      '</table></div>';
  }
  function applyPreview(d){
    var A=applySchema(d.type)||{f:[]};
    var rows=A.f.map(function(f){
      var v=d[f.k];
      if(f.t==='n') v=num(v,0)?won(num(v,0)):'';
      v=String(v==null?'':v).trim();
      return '<tr><th style="width:130px;text-align:left;background:var(--bg)">'+esc(f.l)+'</th>'+
        '<td style="white-space:pre-wrap">'+(v?esc(v):'<span style="color:var(--zero)">—</span>')+'</td></tr>';
    }).join('');
    var extra='';
    if(A.days){
      var n=leaveDays(d);
      extra='<tr><th style="text-align:left;background:var(--bg)">일수</th>'+
        '<td><b>'+(n?(n+'일'):'—')+'</b></td></tr>';
    }
    return '<div class="doc">'+
      docHead('마이티블레싱')+'<hr>'+
      signBox(d)+
      '<h1 style="text-align:center;font-size:19px;margin:18px 0 6px">'+esc(DOC_KIND[d.type]||'')+'</h1>'+
      '<p style="text-align:center;color:#666;font-size:12.5px;margin:0 0 16px">'+
        esc(d.no||'')+(d.date?' · '+esc(d.date):'')+'</p>'+
      '<table style="width:100%;border-collapse:collapse" class="prev">'+
        '<tr><th style="width:130px;text-align:left;background:var(--bg)">기안자</th><td>'+esc(nameOf(d.drafter))+'</td></tr>'+
        rows+extra+
      '</table>'+
    '</div>';
  }

  function renderApply(d){
    var A=applySchema(d.type);
    var st=docStatus(d), editable=writable()&&st==='draft'&&(d.drafter===S.me.id||S.me.canEdit);
    var dis=editable?'':' disabled';
    var mine=isMyTurn(d);

    var acts=[];
    if(editable&&(d.steps||[]).length) acts.push('<button class="btn primary" data-dact="submit">결재 올리기</button>');
    if(mine){ acts.push('<button class="btn primary" data-dact="approve">승인</button>');
              acts.push('<button class="btn danger" data-dact="reject">반려</button>'); }
    if(writable()&&st!=='draft'&&d.drafter===S.me.id&&st!=='approved') acts.push('<button class="btn" data-dact="cancel">취소</button>');
    if(writable()&&(st==='rejected'||st==='canceled')&&d.drafter===S.me.id) acts.push('<button class="btn" data-dact="reopen">다시 작성</button>');
    if(st==='approved'){
      acts.push('<button class="btn primary" data-dact="pdf">PDF 내려받기</button>');
      acts.push('<button class="btn" data-dact="print">인쇄</button>');
    }

    var lineUI=(d.steps||[]).map(function(x,i){
      var tag=x.state==='approved'?'<span class="pill p-approved">승인</span>':x.state==='rejected'?'<span class="pill p-rejected">반려</span>':'<span class="pill p-pending">대기</span>';
      return '<div class="person"><span style="font-family:var(--font-num);color:var(--muted);width:14px">'+(i+1)+'</span>'+
        '<span class="nm">'+esc(nameOf(x.uid))+'</span>'+
        '<span style="font-size:11.5px;color:var(--muted)">'+stepRole(x,i)+'</span>'+tag+
        (editable?'<button class="del" data-lndel="'+i+'" aria-label="결재자 제거">×</button>':'')+'</div>';
    }).join('');
    var delCtl = (writable()&&st==='draft'&&(d.drafter===S.me.id||S.me.canEdit))
      ? (S.confirmDocDel===d.id
          ? '<button class="btn danger sm" id="docDelYes">지웁니다</button><button class="btn sm" id="docDelNo" style="margin-left:5px">취소</button>'
          : '<button class="btn sm" id="docDel">문서 삭제</button>')
      : '';

    var warn='';
    if(A.sum&&num(d[A.sum],0)>0&&d.type!=='leave'){
      warn='<div class="note n-info" style="margin-top:12px">'+
        '여기 적은 금액은 <b>예상</b>입니다. 실제로 돈이 나갈 때는 '+
        '<b>지출결의서</b>를 따로 올려야 장부에 잡힙니다. 이 문서만으로는 장부가 움직이지 않습니다.</div>';
    }

    app.innerHTML=
      '<div class="actions" style="margin-bottom:14px">'+
        '<button class="btn sm" id="dback">← 목록</button>'+
        '<span style="flex:1"></span>'+delCtl+'</div>'+
      '<div class="two">'+
      '<div class="stack" style="min-width:0">'+
        '<section class="card"><h2>'+esc(DOC_KIND[d.type])+'</h2>'+
          '<div class="row2">'+
            '<div class="field"><label for="apTitle">제목</label>'+
              '<input id="apTitle" value="'+esc(d.title||'')+'"'+dis+'></div>'+
            '<div class="field"><label for="apDate">기안일</label>'+
              '<input id="apDate" type="date" value="'+esc(d.date||today())+'"'+dis+'></div>'+
          '</div>'+
          A.f.map(function(f){ return applyField(d,f,dis); }).join('')+
          (A.days
            ? '<div class="note '+(leaveDays(d)?'n-info':'n-warn')+'" style="margin-top:4px">'+
                (leaveDays(d)?'<b>'+leaveDays(d)+'일</b> 신청입니다.'
                            :'시작일과 종료일을 확인해 주세요. 종료일이 시작일보다 빠릅니다.')+'</div>'
            : '')+
          warn+
        '</section>'+
        '<section class="card"><h2>결재선</h2>'+
          (lineUI?'<div class="people">'+lineUI+'</div>':'<div class="empty" style="padding:18px 8px">결재자를 추가하세요.</div>')+
          (editable?'<div class="field" style="margin-top:12px"><input id="lnSearch" placeholder="이름으로 검색해 결재자 추가" autocomplete="off"></div><div class="people" id="lnResults"></div>':'')+
          '<p class="hint" style="margin-top:8px">위에서부터 순서대로 결재합니다.</p>'+
        '</section>'+
      '</div><div class="stack" style="min-width:0">'+
        evidenceCard(d)+
        '<section class="card"><h2>미리보기</h2>'+applyPreview(d)+'</section>'+
        '<section class="card"><h2>결재</h2>'+docSteps(d)+
          (acts.length?'<div class="actions" style="margin-top:14px">'+acts.join('')+'</div>':'')+
        '</section>'+
      '</div></div>';

    if(editable){
      var box=$('#lnSearch');
      if(box){ box.addEventListener('focus',function(){lineSearch('');});
               box.addEventListener('input',function(){lineSearch(box.value);}); }
    }
  }

  function renderDoc(d){
    if(d.type==='expense') return renderExpense(d);
    if(isApply(d)) return renderApply(d);
    var st=docStatus(d), editable=writable()&&st==='draft'&&(d.drafter===S.me.id||S.me.canEdit);
    var dis=editable?'':' disabled';
    var mine=isMyTurn(d);

    var paras=(d.paras||[]).map(function(p,i){
      return '<div class="para"><span class="n">'+(i+1)+'.</span>'+
        '<textarea data-dp="'+i+'" rows="2"'+dis+'>'+esc(p)+'</textarea>'+
        (editable?'<button class="del" data-dpdel="'+i+'" aria-label="문단 삭제">×</button>':'')+'</div>';
    }).join('');

    var ovRows=(d.ov||[]).map(function(r,i){
      return '<tr><td style="width:120px"><input data-ovk="'+i+'" value="'+esc(r.k)+'"'+dis+' style="padding:4px 6px;font-size:12.5px"></td>'+
        '<td><textarea data-ovv="'+i+'" rows="2"'+dis+' style="font-size:12.5px">'+esc(r.v)+'</textarea></td></tr>';
    }).join('');

    var lineUI=(d.steps||[]).map(function(s,i){
      var tag=s.state==='approved'?'<span class="pill p-approved">승인</span>':s.state==='rejected'?'<span class="pill p-rejected">반려</span>':'<span class="pill p-pending">대기</span>';
      return '<div class="person"><span style="font-family:var(--font-num);color:var(--muted);width:14px">'+(i+1)+'</span>'+
        '<span class="nm">'+esc(nameOf(s.uid))+'</span>'+tag+
        (editable?'<button class="del" data-lndel="'+i+'" aria-label="결재자 제거">×</button>':'')+
        '</div>'+(s.comment?'<div style="font-size:12px;color:var(--muted);padding:0 10px 4px 33px">“'+esc(s.comment)+'”</div>':'');
    }).join('');

    var acts=[];
    if(editable&&(d.steps||[]).length) acts.push('<button class="btn primary" data-dact="submit">결재 올리기</button>');
    if(mine){ acts.push('<button class="btn primary" data-dact="approve">승인</button>');
              acts.push('<button class="btn danger" data-dact="reject">반려</button>'); }
    if(writable()&&st!=='draft'&&d.drafter===S.me.id&&st!=='approved') acts.push('<button class="btn" data-dact="cancel">취소</button>');
    if(writable()&&(st==='rejected'||st==='canceled')&&d.drafter===S.me.id) acts.push('<button class="btn" data-dact="reopen">다시 작성</button>');
    if(st==='approved'){
      acts.push('<button class="btn primary" data-dact="pdf">PDF 내려받기</button>');
      acts.push('<button class="btn" data-dact="print">인쇄</button>');
    }
    acts.push('<button class="btn" id="docCopy">본문 복사</button>');
    var printHint = st==='approved'
      ? '<p class="hint" style="margin:10px 0 0">PDF는 파일로 바로 내려받습니다. 인쇄창을 거치지 않으니 날짜·주소가 찍히지 않습니다.<br>'+
        '종이로 뽑거나 PDF가 안 만들어질 때는 <b>인쇄</b>를 쓰세요. 여백을 0으로 잡아 두어 그쪽도 날짜·주소가 찍히지 않습니다.</p>' : '';

    var delCtl = (writable()&&st==='draft'&&(d.drafter===S.me.id||S.me.canEdit))
      ? (S.confirmDocDel===d.id
        ? '<div class="actions"><span style="color:var(--bad);font-size:12.5px;align-self:center">되돌릴 수 없습니다</span><button class="btn danger sm" id="docDelYes">삭제</button><button class="btn sm" id="docDelNo">취소</button></div>'
        : '<button class="btn danger sm" id="docDel">문서 삭제</button>') : '';

    app.innerHTML=
      '<div class="actions" style="margin-bottom:14px"><button class="btn sm" id="dback">← 문서함</button>'+
        '<span class="pill p-'+st+'" style="align-self:center">'+DOC_STATUS[st]+'</span>'+
        '<span class="pill p-pending" style="align-self:center">'+SCOPE[d.scope||'out']+'</span>'+
        '<span style="flex:1"></span>'+delCtl+'</div>'+
      (mine?'<div class="note n-warn" style="margin:0 0 14px">내 결재 차례입니다.</div>':'')+
      (!editable&&st==='draft'?'<div class="note n-info" style="margin:0 0 14px">작성자만 수정할 수 있습니다.</div>':'')+
      '<div class="cols"><div class="stack">'+
        '<section class="card"><h2>문서 정보</h2>'+
          fld('text','dTitle','문서 제목(내부용)',d.title,dis)+
          '<div class="row2">'+fld('text','dNo','문서번호',d.no,dis)+fld('text','dDate','시행일자',d.date,dis)+'</div>'+
          fld('text','dTo','수신',d.to,dis)+
          '<div class="row2">'+fld('text','dCc','참조',d.cc,dis)+fld('text','dSigner','발신명의',d.signer,dis)+'</div>'+
          '<div class="field"><label for="dScope">받는 곳</label><select id="dScope"'+dis+'>'+
            ['out','in'].map(function(k){return '<option value="'+k+'"'+((d.scope||'out')===k?' selected':'')+'>'+SCOPE[k]+'</option>';}).join('')+
          '</select></div>'+
          fld('text','dSubject','제목',d.subject,dis)+
        '</section>'+
        '<section class="card"><h2>결재선</h2>'+
          (lineUI?'<div class="people">'+lineUI+'</div>':'<div class="empty" style="padding:18px 8px">결재자를 추가하세요.</div>')+
          (editable?'<div class="field" style="margin-top:12px"><input id="lnSearch" placeholder="이름으로 검색해 결재자 추가" autocomplete="off"></div><div class="people" id="lnResults"></div>':'')+
          '<p class="hint" style="margin-top:8px">위에서부터 순서대로 결재합니다.</p>'+
        '</section>'+
        '<section class="card"><h2>시행 정보</h2>'+
          fld('text','dAddr','주소',d.addr,dis)+
          '<div class="row2">'+fld('text','dTel1','전화1',d.tel1,dis)+fld('text','dTel2','전화2',d.tel2,dis)+'</div>'+
          fld('text','dEmail','이메일',d.email,dis)+
        '</section>'+
      '</div><div class="stack" style="min-width:0">'+
        '<section class="card"><h2>본문</h2>'+paras+
          (editable?'<div class="actions"><button class="btn sm" id="dpAdd">+ 문단 추가</button></div>':'')+
        '</section>'+
        '<section class="card"><h2>행사 개요</h2><div class="scroll"><table>'+ovRows+'</table></div>'+
          (editable?'<div class="actions" style="margin-top:10px"><button class="btn sm" id="ovAdd">+ 항목 추가</button></div>':'')+
        '</section>'+
        attCard(d)+
        evidenceCard(d,{doc:true})+
        '<section class="card"><h2>미리보기</h2>'+docPreview(d)+'</section>'+
        '<section class="card"><h2>결재</h2>'+docSteps(d)+
          (acts.length?'<div class="actions" style="margin-top:14px">'+acts.join('')+'</div>':'')+printHint+
        '</section>'+
      '</div></div>';

    if(editable){
      var box=$('#lnSearch');
      if(box){ box.addEventListener('focus',function(){lineSearch('');});
               box.addEventListener('input',function(){lineSearch(box.value);}); }
    }
  }
  /* 붙임은 '문구'다. 파일을 올리면 한 줄이 자동으로 생기지만,
     파일 없이 '별첨 1부.' 처럼 적기만 하는 경우도 있어 따로 둔다. */
  function attCard(d){
    var st=docStatus(d);
    var editable=writable()&&st==='draft'&&(d.drafter===S.me.id||S.me.canEdit);
    var L=d.att||[];
    var rows=L.map(function(x,i){
      return '<div class="para"><span class="n">'+(L.length>1?(i+1)+'.':'·')+'</span>'+
        '<input data-at="'+i+'" value="'+esc(x&&x.t||'')+'"'+(editable?'':' disabled')+
        ' placeholder="예: AG-ENT 미팅 회의록 1부.">'+
        (editable?'<button class="del" data-atdel="'+i+'" aria-label="붙임 삭제">×</button>':'')+'</div>';
    }).join('');
    return '<section class="card"><h2>붙임</h2>'+
      (rows||'<p class="hint" style="margin:0 0 10px">붙임이 없으면 본문 끝에 <b>끝.</b>만 붙습니다.</p>')+
      (editable?'<div class="actions" style="margin-top:10px"><button class="btn sm" id="atAdd">+ 붙임 추가</button></div>':'')+
      '<p class="hint" style="margin-top:10px">문서 끝에 <b>붙임  OOO 1부.　끝.</b> 으로 들어갑니다. 아래에서 파일을 올리면 한 줄이 저절로 생깁니다.</p>'+
    '</section>';
  }

  /* ─── 접는 카드 ───
     한 화면에 카드가 아홉 개씩 쌓이면 아래쪽은 아무도 안 본다. 자주 안
     건드리는 건 접어 두고, 접었을 때도 안에 뭐가 들었는지 한 줄로 보여준다.
     접힌 채로 비어 있으면 안 채운 줄도 모르고 올리게 된다.

     <details> 를 안 쓰고 직접 다룬다. 글자를 칠 때마다 화면을 다시 그리는데
     그때 브라우저가 열림 상태를 되돌려 버린다. */
  function folded(k,defOpen){
    var v=S.fold[k];
    return (v===undefined) ? !defOpen : !v;
  }
  function foldCard(k,title,body,opt){
    opt=opt||{};
    var off=folded(k,opt.open!==false);
    return '<section class="card">'+
      '<h2 style="cursor:pointer;display:flex;align-items:center;gap:8px;margin-bottom:'+(off?'0':'14px')+'" data-fold="'+esc(k)+'">'+
        '<span style="display:inline-block;width:12px;transition:transform .12s;transform:rotate('+(off?'0':'90')+'deg);color:var(--muted)">▸</span>'+
        '<span>'+title+'</span>'+
        (opt.badge?'<span style="font-weight:400;font-size:12.5px;color:var(--muted)">'+opt.badge+'</span>':'')+
        '<span style="flex:1"></span>'+
        (off&&opt.sum?'<span style="font-weight:400;font-size:12.5px;color:var(--muted)">'+opt.sum+'</span>':'')+
      '</h2>'+
      (off?'':body)+
    '</section>';
  }

  /* ─── 거래처 고르기 ───
     받는 사람·거래처를 매번 손으로 친다. 「사운드테크」와 「사운드테크 」가
     다른 곳이 되고, 계좌번호는 또 어딘가에서 찾아 옮겨 적는다.
     지금까지 적은 이름을 모아 내려준다. */
  function partyChoices(){
    var m={};
    Object.keys(S.docs).forEach(function(k){
      var d=S.docs[k]||{}; var n=String(d.payee||'').trim();
      if(n) m[n]=m[n]||{n:n, bank:d.payeeBank||'', acct:d.payeeAcct||'', c:0};
      if(n) m[n].c++;
    });
    Object.keys(S.ledger).forEach(function(k){
      var r=S.ledger[k]||{}; var n=String(r.party||'').trim();
      if(!n) return;
      m[n]=m[n]||{n:n, bank:'', acct:'', c:0}; m[n].c++;
    });
    peopleList().forEach(function(pp){
      var n=(pp.name||'').trim(); if(!n) return;
      m[n]=m[n]||{n:n, bank:'', acct:'', c:0};
      if(!m[n].bank&&pp.bank) m[n].bank=pp.bank;
      if(!m[n].acct&&pp.acct) m[n].acct=pp.acct;
    });
    return Object.keys(m).map(function(n){return m[n];})
      .sort(function(a,b){ return b.c-a.c || a.n.localeCompare(b.n,'ko'); });
  }
  function partyInfo(nm){
    nm=String(nm||'').trim(); if(!nm) return null;
    var hit=partyChoices().filter(function(x){ return x.n===nm; })[0];
    return hit||null;
  }
  function renderPartyList(){
    var dl=document.getElementById('parties'); if(!dl) return;
    var L=partyChoices();
    var key=L.map(function(x){return x.n;}).join('|');
    if(dl.getAttribute('data-k')===key) return;
    dl.setAttribute('data-k',key);
    dl.innerHTML=L.map(function(x){
      return '<option value="'+esc(x.n)+'">'+esc(x.bank?(x.bank+' '+(x.acct||'')):'')+'</option>';
    }).join('');
  }

  /* ─── 제목 자동 작성 ───
     「지출결의서」라는 제목이 목록에 열 줄 늘어서면 어느 게 어느 건지 모른다.
     적어둔 내용으로 만들어 준다. */
  function autoTitle(d){
    if(!d) return '';
    if(d.type==='expense'){
      var items=(d.items||[]).filter(function(it){return (it.name||'').trim();});
      var head=items.length?items[0].name.trim():'';
      var more=items.length>1?(' 외 '+(items.length-1)+'건'):'';
      var who=String(d.payee||'').trim();
      if(!head) return who?(who+' 지출'):'';
      return head+more+(who?(' · '+who):'');
    }
    var A=applySchema(d.type);
    if(A){
      if(d.type==='trip')     return [d.where,d.from&&(d.from+(d.to&&d.to!==d.from?('~'+d.to):''))].filter(Boolean).join(' · ');
      if(d.type==='purchase') return [d.item,d.vendor].filter(Boolean).join(' · ');
      if(d.type==='goods')    return [d.item,d.qty].filter(Boolean).join(' ');
      if(d.type==='general')  return String(d.why||'').trim().split(/\n/)[0].slice(0,30);
    }
    return '';
  }

  function fld(type,id,label,val,dis){
    return '<div class="field"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+type+'" value="'+esc(val==null?'':val)+'"'+(dis||'')+'></div>';
  }
  function docPreview(d){
    var ov=(d.ov||[]).filter(function(r){return (r.k||'').trim()||(r.v||'').trim();});
    return '<div class="doc">'+
      docHead('마이티블레싱')+'<hr>'+
      '<div class="to"><i>□</i><b>수 신</b><span>'+esc(d.to||'—')+'</span></div>'+
      '<div class="to"><i>□</i><b>참 조</b><span>'+esc(d.cc||'—')+'</span></div>'+
      '<div class="to"><i>□</i><b>제 목</b><span>'+esc(d.subject||'—')+'</span></div><hr class="thin">'+
      '<ol class="body">'+(d.paras||[]).map(function(p){return '<li>'+esc(p).replace(/\n/g,'<br>')+'</li>';}).join('')+'</ol>'+
      (ov.length?'<table class="ov">'+ov.map(function(r,i){
        return '<tr><th>'+(OV_LETTER[i]?OV_LETTER[i]+'. ':'')+esc(r.k)+'</th><td>'+esc(r.v).replace(/\n/g,'<br>')+'</td></tr>';
      }).join('')+'</table>':'')+
      attBlock(d)+
      '<div class="sign"><span class="nm">'+esc(d.signer||'')+(d.seal!==false?sealMark(d):'')+'</span></div>'+
      ((d.scope||'out')==='in'
        ? '<hr class="thin"><div class="issue"><b>시행</b><span>'+esc(d.no||'')+' ('+esc(d.date||'')+')</span></div>'
        : '<hr class="thin">'+
          '<div class="issue"><b>시행</b><span>'+esc(d.no||'')+' ('+esc(d.date||'')+')</span>'+
            '<b>우</b><span>'+esc(d.addr||'')+'</span>'+
            '<b>전화</b><span>'+esc(d.tel1||'')+(d.tel2?' · '+esc(d.tel2):'')+'</span>'+
            '<b>메일</b><span>'+esc(d.email||'')+'</span></div>')+
    '</div>';
  }
  /* 원본 공문은 본문 끝에 붙임 목록을 적고 그 뒤에 바로 '끝.'을 붙인다.
     붙임이 없으면 '끝.'만 오른쪽에 온다. */
  function attBlock(d){
    var L=(d.att||[]).map(function(x){return String(x&&x.t||'').trim();}).filter(Boolean);
    if(!L.length) return '<div class="end">끝.</div>';
    if(L.length===1)
      return '<div class="att"><b>붙임</b><span>'+esc(L[0])+'　　끝.</span></div>';
    return '<div class="att"><b>붙임</b><span>'+
      L.map(function(t,i){
        return (i+1)+'. '+esc(t)+(i===L.length-1?'　　끝.':'');
      }).join('<br>')+'</span></div>';
  }

  /* 직인은 최종 승인된 문서에만 찍힌다. 그 전에는 자리만 표시한다. */
  function sealMark(d){
    if(docStatus(d)!=='approved') return '<span class="seal">직인<br>위치</span>';
    if(S.seal) return '<img class="sealimg" src="'+esc(S.seal)+'" alt="직인">';
    return '<span class="seal">직인<br>미등록</span>';
  }

  var PDF_LIB=['https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',
               'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js'];

  function docFileName(d){
    var nm=[(d.no||'').replace(/[\\/:*?"<>|]/g,'-'), (d.subject||d.title||'문서')].filter(Boolean).join(' ');
    return nm.replace(/\s+/g,' ').trim();
  }
  function previewHTML(d){
    if(d.type==='expense') return expensePreview(d);
    if(isApply(d)) return applyPreview(d);
    return docPreview(d);
  }

  /* 인쇄창을 거치면 브라우저가 날짜·쪽번호·웹주소를 종이에 같이 찍는다.
     그건 CSS로 못 막고 사람마다 설정이 달라진다. 그래서 화면을 직접 찍어
     A4 PDF 파일로 만든다. 설정을 건드릴 일이 없고 파일 이름도 정해진다. */
  /* 로고와 직인은 data: 주소라도 붙자마자 바로 그려지지는 않는다.
     다 올라오기 전에 찍으면 빈 칸으로 나가거나 아예 크기를 못 잡는다. */
  function waitImages(el){
    var imgs=Array.prototype.slice.call(el.querySelectorAll('img'));
    return Promise.all(imgs.map(function(im){
      if(im.complete&&im.naturalWidth) return null;
      return new Promise(function(res){
        var go=function(){res();};
        im.addEventListener('load',go,{once:true});
        im.addEventListener('error',go,{once:true});
        setTimeout(go,2500);
      });
    }));
  }
  function savePdf(d,btn){
    var root=document.getElementById('printroot'); if(!root)return;
    var label=btn?btn.textContent:'';
    if(btn){ btn.disabled=true; btn.textContent='만드는 중…'; }
    var done=function(){
      root.className=''; root.innerHTML='';
      if(btn){ btn.disabled=false; btn.textContent=label; }
    };
    root.innerHTML=previewHTML(d);
    root.className='cap';
    loadScript(PDF_LIB[0])
      .then(function(){ return loadScript(PDF_LIB[1]); })
      .then(function(){ return waitImages(root); })
      .then(function(){
        var w=root.offsetWidth||780, h=root.offsetHeight||0;
        if(!h) throw new Error('문서 높이를 잡지 못했습니다');
        /* 너무 긴 문서는 캔버스 한도에 걸린다. 그만큼 배율을 낮춘다. */
        var sc=Math.min(2, 32000/Math.max(1,h));
        return window.html2canvas(root,{scale:sc, backgroundColor:'#ffffff', useCORS:true,
          logging:false, width:w, height:h, windowWidth:w, scrollX:0, scrollY:0});
      })
      .then(function(cv){
        if(!cv||!cv.width||!cv.height) throw new Error('화면을 그려내지 못했습니다');
        var JS=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
        if(!JS) throw new Error('jsPDF를 불러오지 못했습니다');
        var pdf=new JS({unit:'mm',format:'a4',orientation:'p'});
        var PW=210, PH=297, M=16, iw=PW-M*2, ph=PH-M*2;
        /* 한 장짜리 그림을 음수 좌표로 밀어 넣는 대신, 장마다 그만큼만 잘라 넣는다.
           좌표가 음수로 가면 jsPDF 가 변환 행렬을 못 만들고 멈춘다. */
        var sliceH=Math.max(1, Math.floor(cv.width*ph/iw));
        var pages=Math.max(1, Math.ceil(cv.height/sliceH));
        var tmp=document.createElement('canvas'), ctx=tmp.getContext('2d');
        tmp.width=cv.width;
        for(var i=0;i<pages;i++){
          var y=i*sliceH, hh=Math.min(sliceH, cv.height-y);
          if(hh<=0) break;
          tmp.height=hh;
          ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,tmp.width,hh);
          ctx.drawImage(cv, 0,y,cv.width,hh, 0,0,cv.width,hh);
          var mm=hh*iw/cv.width;
          if(!isFinite(mm)||mm<=0) break;
          if(i) pdf.addPage();
          pdf.addImage(tmp.toDataURL('image/jpeg',0.92),'JPEG',M,M,iw,mm);
        }
        pdf.save(docFileName(d)+'.pdf');
        flash('PDF를 내려받았습니다');
        done();
      })
      .catch(function(e){
        errbar('PDF를 만들지 못했습니다 ('+(e&&e.message||e)+'). 대신 인쇄를 눌러 PDF로 저장해 주세요.');
        done();
      });
  }

  /* 브라우저 인쇄창을 열어 PDF로 저장하게 한다. 화면의 다른 요소는 숨기고
     공문 한 장만 A4에 올린다. 제목을 바꿔 두면 저장될 파일 이름이 된다. */
  function printDoc(d){
    var root=document.getElementById('printroot'); if(!root)return;
    root.innerHTML=previewHTML(d);
    var oldTitle=document.title;
    document.title=docFileName(d);
    document.body.classList.add('printing');
    var done=function(){
      document.body.classList.remove('printing');
      root.innerHTML=''; document.title=oldTitle;
      window.removeEventListener('afterprint',done);
    };
    window.addEventListener('afterprint',done);
    setTimeout(function(){ try{window.print();}catch(e){errbar('인쇄창을 열지 못했습니다');done();} setTimeout(done,1500); },80);
  }

  /* 원본 공문의 머리: 왼쪽에 로고, 가운데에 큰 기관명. */
  function docHead(title){
    return '<div class="dhead">'+
      '<img class="lg" src="'+esc(S.logo||LOGO_FALLBACK)+'" alt="마이티블레싱" onerror="this.style.display=\'none\'">'+
      '<span class="org">'+esc(title)+'</span></div>';
  }

  function docSteps(d){
    var st=docStatus(d), cur=currentStep(d);
    if(!(d.steps||[]).length) return '<div class="empty" style="padding:20px 8px">결재선이 지정되지 않았습니다.</div>';
    return '<div class="steps">'+d.steps.map(function(s,i){
      var cls=s.state==='approved'?' done':s.state==='rejected'?' bad':(i===cur&&st!=='draft'?' now':'');
      var msg=s.state==='approved'?('승인 · '+shortTime(s.at)):s.state==='rejected'?('반려 · '+shortTime(s.at)):(i===cur&&st!=='draft'?'결재 대기 중':'대기');
      return '<div class="step'+cls+'"><span class="dot">'+(s.state==='approved'?'✓':s.state==='rejected'?'✕':(i+1))+'</span>'+
        '<span><span class="t">'+esc(nameOf(s.uid))+'</span><br><span class="m">'+msg+(s.comment?' — '+esc(s.comment):'')+'</span></span></div>';
    }).join('')+'</div>';
  }
  function lineSearch(q){
    if(!S.user||!S.user.search)return;
    S.user.search(q).then(function(hits){
      var el=$('#lnResults'); if(!el)return;
      var d=S.docs[S.docSel]||{}; var have=(d.steps||[]).map(function(s){return s.uid;});
      el.innerHTML=hits.filter(function(h){return have.indexOf(h.id)<0;}).map(function(h){
        S.profiles[h.id]=h;
        return '<div class="person"><img src="'+esc(avatarOf(h.id))+'" alt=""><span class="nm">'+esc(h.name)+'</span>'+
          '<button class="btn sm" data-lnadd="'+esc(h.id)+'">추가</button></div>';
      }).join('');
    });
  }

  /* ---- 인력 (지급 대상자) ----
     정산표의 사람이 지금까지 '이름 글자'였다. "김민수"와 "김민수 "가 다른 사람이 되고,
     그러면 한 사람에게 여러 번 지급된 걸 합쳐서 신고할 수가 없다.
     여기 한 번 등록해 두고, 정산표는 그 사람을 가리키기만 한다.
     로그인하는 구성원(members)과는 다른 명부다 — 외부 스태프는 로그인하지 않는다. */
  function peopleList(){
    return Object.keys(S.people).map(function(k){ var o=clone(S.people[k]); o.id=k; return o; })
      .sort(function(a,b){ return (a.name||'').localeCompare(b.name||'','ko'); });
  }
  function personName(pid){ var p=S.people[pid]; return (p&&p.name)||''; }
  function memberName(uid){
    var m=S.members[uid]||{};
    return String(m.name||m.email||'').trim();
  }
  /* 명부에 아직 없는 구성원. 로그인만 하고 한 번도 정산에 안 들어간 사람들이다. */
  function membersNotInPeople(){
    var have={};
    peopleList().forEach(function(p){
      if(p.uid) have[p.uid]=1;
      var n=(p.name||'').trim(); if(n) have['n:'+n]=1;
    });
    return Object.keys(S.members).filter(function(u){
      var n=memberName(u);
      return n && !have[u] && !have['n:'+n];
    }).map(function(u){ return {uid:u, name:memberName(u), email:(S.members[u]||{}).email||''}; })
     .sort(function(a,b){ return a.name.localeCompare(b.name,'ko'); });
  }
  /* 이름칸에 내려올 목록. 명부가 먼저, 그 뒤에 아직 명부에 없는 구성원. */
  function nameChoices(){
    var seen={}, out=[];
    peopleList().forEach(function(p){
      var n=(p.name||'').trim(); if(!n||seen[n])return; seen[n]=1;
      out.push({n:n, hint:p.taxRole||(p.uid?'구성원':'명부')});
    });
    membersNotInPeople().forEach(function(m){
      if(seen[m.name])return; seen[m.name]=1;
      out.push({n:m.name, hint:m.email||'구성원', uid:m.uid});
    });
    return out;
  }
  function memberByName(nm){
    nm=String(nm||'').trim(); if(!nm) return null;
    var hit=membersNotInPeople().filter(function(m){ return m.name===nm; });
    return hit.length===1?hit[0]:null;
  }
  /* 구성원을 정산표에서 처음 고르면 명부에 한 줄을 만들어 둔다.
     같은 이름을 연달아 치는 동안 두 번 만들지 않게 이름으로 잠근다. */
  var makingPerson={};
  function ensurePersonForMember(m,done){
    if(!m||!S.db) return done&&done(null);
    if(makingPerson[m.name]) return done&&done(null);
    makingPerson[m.name]=1;
    savePerson(null,{name:m.name, uid:m.uid, phone:'', email:m.email||'',
                     bank:'', acct:'', taxRole:'', note:''})
      .then(function(id){ delete makingPerson[m.name]; done&&done(id); })
      .catch(function(){ delete makingPerson[m.name]; done&&done(null); });
  }
  /* 같은 이름이 둘이면 누구인지 알 수 없다. 그럴 땐 사람이 직접 고르게 둔다. */
  /* 명부에서 지워진 사람을 가리키는 pid 는 없는 것으로 친다.
     안 그러면 이름은 정산표에 남아 있는데 아무 데서도 안 잡혀서,
     그 사람이 받은 돈이 통째로 사라진 것처럼 보인다. */
  function livePid(pid){ return (pid && S.people[pid]) ? pid : ''; }

  function personByName(nm){
    nm=String(nm||'').trim(); if(!nm) return null;
    var hit=peopleList().filter(function(p){ return (p.name||'').trim()===nm; });
    return hit.length===1?hit[0]:null;
  }
  function dupNames(){
    var c={}, out={};
    peopleList().forEach(function(p){
      var n=(p.name||'').trim(); if(!n)return;
      c[n]=(c[n]||0)+1; if(c[n]>1) out[n]=c[n];
    });
    return out;
  }
  /* 아직 사람에 연결되지 않은 이름들. 과거 정산표가 여기 걸린다. */
  function unlinkedNames(){
    var m={};
    Object.keys(S.events).forEach(function(k){
      (S.events[k].members||[]).forEach(function(x){
        var n=String(x&&x.n||'').trim();
        if(!n||livePid(x.pid)) return;
        if(personByName(n)) return;      /* 이름이 이미 명부에 있으면 연결만 하면 된다 */
        m[n]=(m[n]||0)+1;
      });
    });
    return Object.keys(m).sort(function(a,b){return a.localeCompare(b,'ko');})
      .map(function(n){ return {n:n, c:m[n]}; });
  }
  /* 명부에서 지워진 사람을 아직 가리키고 있는 정산표 줄.
     이름은 줄에 남아 있으니 돈 기록이 날아간 건 아니다. 길만 끊겼다. */
  function orphanRows(){
    var m={};
    Object.keys(S.events).forEach(function(k){
      var ev=S.events[k];
      (ev.members||[]).forEach(function(x){
        if(!x||!x.pid||livePid(x.pid)) return;
        var n=String(x.n||'').trim()||'(이름 없음)';
        if(!m[n]) m[n]={n:n, c:0, evs:{}, fix:personByName(n)};
        m[n].c++; m[n].evs[ev.name||'(이름 없음)']=1;
      });
    });
    return Object.keys(m).sort(function(a,b){return a.localeCompare(b,'ko');})
      .map(function(n){ var o=m[n]; o.evList=Object.keys(o.evs); return o; });
  }

  /* 끊긴 줄을 다시 이어 붙인다. 같은 이름이 명부에 있으면 그리로,
     없으면 명부에 한 줄 만들고 나서 잇는다. */
  function fixOrphans(){
    if(!S.db||S.linking) return;
    var L=orphanRows(); if(!L.length) return;
    S.linking=true; render();
    var need=L.filter(function(o){ return !o.fix; });
    var seq=Promise.resolve();
    need.forEach(function(o){
      seq=seq.then(function(){
        return savePerson(null,{name:o.n,phone:'',bank:'',acct:'',taxRole:'',note:''});
      }).catch(function(){});
    });
    seq.then(function(){
      S.linking=false;
      flash(need.length?(need.length+'명을 명부에 다시 올렸습니다. 이어 붙입니다.')
                       :'명부에 있는 이름으로 이어 붙입니다.');
      /* 구독이 새 사람을 내려줄 틈을 준다 */
      setTimeout(function(){ relinkOrphans(); }, 900);
    });
  }
  /* 끊긴 pid 를 지우고 이름으로 다시 잇는다. linkAll 이 pid 없는 줄만 보기 때문에
     먼저 끊긴 pid 를 비워줘야 한다. */
  function relinkOrphans(){
    if(!S.db||S.linking) return;
    S.linking=true; render();
    var jobs=[], n=0;
    Object.keys(S.events).forEach(function(k){
      var ev=clone(S.events[k]), hit=false;
      (ev.members||[]).forEach(function(x){
        if(!x||!x.pid||livePid(x.pid)) return;
        var pp=personByName(String(x.n||'').trim());
        if(pp){ x.pid=pp.id; x.n=pp.name; } else { x.pid=''; }
        hit=true; n++;
      });
      if(!hit) return;
      delete ev.id; ev.updatedAt=nowISO();
      jobs.push({k:k, body:ev});
    });
    var seq=Promise.resolve();
    jobs.forEach(function(j){
      seq=seq.then(function(){ return S.db.doc('events/'+j.k).set(j.body); }).catch(function(){});
    });
    seq.then(function(){
      S.linking=false;
      flash(n?('끊겨 있던 '+n+'줄을 이어 붙였습니다'):'이어 붙일 것이 없습니다');
      render();
    });
  }

  /* 「최현영」과 「현영」처럼 한쪽이 다른 쪽 이름으로 끝나면 같은 사람일 때가 많다.
     동명이인이 없다는 전제이니, 찾아만 주고 합칠지는 사람이 고른다. */
  function sameLooking(){
    var L=peopleList(), out=[], seen={};
    for(var i=0;i<L.length;i++) for(var j=0;j<L.length;j++){
      if(i===j) continue;
      var a=L[i], b=L[j];
      var na=(a.name||'').trim(), nb=(b.name||'').trim();
      if(!na||!nb) continue;
      var same = (na===nb && i<j) ||
                 (na!==nb && na.length>nb.length && nb.length>=2 && na.slice(-nb.length)===nb);
      if(!same) continue;
      /* 긴 이름(성까지 있는 쪽)을 남길 쪽으로 둔다 */
      var keep = na.length>=nb.length ? a : b, drop = keep===a ? b : a;
      var k=keep.id+'<'+drop.id;
      if(seen[k]||seen[drop.id+'<'+keep.id]) continue;
      seen[k]=1;
      out.push({keep:keep, drop:drop,
                keepN:usedCount(keep.id,(keep.name||'').trim()),
                dropN:usedCount(drop.id,(drop.name||'').trim())});
    }
    return out;
  }

  /* 두 사람을 하나로. 정산표의 이름줄을 전부 남길 쪽으로 옮기고 나서 지운다.
     순서가 중요하다. 먼저 지우면 옮길 곳을 잃는다. */
  function mergePeople(dropId, keepId){
    if(!S.db||S.merging) return;
    if(!dropId||!keepId||dropId===keepId) return errbar('합칠 두 사람을 고르세요');
    var dp=S.people[dropId], kp=S.people[keepId];
    if(!dp||!kp) return errbar('명부에서 찾을 수 없습니다');
    var dn=(dp.name||'').trim(), kn=(kp.name||'').trim();
    S.merging=true; render();

    /* 1. 정산표를 전부 떠낸 뒤에 쓴다. 한 건씩 쓰면 저장소가 구독자를 깨워
       S.events 가 통째로 갈리고, 아직 안 쓴 행사는 되돌아가 버린다. */
    var jobs=[], moved=0;
    Object.keys(S.events).forEach(function(k){
      var ev=clone(S.events[k]), hit=false;
      (ev.members||[]).forEach(function(x){
        var isDrop = (x.pid===dropId) || (!livePid(x.pid) && String(x.n||'').trim()===dn);
        if(!isDrop) return;
        x.pid=keepId; x.n=kn; hit=true; moved++;
      });
      if(!hit) return;
      delete ev.id; ev.updatedAt=nowISO();
      jobs.push({k:k, body:ev});
    });

    /* 2. 남길 쪽에 비어 있는 칸은 지울 쪽에서 가져온다. 계좌번호를 잃으면 안 된다. */
    var patch=clone(kp), need=false;
    ['phone','taxRole','bank','acct','note','uid','email'].forEach(function(f){
      if(!patch[f] && dp[f]){ patch[f]=dp[f]; need=true; }
    });

    var seq=Promise.resolve();
    jobs.forEach(function(j){
      seq=seq.then(function(){ return S.db.doc('events/'+j.k).set(j.body); });
    });
    if(need) seq=seq.then(function(){ patch.updatedAt=nowISO(); return S.db.doc('people/'+keepId).set(patch); });
    seq.then(function(){ return S.db.doc('people/'+dropId).delete(); })
       .then(function(){
         S.merging=false; S.mergeFrom=null; S.mergeTo='';
         flash(dn+' 을(를) '+kn+' 으로 합쳤습니다 · 정산표 '+moved+'줄을 옮겼습니다');
         render();
       })
       .catch(function(e){ S.merging=false; errbar('합치기 실패 '+(e&&(e.code||e.message)||'')); render(); });
  }

  function usedCount(pid,nm){
    var c=0;
    Object.keys(S.events).forEach(function(k){
      (S.events[k].members||[]).forEach(function(x){
        if(livePid(x.pid)===pid || (!livePid(x.pid) && String(x.n||'').trim()===nm)) c++;
      });
    });
    return c;
  }
  /* ─────────── 회계장부 ───────────
     거래 한 줄은 이렇게 생겼다.
       on    날짜 (통장에 찍힌 날)
       dir   'in' 들어옴 · 'out' 나감 · 'move' 통장끼리 이동
       amt   금액. 늘 양수로 담는다.
       bank  계좌. move 면 '보낸' 통장
       to    move 일 때만 — '받은' 통장
       biz   사업명 · item 세부항목 · party 거래처 · memo 사용내역
       way   결제수단 · payer 대신 낸 사람 · note 비고

     시트에서는 환급·취소를 금액 마이너스로 적으시는데, 그러면 잔액이
     꼬인다. 여기서는 방향을 뒤집어 받는다 — 출금에 -298,000 을 넣으면
     입금 298,000 으로 들어간다. 보이는 숫자는 같고 잔액만 맞아진다. */
  /* 장부를 쓸 수 있는 사람. 지급 처리를 하는 건 회계인데 고치는 건
     관리자만 되면, 잘못 들어간 줄을 정작 적은 사람이 못 고친다. */
  function ledEditable(){ return myRole()==='accounting'||S.me.canEdit; }

  function bankList(){
    return Object.keys(S.banks).map(function(k){
      var b=clone(S.banks[k]); b.id=k; return b;
    }).sort(function(a,b){ return (a.ord||0)-(b.ord||0) || (a.name||'').localeCompare(b.name||''); });
  }
  function bankName(id){ var b=S.banks[id]; return b?(b.name||''):''; }

  function ledList(){
    return Object.keys(S.ledger).map(function(k){
      var r=clone(S.ledger[k]); r.id=k; return r;
    }).sort(function(a,b){
      return String(b.on||'').localeCompare(String(a.on||'')) ||
             String(b.createdAt||'').localeCompare(String(a.createdAt||''));
    });
  }
  /* 그 통장의 잔액. 이월금액에서 시작해 그 날짜까지 더한다.
     upto 를 안 주면 전부 더한다. */
  function bankBal(id,upto){
    var b=S.banks[id]; if(!b) return 0;
    var bal=num(b.open,0);
    Object.keys(S.ledger).forEach(function(k){
      var r=S.ledger[k]||{}, on=String(r.on||'');
      if(!on) return;
      if(upto&&on>upto) return;
      if(b.openOn&&on<String(b.openOn)) return;   /* 이월 시점 이전은 안 센다 */
      var a=num(r.amt,0);
      if(r.dir==='move'){
        if(r.bank===id) bal-=a;
        if(r.to===id)   bal+=a;
      } else if(r.bank===id){
        bal+=(r.dir==='in'?a:-a);
      }
    });
    return bal;
  }
  /* 거르기. 이동은 수입·지출이 아니므로 집계에서는 따로 뺀다. */
  function ledRows(){
    var L=ledList();
    if(S.ledMonth) L=L.filter(function(r){ return String(r.on||'').slice(0,7)===S.ledMonth; });
    if(S.ledBank)  L=L.filter(function(r){ return r.bank===S.ledBank||r.to===S.ledBank; });
    if(S.ledBiz)   L=L.filter(function(r){ return r.biz===S.ledBiz; });
    return L;
  }
  function ledMonths(){
    var m={};
    Object.keys(S.ledger).forEach(function(k){
      var on=String((S.ledger[k]||{}).on||''); if(on) m[on.slice(0,7)]=1;
    });
    return Object.keys(m).sort().reverse();
  }
  function saveBank(id,body){
    if(!S.db||!ledEditable()) return Promise.resolve();
    var ref=id?S.db.doc('banks/'+id):S.db.collection('banks').doc();
    body.updatedAt=nowISO(); if(!id) body.createdAt=nowISO();
    return ref.set(body);
  }
  function saveLed(id,body){
    if(!S.db) return Promise.resolve();
    var ref=id?S.db.doc('ledger/'+id):S.db.collection('ledger').doc();
    body.updatedAt=nowISO(); body.by=S.me.id||'';
    if(id){
      /* set 은 문서를 통째로 갈아 끼운다. 손으로 고친다고 해서 이 줄이
         어디서 왔는지(src)까지 지우면 안 된다. 지우면 같은 문서를 다시
         처리할 때 줄이 둘로 늘고, 「정산에서 자동」 표시도 사라진다. */
      var old=S.ledger[id]||{};
      if(old.src&&!body.src) body.src=old.src;
      body.createdAt=old.createdAt||nowISO();
    } else {
      body.createdAt=nowISO();
    }
    return ref.set(body);
  }

  function savePerson(id,body){
    if(!S.db) return Promise.resolve();
    var ref=id?S.db.doc('people/'+id):S.db.collection('people').doc();
    body.updatedAt=nowISO(); if(!id) body.createdAt=nowISO();
    return ref.set(body).then(function(){ return ref.id; });
  }
  /* 명부에 있는 이름과 정산표의 이름을 이어 붙인다.
     미루면 행사를 치를 때마다 이어 붙일 양이 늘어난다. */
  function linkAll(){
    if(!S.db||S.linking)return;
    S.linking=true; render();
    /* 고칠 내용을 먼저 전부 떠낸 다음에 쓴다.
       한 건을 쓸 때마다 저장소가 구독자를 깨우고, 그러면 S.events 가
       저장된 내용으로 통째로 갈린다. 메모리에서 고쳐만 두고 아직 안 쓴
       행사들은 그때 되돌아가 버린다. 첫 행사만 이어 붙던 이유다. */
    var jobs=[];
    Object.keys(S.events).forEach(function(k){
      var ev=clone(S.events[k]), hit=false;
      (ev.members||[]).forEach(function(x){
        if(livePid(x.pid)) return;
        var pp=personByName(x.n);
        if(pp){ x.pid=pp.id; x.n=pp.name; hit=true; }
      });
      if(!hit) return;
      delete ev.id; ev.updatedAt=nowISO();
      jobs.push({k:k, body:ev});
    });
    var seq=Promise.resolve(), done=0;
    jobs.forEach(function(j){
      seq=seq.then(function(){
        return S.db.doc('events/'+j.k).set(j.body).then(function(){ done++; });
      }).catch(function(){});
    });
    seq.then(function(){
      S.linking=false;
      flash(done?(done+'개 행사의 이름을 명부에 이어 붙였습니다'):'이어 붙일 것이 없습니다');
      render();
    });
  }
  /* 미등록 이름을 한 번에 명부로 올린다. 올린 뒤 바로 이어 붙인다. */
  /* 로그인한 구성원을 한 번에 명부로 올린다. */
  function registerMembers(){
    if(!S.db||S.linking)return;
    var list=membersNotInPeople(); if(!list.length)return;
    S.linking=true; render();
    var seq=Promise.resolve();
    list.forEach(function(m){
      seq=seq.then(function(){
        return savePerson(null,{name:m.name, uid:m.uid, email:m.email||'',
                                phone:'', bank:'', acct:'', taxRole:'', note:''});
      }).catch(function(){});
    });
    seq.then(function(){
      S.linking=false;
      flash(list.length+'명을 명부에 올렸습니다');
      setTimeout(linkAll,900);
    });
  }
  function registerAll(){
    if(!S.db||S.linking)return;
    var list=unlinkedNames(); if(!list.length)return;
    S.linking=true; render();
    var seq=Promise.resolve();
    list.forEach(function(x){
      seq=seq.then(function(){
        return savePerson(null,{name:x.n,phone:'',bank:'',acct:'',taxRole:'',note:''});
      }).catch(function(){});
    });
    seq.then(function(){
      S.linking=false;
      flash(list.length+'명을 명부에 올렸습니다. 이어 붙입니다.');
      /* 구독이 새 사람을 내려줄 틈을 준다 */
      setTimeout(linkAll,900);
    });
  }
  function removePerson(id){
    if(!S.db)return;
    /* 정산표에 걸려 있는 사람을 그냥 지우면 그 사람이 받은 돈이
       아무 데서도 안 잡힌다. 「현영」을 지웠더니 월급 내역이
       사라졌던 게 이것이다. 합치기로 보내야 한다. */
    var pr=S.people[id]||{};
    var n=usedCount(id,(pr.name||'').trim());
    if(n){
      S.personDel=null; S.mergeFrom=id; S.mergeTo=''; render();
      return errbar((pr.name||'이 사람')+' 은(는) 정산표 '+n+'줄에 걸려 있어 그냥 지울 수 없습니다. '+
        '같은 사람이 둘로 갈린 거라면 아래에서 합쳐주세요.');
    }
    S.db.doc('people/'+id).delete()
      .then(function(){ S.personDel=null; flash('명부에서 지웠습니다'); render(); })
      .catch(function(e){ errbar('삭제 실패 '+(e&&e.code||'')); });
  }

  var TAX_HINT=['미디어크리에이터','행사도우미','강사','공연출연','기타'];

  /* 구분(출금·입금·이동)을 바꾸면 칸 생김새가 달라진다.
     다시 그리기 전에 적던 내용을 떠서 들고 넘어간다. */
  function ledDirChanged(dir){
    var g=function(id){ var e=$('#'+id); return e?e.value:''; };
    var d=(S.ledEdit&&S.ledEdit!=='new')?clone(S.ledger[S.ledEdit]||{}):{};
    if(S.ledDraft) d=S.ledDraft;
    d.dir=dir; d.on=g('ldOn')||d.on; d.amt=num(g('ldAmt'),0)||d.amt;
    d.bank=g('ldBank')||d.bank; d.memo=g('ldMemo'); d.note=g('ldNote');
    if(dir==='move'){ d.to=g('ldTo')||d.to; }
    else { d.biz=g('ldBiz')||d.biz; d.item=g('ldItem')||d.item;
           d.party=g('ldParty')||d.party; d.way=g('ldWay')||d.way; d.payer=g('ldPayer')||d.payer; }
    S.ledDraft=d; pickRender('ldDir');
  }

  /* ─── 자동 전표 ───
     돈이 나갔다고 기록하는 순간 장부에도 한 줄 꽂는다. 안 그러면
     같은 일을 두 번 적게 되고, 둘 중 하나는 반드시 빠진다.

     src 로 어디서 온 전표인지 적어둔다. 같은 문서를 두 번 처리해도
     줄이 둘로 늘지 않는다 — 있으면 고쳐 쓴다. */
  function ledBySrc(src){
    var hit=null;
    Object.keys(S.ledger).forEach(function(k){
      if((S.ledger[k]||{}).src===src) hit=k;
    });
    return hit;
  }
  function postLed(src,body){
    if(!S.db) return Promise.resolve();
    body.src=src;
    var old=ledBySrc(src);
    return saveLed(old,body);
  }
  /* 지급 처리 화면에 붙이는 통장 고르개. 통장이 없으면 안 보인다. */
  function bankPick(id){
    var L=bankList(); if(!L.length) return '';
    return '<div class="field"><label for="'+id+'">나간 통장</label>'+
      '<select id="'+id+'"><option value="">— 장부에 안 넣음 —</option>'+
      L.map(function(b){
        return '<option value="'+esc(b.id)+'"'+(S.payBank===b.id?' selected':'')+'>'+esc(b.name)+'</option>';
      }).join('')+'</select></div>';
  }

  /* ─── 행사 수입 ───
     한 행사에 돈이 한 번에 들어오는 일은 드물다. 계약금 받고 끝나고
     잔금 받는다. 그래서 여러 건으로 받고 각각 장부에 꽂는다.

     수입 금액(ev.rev)은 '받기로 한 돈'이고 여기 쌓이는 건 '실제로
     들어온 돈'이다. 둘의 차이가 미수금이다. */
  /* 장부에 매달 수 있는 행사. 최근 것부터. */
  function evChoices(){
    return Object.keys(S.events).map(function(k){
      var e=clone(S.events[k]); e.id=k; return e;
    }).sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); });
  }

  function rcvList(ev){
    var L=(ev&&ev.rcvs)||[];
    return L.slice().sort(function(a,b){ return String(a.on||'').localeCompare(String(b.on||'')); });
  }
  function rcvTotal(ev){
    return rcvList(ev).reduce(function(a,r){ return a+num(r.amt,0); },0);
  }
  /* 받기로 한 돈. 직접 입력 방식이면 알 수 없으니 0 으로 둔다. */
  function revPlanned(ev){ return ev&&ev.mode==='calc'?num(ev.rev,0):0; }
  function rcvDue(ev){
    var plan=revPlanned(ev); if(!plan) return 0;
    return plan-rcvTotal(ev);
  }
  function addRcv(ev){
    if(!S.db||!ev) return;
    var on=String(S.rcvOn||'').slice(0,10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(on)) return errbar('받은 날짜를 넣어주세요');
    var amt=num(S.rcvAmt,0);
    if(amt<=0) return errbar('받은 금액을 넣어주세요');
    var rid='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    var row={id:rid,on:on,amt:amt,bank:S.rcvBank||'',memo:(S.rcvMemo||'').trim(),by:S.me.id||'',at:nowISO()};
    var next=((ev.rcvs)||[]).concat([row]);
    S.db.doc('events/'+ev.id).update({rcvs:next,updatedAt:nowISO()}).then(function(){
      S.rcvOpen=false; S.rcvOn=''; S.rcvAmt=''; S.rcvMemo='';
      if(!row.bank){ flash('받은 수입을 적었습니다'); return render(); }
      return postLed('rev:'+ev.id+':'+rid,{
        on:on, dir:'in', amt:amt, bank:row.bank,
        ev:ev.id,
        biz:'다. 예배운영', item:'행사 수입',
        party:(ev.name||'').slice(0,40),
        memo:(ev.name||'행사')+' 수입'+(row.memo?' · '+row.memo:''),
        way:'계좌이체'
      }).then(function(){ flash(won(amt)+' 받음 · 장부에 넣었습니다'); render(); });
    }).catch(function(e){ errbar('저장 실패 '+(e&&e.code||'')); });
  }
  function delRcv(ev,rid){
    if(!S.db||!ev) return;
    var next=((ev.rcvs)||[]).filter(function(r){ return r.id!==rid; });
    S.db.doc('events/'+ev.id).update({rcvs:next,updatedAt:nowISO()}).then(function(){
      S.rcvDel=null;
      /* 장부 줄도 같이 지운다. 안 그러면 안 들어온 돈이 통장에 남는다. */
      var lid=ledBySrc('rev:'+ev.id+':'+rid);
      if(lid) return S.db.doc('ledger/'+lid).delete();
    }).then(function(){ flash('지웠습니다'); render(); })
     .catch(function(e){ errbar('삭제 실패 '+(e&&e.code||'')); });
  }

  function rcvPanel(ev,ro){
    var L=rcvList(ev), got=rcvTotal(ev), plan=revPlanned(ev), due=rcvDue(ev);
    var banks=bankList();

    var rows=L.map(function(r){
      return '<tr>'+
        '<td style="white-space:nowrap">'+esc(r.on||'')+'</td>'+
        '<td>'+esc(r.memo||'수입')+
          (r.bank?'<div style="font-size:12px;color:var(--muted)">'+esc(bankName(r.bank)||'')+'</div>'
                 :'<div style="font-size:12px;color:var(--zero)">장부에 안 넣음</div>')+'</td>'+
        '<td class="num" style="font-family:var(--font-num)">'+won(num(r.amt,0))+'</td>'+
        (ro?'':'<td style="width:96px">'+
          (S.rcvDel===r.id
            ? '<button class="btn danger sm" data-rcvyes="'+esc(r.id)+'">지움</button>'+
              '<button class="btn sm" id="rcvNo" style="margin-left:4px">취소</button>'
            : '<button class="del" data-rcvdel="'+esc(r.id)+'" aria-label="삭제">×</button>')+
        '</td>')+
      '</tr>';
    }).join('');

    var form='';
    if(!ro&&S.rcvOpen){
      form='<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px">'+
        '<div class="row3">'+
          '<div class="field"><label for="rcvOn">받은 날</label>'+
            '<input id="rcvOn" type="date" value="'+esc(S.rcvOn||today())+'"></div>'+
          '<div class="field"><label for="rcvAmt">금액</label>'+
            '<input id="rcvAmt" type="number" value="'+esc(String(S.rcvAmt||''))+'"'+
            (due>0?' placeholder="남은 '+won(due).replace(/"/g,'')+'"':'')+'></div>'+
          '<div class="field"><label for="rcvBank">들어온 통장</label>'+
            '<select id="rcvBank">'+
              (banks.length?'<option value="">— 장부에 안 넣음 —</option>':'<option value="">통장 없음</option>')+
              banks.map(function(b){
                return '<option value="'+esc(b.id)+'"'+(S.rcvBank===b.id?' selected':'')+'>'+esc(b.name)+'</option>';
              }).join('')+'</select></div>'+
        '</div>'+
        '<div class="field"><label for="rcvMemo">메모</label>'+
          '<input id="rcvMemo" value="'+esc(S.rcvMemo||'')+'" placeholder="예: 계약금 · 잔금"></div>'+
        '<div class="actions"><button class="btn primary sm" id="rcvSave">넣기</button>'+
          '<button class="btn sm" id="rcvCancel">취소</button></div>'+
      '</div>';
    }

    return '<section class="card"><h2>받은 수입'+
      (!ro&&!S.rcvOpen?' <button class="btn primary sm" id="rcvNew" style="float:right">수입 받음</button>':'')+'</h2>'+
      (L.length
        ? '<div class="scroll"><table><thead><tr><th>받은 날</th><th>내역</th><th class="num">금액</th>'+(ro?'':'<th></th>')+'</tr></thead>'+
          '<tbody>'+rows+
          '<tr><th>합계</th><th></th><th class="num" style="font-family:var(--font-num)">'+won(got)+'</th>'+(ro?'':'<th></th>')+'</tr>'+
          '</tbody></table></div>'
        : '<div class="empty" style="padding:18px 8px">아직 들어온 돈이 없습니다.</div>')+
      (plan
        ? '<div class="note '+(due>0?'n-warn':(due<0?'n-info':'n-ok'))+'" style="margin:12px 0 0">'+
            (due>0
              ? '<b>미수금 '+won(due)+'</b> — 받기로 한 '+won(plan)+' 중 '+won(got)+' 들어왔습니다.'
              : due<0
                ? '받기로 한 '+won(plan)+'보다 '+won(-due)+' 더 들어왔습니다. 수입 금액을 확인해 주세요.'
                : '받기로 한 '+won(plan)+'이 모두 들어왔습니다.')+
          '</div>'
        : '<p class="hint" style="margin-top:10px">「수입 − 운영비 − 세금」으로 바꾸시면 미수금도 같이 보여드립니다.</p>')+
      form+
    '</section>';
  }

  /* 사업을 「다. 예배운영」으로 바꾸면 행사 고르개가 나타난다.
     그때도 적던 내용은 들고 넘어간다. */
  function ledBizChanged(biz){
    var g=function(id){ var e=$('#'+id); return e?e.value:''; };
    var d=S.ledDraft||((S.ledEdit&&S.ledEdit!=='new')?clone(S.ledger[S.ledEdit]||{}):{});
    var was=d.biz;
    d.biz=biz; d.dir=g('ldDir')||d.dir; d.on=g('ldOn')||d.on; d.amt=num(g('ldAmt'),0)||d.amt;
    d.bank=g('ldBank')||d.bank; d.item=g('ldItem'); d.party=g('ldParty');
    d.memo=g('ldMemo'); d.note=g('ldNote'); d.way=g('ldWay')||d.way; d.payer=g('ldPayer');
    if(biz!=='다. 예배운영') d.ev='';
    S.ledDraft=d;
    /* 행사 칸이 생기거나 사라질 때만 다시 그린다 */
    if((was==='다. 예배운영')!==(biz==='다. 예배운영')) pickRender('ldBiz');
  }

  /* ─── 행사별 수지 ───
     손익보고서와 다른 점: 여기는 장부만 본다. 통장에 실제로 오간 돈이다.
     계약은 1,500만인데 500만만 들어왔으면 여기엔 500만으로 잡힌다.
     받기로 한 돈과의 차이는 미수금으로 따로 보여준다. */
  function evLedger(evId){
    var inn=0,out=0,fee=0,rows=[];
    Object.keys(S.ledger).forEach(function(k){
      var r=S.ledger[k]||{};
      if(r.ev!==evId) return;
      if(r.dir==='move') return;          /* 통장 사이 이동은 행사 돈이 아니다 */
      var a=num(r.amt,0);
      if(r.dir==='in') inn+=a;
      else { out+=a; if(r.item==='사례비') fee+=a; }
      var row=clone(r); row.id=k; rows.push(row);
    });
    rows.sort(function(a,b){ return String(a.on||'').localeCompare(String(b.on||'')); });
    return {inn:inn, out:out, fee:fee, other:out-fee, bal:inn-out, rows:rows, n:rows.length};
  }
  function evplRows(){
    return evChoices().map(function(e){
      var g=evLedger(e.id);
      g.e=e; g.plan=revPlanned(e); g.got=rcvTotal(e); g.due=rcvDue(e);
      return g;
    }).filter(function(g){
      /* 장부에 한 줄이라도 있거나, 받기로 한 돈이 있는 행사만 */
      return g.n>0 || g.plan>0;
    });
  }

  function renderEvPl(){
    var L=evplRows();
    var T=L.reduce(function(a,g){
      a.inn+=g.inn; a.out+=g.out; a.fee+=g.fee; a.bal+=g.bal; a.due+=Math.max(0,g.due); return a;
    },{inn:0,out:0,fee:0,bal:0,due:0});

    var sel=S.evplSel&&L.filter(function(g){return g.e.id===S.evplSel;})[0];

    var rows=L.map(function(g){
      var on=S.evplSel===g.e.id;
      return '<tr'+(on?' style="background:var(--accent-soft)"':'')+'>'+
        '<td><button class="linkbtn" data-evpl="'+esc(g.e.id)+'"><b>'+esc(g.e.name||'(이름 없음)')+'</b></button>'+
          (g.e.date?'<div style="font-size:12px;color:var(--muted)">'+esc(g.e.date)+'</div>':'')+'</td>'+
        '<td class="num" style="font-family:var(--font-num)">'+won(g.inn)+
          (g.due>0?'<div style="font-size:11.5px;color:var(--warn)">미수 '+won(g.due)+'</div>':'')+'</td>'+
        '<td class="num" style="font-family:var(--font-num)">'+won(g.fee)+'</td>'+
        '<td class="num" style="font-family:var(--font-num)">'+won(g.other)+'</td>'+
        '<td class="num" style="font-family:var(--font-num);font-weight:600'+
          (g.bal<0?';color:var(--bad)':'')+'">'+won(g.bal)+'</td>'+
      '</tr>';
    }).join('');

    var detail='';
    if(sel){
      detail='<section class="card"><h2>'+esc(sel.e.name||'행사')+' — 오간 돈'+
        ' <button class="btn sm" id="evplClose" style="float:right">닫기</button></h2>'+
        (sel.rows.length
          ? '<div class="scroll"><table><thead><tr><th>날짜</th><th>내역</th><th>통장</th><th class="num">금액</th></tr></thead><tbody>'+
            sel.rows.map(function(r){
              var a=num(r.amt,0), isIn=r.dir==='in';
              return '<tr><td style="white-space:nowrap">'+esc(r.on||'')+'</td>'+
                '<td>'+esc(r.memo||r.item||'')+
                  (r.item?'<div style="font-size:12px;color:var(--muted)">'+esc(r.item)+'</div>':'')+'</td>'+
                '<td style="color:var(--muted);font-size:12.5px">'+esc(bankName(r.bank)||'—')+'</td>'+
                '<td class="num" style="font-family:var(--font-num);white-space:nowrap;color:var('+
                  (isIn?'--accent-ink':'--bad')+')">'+(isIn?'+':'−')+won(a)+'</td></tr>';
            }).join('')+
            '<tr><th>남음</th><th></th><th></th><th class="num" style="font-family:var(--font-num)">'+won(sel.bal)+'</th></tr>'+
            '</tbody></table></div>'
          : '<div class="empty" style="padding:20px 8px">장부에 이 행사로 매단 줄이 없습니다.</div>')+
        (sel.due>0
          ? '<div class="note n-warn" style="margin:12px 0 0"><b>미수금 '+won(sel.due)+'</b> — '+
            '받기로 한 '+won(sel.plan)+' 중 '+won(sel.got)+'만 들어왔습니다. 들어오면 정산 화면에서 적어주세요.</div>'
          : '')+
      '</section>';
    }

    app.innerHTML=
      '<div class="stack">'+
      acctTabs()+
      '<div class="tiles">'+
        tile('들어온 돈', won(T.inn), L.length+'개 행사')+
        tile('사례비', won(T.fee), '지급 완료분')+
        tile('그 밖의 지출', won(T.out-T.fee), '지출결의서 등')+
        tile('남은 돈', won(T.bal), T.bal<0?'나간 돈이 더 많습니다':'', T.bal<0)+
        tile('미수금', won(T.due), T.due>0?'아직 안 들어왔습니다':'모두 들어왔습니다', T.due>0)+
      '</div>'+
      '<section class="card"><h2>행사별 수지</h2>'+
        (L.length
          ? '<div class="scroll"><table><thead><tr>'+
              '<th>행사</th><th class="num">들어옴</th><th class="num">사례비</th>'+
              '<th class="num">그 밖</th><th class="num">남음</th>'+
            '</tr></thead><tbody>'+rows+
            '<tr><th>합계</th>'+
              '<th class="num" style="font-family:var(--font-num)">'+won(T.inn)+'</th>'+
              '<th class="num" style="font-family:var(--font-num)">'+won(T.fee)+'</th>'+
              '<th class="num" style="font-family:var(--font-num)">'+won(T.out-T.fee)+'</th>'+
              '<th class="num" style="font-family:var(--font-num)">'+won(T.bal)+'</th></tr>'+
            '</tbody></table></div>'+
            '<p class="hint" style="margin-top:10px">행사 이름을 누르면 오간 돈을 하나씩 볼 수 있습니다. '+
              '<b>여기는 통장에 실제로 오간 돈만 셉니다.</b> 아직 안 들어온 돈은 미수금으로 따로 적어뒀습니다. '+
              '계약 기준 손익은 보고서 탭에 있습니다.</p>'
          : '<div class="empty" style="padding:24px 8px">아직 행사에 매달린 거래가 없습니다.<br>'+
            '정산에서 수입을 받거나 사례비를 지급하면 여기에 모입니다.</div>')+
      '</section>'+
      detail+
      '</div>';
  }

  /* ─── 대신결제 ───
     개인 돈으로 먼저 내고 나중에 회사가 돌려주는 돈이다.
     중요한 점: 개인이 낸 시점에는 회사 통장에서 한 푼도 안 나간다.
     그래서 장부에는 「돌려준 날」에, 「돌려준 통장」에서 나간 것으로 꽂는다.
     개인이 낸 날짜(on)는 무엇에 썼는지 알기 위해 따로 들고만 있는다. */
  function advList(){
    return Object.keys(S.adv).map(function(k){
      var o=clone(S.adv[k]); o.id=k; return o;
    }).sort(function(a,b){
      /* 아직 못 받은 게 위로, 그 다음은 낸 날짜 오래된 순 */
      var sa=(a.state==='done')?1:0, sb=(b.state==='done')?1:0;
      if(sa!==sb) return sa-sb;
      if(sa===1) return String(b.doneOn||'').localeCompare(String(a.doneOn||''));
      return String(a.on||'').localeCompare(String(b.on||''));
    });
  }
  function advOpen(){ return advList().filter(function(a){ return a.state!=='done'; }); }
  function advMine(){
    if(!S.me.id) return [];
    return advOpen().filter(function(a){ return a.uid===S.me.id; });
  }
  function advSum(L){ return L.reduce(function(x,a){ return x+num(a.amt,0); },0); }
  /* 올린 사람 본인, 아니면 회계·관리자 */
  function advOwn(a){ return !!(a&&(a.uid===S.me.id||ledEditable())); }
  function advName(a){
    if(!a) return '';
    return a.uid?(nameOf(a.uid)||a.name||''):(a.name||'');
  }

  function saveAdvForm(){
    var v=function(id){ var e=$('#'+id); return e?e.value:''; };
    var on=v('adOn');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(on)) return errbar('낸 날짜를 넣어주세요');
    var amt=num(v('adAmt'),0);
    if(amt<=0) return errbar('금액을 넣어주세요');
    var item=v('adItem').trim();
    if(!item) return errbar('무엇에 썼는지 적어주세요');

    var ed=S.advEdit, isNew=(ed==='new');
    var old=isNew?{}:(S.adv[ed]||{});
    var biz=v('adBiz');
    var body={
      on:on, amt:amt, item:item.slice(0,60),
      biz:biz, ev:(biz==='다. 예배운영')?(v('adEv')||(S.advDraft&&S.advDraft.ev)||''):'',
      way:v('adWay')||'개인카드', memo:v('adMemo').trim(),
      uid:old.uid||S.me.id||'', name:old.name||S.me.name||'',
      state:old.state||'open',
      createdAt:old.createdAt||nowISO(), updatedAt:nowISO()
    };
    /* 이미 돌려준 건은 정산 기록을 지우지 않는다 */
    if(old.state==='done'){ body.doneOn=old.doneOn; body.bank=old.bank; body.doneBy=old.doneBy; }

    if(!S.db) return;
    var ref=isNew?S.db.collection('adv').doc():S.db.doc('adv/'+ed);
    ref.set(body).then(function(){
      S.advEdit=null; S.advDraft=null;
      /* 이미 장부에 꽂힌 건을 고쳤으면 장부 줄도 따라가야 한다 */
      if(body.state==='done') return advPost(isNew?ref.id:ed, body);
    }).then(function(){ flash('저장했습니다'); render(); })
     .catch(function(e){ errbar('저장 실패 '+(e&&e.code||'')); });
  }

  function advPost(id,a){
    return postLed('adv:'+id,{
      on:a.doneOn, dir:'out', amt:num(a.amt,0), bank:a.bank,
      ev:a.ev||'', biz:a.biz||'가. 운영비',
      item:(a.item||'').slice(0,40),
      party:advName(a).slice(0,40),
      memo:(a.item||'대신결제')+' · '+advName(a)+' 대신결제',
      way:'계좌이체', payer:advName(a),
      note:'개인이 '+(a.on||'')+'에 '+(a.way||'개인카드')+'로 먼저 냈습니다'
    });
  }

  /* 돌려줬다 — 이때 비로소 회사 통장에서 돈이 나간다 */
  function advDone(id){
    var a=S.adv[id]; if(!a||!S.db) return;
    if(!ledEditable()) return errbar('회계 역할을 가진 사람만 정산할 수 있습니다');
    /* 화면에 지금 떠 있는 값을 그대로 읽는다. 바꾼 걸 상태에 담아두는 것만
       믿으면, 입력 신호 하나를 놓쳤을 때 조용히 빈 값으로 저장된다. */
    var g=function(id){ var e=$('#'+id); return e?e.value:''; };
    var on=String(g('adPayOn')||S.advOn||'').slice(0,10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(on)) return errbar('돌려준 날짜를 넣어주세요');
    var bk=g('adPayBank')||S.advBank;
    if(!bk) return errbar('어느 통장에서 보냈는지 골라주세요');
    var body=clone(a);
    body.state='done'; body.doneOn=on; body.bank=bk;
    body.doneBy=S.me.id||''; body.updatedAt=nowISO();
    S.db.doc('adv/'+id).set(body).then(function(){
      return advPost(id,body);
    }).then(function(){
      S.advPay=null; S.advBank=''; S.advOn='';
      flash(won(num(a.amt,0))+' 정산 · 장부에 넣었습니다'); render();
    }).catch(function(e){ errbar('정산 실패 '+(e&&e.code||'')); });
  }

  /* 되돌리기 — 장부 줄까지 같이 걷어낸다 */
  function advUndo(id){
    var a=S.adv[id]; if(!a||!S.db) return;
    if(!ledEditable()) return errbar('회계 역할을 가진 사람만 되돌릴 수 있습니다');
    var body=clone(a);
    body.state='open'; delete body.doneOn; delete body.bank; delete body.doneBy;
    body.updatedAt=nowISO();
    S.db.doc('adv/'+id).set(body).then(function(){
      var lid=ledBySrc('adv:'+id);
      if(lid) return S.db.doc('ledger/'+lid).delete();
    }).then(function(){ S.advBack=null; flash('되돌렸습니다'); render(); })
     .catch(function(e){ errbar('되돌리기 실패 '+(e&&e.code||'')); });
  }

  function delAdv(id){
    var a=S.adv[id]; if(!a||!S.db) return;
    if(!advOwn(a)) return errbar('올린 사람만 지울 수 있습니다');
    if(a.state==='done'&&!ledEditable())

      var lid=ledBySrc('adv:'+id);
      if(lid) return S.db.doc('ledger/'+lid).delete();

  }

  /* ─── 예산 ───
     예산은 「쓰기로 한 돈」이고 장부는 「실제로 쓴 돈」이다. 둘을 나란히
     놓지 않으면 넘긴 걸 다 쓰고 나서야 안다. 대표가 행사마다 손으로
     「최종 예산 대비 초과 746,000원」을 계산하던 게 이 자리다.

     한 줄은 이렇게 생겼다.
       y    연도
       biz  사업 구분   — 사업 예산일 때
       ev   행사        — 행사 예산일 때 (biz 는 비운다)
       m    '' 이면 한 해 전체, '01'~'12' 면 그 달
       amt  금액 · memo 메모
  */
  function bgYear(){ return S.bgY || String(new Date().getFullYear()); }
  function bgList(){
    return Object.keys(S.budgets).map(function(k){
      var o=clone(S.budgets[k]); o.id=k; return o;
    }).filter(function(o){ return String(o.y||'')===bgYear(); });
  }
  function bgYears(){
    var m={}; m[String(new Date().getFullYear())]=1;
    Object.keys(S.budgets).forEach(function(k){ var y=String((S.budgets[k]||{}).y||''); if(y) m[y]=1; });
    return Object.keys(m).sort().reverse();
  }
  /* 실제로 나간 돈. 통장 사이 이동은 회사 밖으로 나간 게 아니다. */
  function spentBiz(biz,y,m){
    var out=0;
    Object.keys(S.ledger).forEach(function(k){
      var r=S.ledger[k]||{};
      if(r.dir!=='out') return;
      if(r.biz!==biz) return;
      var on=String(r.on||'');
      if(on.slice(0,4)!==String(y)) return;
      if(m && on.slice(5,7)!==m) return;
      out+=num(r.amt,0);
    });
    return out;
  }
  function spentEv(evId){ return evLedger(evId).out; }
  function bgSpent(b){
    return b.ev ? spentEv(b.ev) : spentBiz(b.biz, b.y, b.m||'');
  }
  function bgRate(b){
    var a=num(b.amt,0); if(a<=0) return 0;
    return bgSpent(b)/a;
  }
  function bgTotals(){
    var L=bgList(), plan=0, used=0;
    L.forEach(function(b){ plan+=num(b.amt,0); used+=bgSpent(b); });
    return {plan:plan, used:used, left:plan-used, rate:plan>0?used/plan:0, n:L.length};
  }
  function saveBudget(id,body){
    if(!S.db) return Promise.resolve();
    if(!ledEditable()) return Promise.reject({code:'회계 역할을 가진 사람만 고칠 수 있습니다'});
    var ref=id?S.db.doc('budgets/'+id):S.db.collection('budgets').doc();
    body.updatedAt=nowISO(); body.by=S.me.id||'';
    if(!id) body.createdAt=nowISO();
    return ref.set(body);
  }
  function saveBgForm(){
    var v=function(id){ var e=$('#'+id); return e?e.value:''; };
    var kind=v('bgKind');
    var amt=num(v('bgAmt'),0);
    if(amt<=0) return errbar('예산 금액을 넣어주세요');
    var body={ y:bgYear(), amt:amt, memo:v('bgMemo').trim(), m:'', biz:'', ev:'' };
    if(kind==='ev'){
      body.ev=v('bgEv');
      if(!body.ev) return errbar('행사를 골라주세요');
    } else {
      body.biz=v('bgBiz');
      if(!body.biz) return errbar('사업을 골라주세요');
      body.m=v('bgM')||'';
    }
    var id=S.bgEdit==='new'?null:S.bgEdit;
    saveBudget(id,body).then(function(){
      S.bgEdit=null; S.bgKind=''; S.bgDraft=null; flash('저장했습니다'); render();
    }).catch(function(e){ errbar('저장 실패 '+(e&&(e.code||e.message)||'')); });
  }
  function delBudget(id){
    if(!S.db||!ledEditable()) return errbar('회계 역할을 가진 사람만 지울 수 있습니다');
    S.db.doc('budgets/'+id).delete().then(function(){
      S.bgDel=null; flash('지웠습니다'); render();
    }).catch(function(e){ errbar('삭제 실패 '+(e&&e.code||'')); });
  }

  /* 집행률 막대. 넘기면 빨갛게, 90%를 넘으면 주황으로 미리 알린다. */
  function bgBar(rate){
    var pct=Math.min(1,rate)*100;
    var col = rate>1 ? 'var(--bad)' : (rate>0.9 ? 'var(--warn)' : 'var(--accent)');
    return '<div style="height:7px;background:var(--line);border-radius:4px;overflow:hidden">'+
      '<div style="height:100%;width:'+pct.toFixed(1)+'%;background:'+col+'"></div></div>';
  }

  function saveLedForm(){
    var v=function(id){ var e=$('#'+id); return e?e.value:''; };
    var dir=v('ldDir')||'out';
    var on=v('ldOn');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(on)) return errbar('날짜를 넣어주세요');
    var amt=num(v('ldAmt'),0);
    if(!amt) return errbar('금액을 넣어주세요');
    /* 시트처럼 마이너스를 넣으시면 방향을 뒤집는다.
       '출금 -298,000' 은 결국 298,000 이 들어온 것이다. */
    if(amt<0){
      amt=-amt;
      if(dir==='out') dir='in';
      else if(dir==='in') dir='out';
    }
    var bank=v('ldBank');
    if(!bank) return errbar('통장을 골라주세요');

    var body={ on:on, dir:dir, amt:amt, bank:bank,
      memo:v('ldMemo').trim(), note:v('ldNote').trim() };

    if(dir==='move'){
      var to=v('ldTo');
      if(!to) return errbar('받은 통장을 골라주세요');
      if(to===bank) return errbar('같은 통장끼리는 옮길 수 없습니다');
      body.to=to;
      if(!body.memo) body.memo='통장 이동';
    } else {
      body.biz=v('ldBiz'); body.item=v('ldItem').trim(); body.party=v('ldParty').trim();
      body.way=v('ldWay'); body.payer=v('ldPayer').trim();
      body.ev=(body.biz==='다. 예배운영')?v('ldEv'):'';
    }

    var lid=S.ledEdit==='new'?null:S.ledEdit;
    saveLed(lid,body).then(function(){
      S.ledEdit=null; S.ledDraft=null;
      flash(dir==='move'
        ? won(amt)+' 을 '+bankName(bank)+' → '+bankName(body.to)+' 로 옮겼습니다'
        : '저장했습니다');
      render();
    }).catch(function(e){ errbar('저장 실패 '+(e&&e.code||'')); });
  }

        '<div class="field"><label for="bkNote">비고</label>'+
          '<input id="bkNote" value="'+esc(cur.note||'')+'" placeholder="은행 · 명의 등"></div>'+
        '<div class="actions"><button class="btn primary" id="bkSave">저장</button>'+

    }

    var rows=L.map(function(b){

      });

        '<td style="color:var(--muted);font-size:12.5px">'+esc(b.openOn||'—')+'<br>'+won(num(b.open,0))+'</td>'+
        '<td class="num">'+n+'</td>'+
        '<td class="num" style="font-family:var(--font-num);font-weight:600'+(bal<0?';color:var(--bad)':'')+'">'+won(bal)+'</td>'+
        (canEdit?'<td style="width:120px">'+
          (S.bankDel===b.id
            ? '<button class="btn danger sm" data-bkyes="'+esc(b.id)+'">삭제</button>'+
              '<button class="btn sm" id="bkNo" style="margin-left:5px">취소</button>'
            : '<button class="btn sm" data-bkedit="'+esc(b.id)+'">고치기</button>'+
              (n?'':'<button class="del" data-bkdel="'+esc(b.id)+'" aria-label="삭제" style="margin-left:4px">×</button>'))+
        '</td>':'')+

    app.innerHTML=
      '<div class="stack">'+
      acctTabs()+
      form+
